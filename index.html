<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Assignment Board — Ngapori Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-dark:#14261D; --sand:#F5F1E6; --paper:#FFFFFF; --ink:#1B1B18; --ink-soft:#5B5A52;
  --line:#DCD5C4; --ok:#2E7D32; --warn:#C77700; --danger:#B3261E; --irrigation:#3A78C9; --musthave:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; } }
:root[data-theme="dark"]{ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; }
*{box-sizing:border-box;} html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topbar .brand{font-weight:800;font-size:15px;}
.topbar .sub{font-size:11px;color:#C9D6CD;}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 11px;border-radius:8px;}
.conn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;}
.conn[data-s=online]{background:#E4F1E5;color:var(--ok);} .conn[data-s=demo]{background:#FBEBD6;color:var(--warn);}
.conn[data-s=offline],.conn[data-s=error]{background:#F7DEDB;color:var(--danger);}
.demo-strip{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:5px 16px;text-align:center;}
.wrap{flex:1;display:flex;min-height:0;}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.toolbar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--paper);}
.toolbar select,.toolbar input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.seg{display:flex;gap:4px;background:var(--sand);padding:3px;border-radius:9px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-soft);}
.seg button.active{background:var(--forest);color:#fff;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);padding:8px 14px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mapscroll{flex:1;overflow:auto;padding:14px;}
.bed{stroke:var(--line);stroke-width:1;cursor:pointer;}
.bed:hover{stroke:var(--forest);stroke-width:2;}
.bed.selected{stroke:var(--forest);stroke-width:3;}
.bed.proposed{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3;}
.bed.proposed:hover{stroke:var(--forest);stroke-width:2;stroke-dasharray:none;}
.bed.proposed.selected{stroke:var(--forest);stroke-width:3;stroke-dasharray:none;}
.sw.sw-proposed{background:#FBEBD6;border:1.5px dashed var(--warn);width:11px;height:11px;}
.sw.sw-avail{background:#EEE;border:1px solid var(--line);}
.badge text,.badge circle{pointer-events:none;}
.bed{pointer-events:all;}
.notice{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:7px 14px;border-bottom:1px solid var(--line);}
.seg .n{opacity:.65;font-weight:600;margin-left:3px;}
.blocklabel{font-size:9px;font-weight:800;fill:var(--ink-soft);}
.panel{width:360px;max-width:92vw;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:margin .15s;}
.panel.closed{display:none;}
.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.panelhead h2{margin:0;font-size:16px;}
.panelhead .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panelhead button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.tabs{display:flex;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:none;padding:10px 4px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--forest);border-color:var(--forest);}
.panelbody{flex:1;overflow-y:auto;padding:14px 16px;}
.card{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.row span:first-child{color:var(--ink-soft);} .row span:last-child{font-weight:700;text-align:right;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;}
.chip-ok{background:#E4F1E5;color:var(--ok);} .chip-warn{background:#FBEBD6;color:var(--warn);} .chip-danger{background:#F7DEDB;color:var(--danger);} .chip-neutral{background:var(--line);color:var(--ink-soft);}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
.sheet .btn:disabled{opacity:.38;cursor:not-allowed;background:transparent;border-style:dashed;} .sheet .btn-primary:disabled{background:var(--forest);border-style:solid;}
.btn-primary{background:var(--forest);color:#fff;} .btn-outline{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
.btn-danger{background:var(--danger);color:#fff;} .btn-cta{padding:10px 20px;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.15);}
.proposal{border-left:4px solid var(--warn);} .proposal .plabel{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
.proposal .pname{font-size:15px;font-weight:800;} .proposal .pcode{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.qfocus{outline:3px solid var(--forest);outline-offset:2px;}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 10px;line-height:1.45;}
.btn-reject{background:transparent;color:var(--danger);border:1.5px solid var(--danger);} .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:600;}
.empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;}
.field{margin-bottom:12px;} .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.loginwrap{max-width:380px;margin:60px auto;padding:0 16px;}
.error{background:#F7DEDB;color:var(--danger);padding:10px 13px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:420px;border-radius:14px;padding:18px;max-height:86vh;overflow-y:auto;margin:16px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;}
.sheet.wide{max-width:720px;}
.astrip{gap:6px;padding-top:6px;padding-bottom:6px;} .alabel{font-size:11px;font-weight:800;color:var(--ink-soft);margin-right:4px;text-transform:uppercase;letter-spacing:.03em;}
.astat{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
.astat b{font-size:15px;} .astat span{color:var(--ink-soft);font-weight:600;} .astat.warn{border-color:var(--warn);}
.pill{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:#fff;color:var(--forest);font-size:11px;font-weight:800;margin-left:4px;}
.qgh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:14px 0 6px;position:sticky;top:-18px;background:var(--paper);padding:6px 0;z-index:1;}
.qtop{display:flex;justify-content:space-between;gap:10px;} .qsub{font-size:12px;color:var(--ink-soft);} .qdates{font-size:11.5px;color:var(--ink-soft);text-align:right;}
.qrec{margin:10px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;} .qrec>span:first-child{color:var(--ink-soft);font-size:11.5px;} .qrec b{font-size:19px;color:var(--forest);}
.checks{list-style:none;margin:6px 0 10px;padding:0;font-size:12px;} .checks li{padding:2px 0;} .checks li.ok{color:var(--ok);} .checks li.w{color:var(--warn);font-weight:600;}
.qbtns{display:flex;gap:8px;} .qbtns .btn{margin:0;} .qwarn{border-color:var(--warn);}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 10px;} .vcell{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;line-height:1.3;} .vcell .vh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:12px;margin-bottom:2px;} .vcell .vd{color:var(--ink-soft);} .vcell.ok{border-color:#B9D9BC;background:#F3FAF3;} .vcell.w{border-color:var(--warn);background:#FFF8EE;}
.leftpanel{width:280px;max-width:80vw;overflow-y:auto;padding:12px;border-right:1px solid var(--line);background:var(--paper);}
.leftpanel .card{cursor:pointer;}
table.rotmatrix th,table.rotmatrix td{border-bottom:1px solid var(--line);}
@media (max-width:760px){ .wrap{flex-direction:column;} .panel{width:100%;border-left:none;border-top:1px solid var(--line);max-height:60vh;} .leftpanel{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:32vh;} }
.seg.wrap{flex-wrap:wrap;}
/* ---- multi-assign ---- */
.sheet.xwide{max-width:900px;}
.ma-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
.ma-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;}
.ma-col{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;}
.ma-col h3{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
.ma-colhead{padding:10px 10px 8px;border-bottom:1px solid var(--line);}
.ma-colhead .seg{margin:8px 0 0;}
.ma-search{width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.ma-list{overflow-y:auto;max-height:44vh;padding:4px 6px 8px;}
.ma-grp{font-size:11px;font-weight:800;color:var(--ink-soft);margin:10px 4px 3px;text-transform:uppercase;letter-spacing:.03em;}
.ma-row{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.3;}
.ma-row:hover{background:var(--sand);} .ma-row.on{background:#E4F1E5;} :root[data-theme="dark"] .ma-row.on{background:#26382B;}
.ma-row input{margin-top:2px;width:16px;height:16px;accent-color:var(--forest);flex:none;}
.ma-row .d{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px;}
.ma-row .r{margin-left:auto;font-size:10.5px;color:var(--ink-soft);white-space:nowrap;padding-left:6px;}
.ma-tools{display:flex;gap:6px;padding:6px 8px 0;}
.ma-tools button{border:none;background:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--forest);cursor:pointer;padding:2px 4px;}
.ma-foot{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
.ma-sum{font-size:12.5px;margin-bottom:8px;line-height:1.5;} .ma-sum b{color:var(--forest);}
.ma-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.ma-chip{background:var(--sand);border:1px solid var(--line);border-radius:99px;font-size:11.5px;font-weight:600;padding:2px 4px 2px 10px;display:inline-flex;align-items:center;gap:4px;}
.ma-chip button{border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:14px;line-height:1;padding:0 4px;}
.ma-res{font-size:12px;margin:8px 0;padding:9px 11px;border-radius:9px;background:var(--sand);border:1px solid var(--line);} .ma-res .bad{color:var(--danger);font-weight:600;}

.dp-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;} .dp-hd .loc{color:var(--ink-soft);font-size:11.5px;}
.dp-box{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:12px;background:var(--paper);}
.dp-box>.t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--forest);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.dp-crew{max-height:132px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:2px 4px;}
.dp-pick{width:100%;font-family:inherit;font-size:13px;font-weight:600;padding:9px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin-bottom:4px;}
.dp-tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;} .dp-tools button{border:1.5px solid var(--line);background:var(--paper);color:var(--forest);font-family:inherit;font-size:11.5px;font-weight:700;border-radius:8px;padding:5px 9px;cursor:pointer;}
.dp-row{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35;} .dp-row:last-child{border-bottom:none;}
.dp-row input{margin-top:2px;width:16px;height:16px;accent-color:var(--forest);flex:none;} .dp-row.off{opacity:.55;} .dp-row.on{background:#E4F1E5;border-radius:6px;}
.dp-row .d{display:block;font-size:11px;color:var(--ink-soft);} .dp-row .st{margin-left:auto;flex:none;}
.dp-crewline{font-size:11px;margin:3px 0 0;color:var(--ink-soft);} .dp-crewline button{border:none;background:none;color:var(--forest);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0 3px;}
.dp-foot{position:sticky;bottom:-14px;background:var(--paper);padding:10px 0 4px;border-top:1px solid var(--line);margin-top:6px;z-index:2;}
.btn-ok{background:var(--ok);color:#fff;} .dc-sec{margin:0 0 16px;} .dc-sec>h2{font-size:12px;margin:14px 0 8px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--forest);}
.dc-bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 8px;} .dc-bar i{display:block;height:100%;background:var(--ok);}
.dc-step{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;} .dc-step:last-child{border-bottom:none;}
.dc-step .t{display:flex;justify-content:space-between;gap:8px;align-items:center;} .dc-step .who{margin:3px 0 0 22px;display:flex;flex-wrap:wrap;gap:4px;}
.dc-w{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;padding:3px 0;}
.dc-act{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:var(--sand);} .dc-act .h{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;margin-bottom:3px;}
.dc-mini{border:none;background:none;color:var(--forest);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:2px 4px;}
.ma-date{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;} .ma-date input{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.ma-plan{padding:6px 8px 8px;overflow-y:auto;max-height:44vh;}
.ma-pcard{border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:7px;background:var(--paper);}
.ma-pcard.need{border-color:var(--warn);background:#FFF9EA;}
.ma-ptop{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;font-size:12.5px;font-weight:700;}
.ma-ptop button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;}
.ma-pcard select{width:100%;margin-top:6px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:var(--paper);color:var(--ink);}
.ma-bulk{padding:8px;border-bottom:1px solid var(--line);} .ma-bulk label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.ma-bulk select{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12px;background:var(--paper);color:var(--ink);}
@media (max-width:760px){ .ma-cols{grid-template-columns:1fr;} .ma-list{max-height:30vh;} }

.field select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--paper);color:var(--ink);}
.task-title{font-weight:700;margin-bottom:4px;}
.syncrow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.syncrow button{background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--forest);cursor:pointer;padding:2px 4px;}
</style>

<body><div id="app"></div>
<script>
/* ============================== CONFIG ============================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';              // set to your Apps Script /exec URL to go live
const APP_NAME = 'ranch_aab';
const IS_DEMO = !WEB_APP_URL;
const REQUEST_TIMEOUT_MS = 20000;
const N_BLOCKS = 6, BEDS_PER_ROW = 8;   // 6 blocks laid out as grids; ~231 beds total (last block trimmed)
const TOTAL_BEDS = 231;
const CROPS = [['Lettuce','LET'],['Kale','KAL'],['Arugula','ARU'],['Radish','RAD'],['Mesclun Mix','MCH'],['Spinach','SPN']];
// These values are COHORT_PRODUCTION.Current_Stage exactly as ActivityEngine.gs
// writes them (its biology clock: Actual_DOB -> Crop_Day -> Current_Stage).
// This file never computes a stage itself - it only displays what the
// backend sends as bed.currentStage. Cohort_Status (PLANNED/PRE_PLANTING/
// ACTIVE/COMPLETE/TERMINATED) is a separate, manager-driven field written by
// AssignmentEngine.gs and shown alongside it, not conflated with it.
const CURRENT_STAGES = ['PRE_PLANTING','GROWING','HARVEST_READY','HARVEST_COMPLETE','TERMINATED'];
const STAGE_COLOR = { PRE_PLANTING:'#D8CFAE', GROWING:'#8FBF8A', HARVEST_READY:'#2E7D32', HARVEST_COMPLETE:'#7C8B98', TERMINATED:'#C9C2AE' };
const QUEUE_COLOR = { MUST_DO:'#B3261E', ATTENTION:'#C77700', ROUTINE:'#5B8FC9', NONE:'transparent' };
const EXC_LABEL = { NO_BLOCK_RULE:'No block rule for this crop', NO_BED_AVAILABLE:'No suitable bed available', NO_LOCATIONS_OF_TYPE:'No beds of this type', MISSING_DATES:'Missing planting / harvest dates', OUTSIDE_PLANTING_WINDOW:'Outside planting window' };
const APPROVE_CHUNK = 5;   // approvals per request: each one re-validates against the live sheets
const COHORT_STATUS_LABEL = { PLANNED:'Planned', PRE_PLANTING:'Assigned · awaiting planting', ACTIVE:'Active', COMPLETE:'Complete', TERMINATED:'Terminated' };

/* ============================== STATE ============================== */
const state = { managerId:null, name:null, role:null, token:null, beds:[], sessions:[], exceptions:[], harvestReady:[], queueByBed:{}, workers:[], activityCatalog:[], eligibleLocations:[],
  aq:{ loaded:false, error:'', counts:{}, proposed:[], exceptions:[], plantingReady:[], generatedDate:'' }, candidates:{ locations:[] },
  todayById:{}, board:{ loaded:false, year:null, beds:[], cohorts:[], byKey:{}, unplaced:[], stats:{} }, cover:{},
  pp:{} /* Planting Plan cache, keyed "year|blockId" -> getPlanningContext() result, or {error} */ };
const ui = { screen:'login', loginErr:'', overlay:'stage', selectedBed:null, tab:'overview', modal:null, modalDraft:{}, toast:'', queueTab:'', focusCohort:null, focusPending:false, generating:false, resetScroll:false, filter:'ALL', year:new Date().getFullYear(), loading:false,
  pMode:'plan', pBlock:'B1', pYear:2027, pSelectedCrop:null, pModifying:false, pSelBeds:[], pAdvOpen:false, pEditingRotation:false, pRotDraft:{},
  ppSelectedKey:null /* selected crop group key "cropId|wave" in real Planting Plan mode */, ppSelectedBed:null, ppBedModify:false, ppBedDraftCrop:'', ppBusy:false, ppHistoryOpen:false,
  crSelectedId:null, crFilter:'' /* Crop Reference mode: selected crop id, list search text */ };
const $=(s,r=document)=>r.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================== API ============================== */
function apiError(message, code){ const e=new Error(message); e.code=code; e.isApiError=true; return e; }
async function apiCall(action, payload={}, timeoutMs){
  const body=Object.assign({}, payload);
  if(state.token && body.token===undefined) body.token=state.token;
  let json;
  try{
    if(IS_DEMO){ json = await mockBackend(action, body); }
    else{
      const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), timeoutMs||REQUEST_TIMEOUT_MS);
      let resp;
      try{ resp=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},body)),redirect:'follow',signal:ctrl.signal}); }
      finally{ clearTimeout(timer); }
      if(!resp.ok) throw apiError('The server answered with status '+resp.status+'.','HTTP');
      json = JSON.parse(await resp.text());
    }
  }catch(err){
    setConn(navigator.onLine===false?'offline':'error');
    if(err && err.isApiError) throw err;
    throw apiError('Could not reach the server.','NETWORK');
  }
  setConn(IS_DEMO?'demo':'online');
  if(json && json.ok===false){
    const e=apiError(json.error||'The request failed.', json.code||'API');
    if(state.managerId && ['UNAUTHENTICATED','ROLE_NOT_ALLOWED'].includes(String(json.code))) forceLogout(e.message);
    throw e;
  }
  return json.data!==undefined ? json.data : json;
}
function setConn(s){ const el=$('#conn'); if(!el) return; el.dataset.s=s; el.textContent={online:'Connected',demo:'Demo data',offline:'Offline',error:'Server not reachable'}[s]||s; }
function forceLogout(msg){ Object.assign(state,{managerId:null,name:null,role:null,token:null}); ui.screen='login'; ui.loginErr=msg||''; render(); }

/* ============================== DATA LOAD ============================== */
/* Fetch get-manager-today-view and apply it. Used by loadToday and refreshLive so both log the same timings.
 * The server adds d.timings (ms per stage, see buildTodayView_ in Code_main.gs); compare with the round trip here:
 * server total << round trip means the time is spent outside buildTodayView_ (Apps Script start-up, auth, network). */
async function fetchTodayView(){
  const t0=Date.now();
  const d=await apiCall('get-manager-today-view', {}, 60000);
  if(d && d.timings) console.log('[today-view] round trip '+(Date.now()-t0)+' ms; server stages (ms):', d.timings);
  return d||{};
}
function applyTodayView(d){
  state.beds = d.beds||[]; state.sessions=d.sessions||[]; state.exceptions=d.exceptions||[];
  state.harvestReady=d.harvestReady||[]; state.queueByBed=d.queueByBed||{}; state.workers=d.workers||[];
  state.activityCatalog=d.activityCatalog||[];
  state.todayById={}; state.beds.forEach(b=>{ state.todayById[b.id]=b; });
  state.todayError=''; state.lastSync=new Date();
}
/* Overlapping loads are coalesced: while one is running, any further loadToday() call (a Refresh tap, or a write action
 * that wants fresh data afterwards) queues exactly ONE follow-up run and awaits it, so callers still get data read after
 * their change, but the server never has several of these heavy requests running at once. */
let _loadRun=null, _loadAgain=false;
function loadToday(){
  if(_loadRun){ _loadAgain=true; return _loadRun; }
  _loadRun=(async()=>{ do{ _loadAgain=false; await loadTodayOnce(); } while(_loadAgain); })().finally(()=>{ _loadRun=null; });
  return _loadRun;
}
async function loadTodayOnce(){
  ui.loading=true; state.todayPending=true; render();
  // The bed data is applied the moment it arrives. It no longer waits for the cohort board and assignment queue,
  // which load in parallel and are not needed to open a bed.
  const todayP = fetchTodayView().then(
    d=>{ applyTodayView(d); return d; },
    e=>{ state.todayError=(e&&e.message)||'request failed'; throw e; }
  ).finally(()=>{ state.todayPending=false; render(); });
  const [today, board, aq] = await Promise.allSettled([ todayP, loadCohortBoard(), loadAssignmentQueue() ]);
  ui.loading=false;
  setConn(IS_DEMO?'demo':'online'); render();
  if(today.status==='rejected') toast(today.reason.message);
  else if(board.status==='rejected') toast('Cohort board: '+board.reason.message);
  else if(aq.status==='rejected') toast('Assignment queue: '+aq.reason.message);
}

/* ============================== COHORT BOARD: COHORT_PRODUCTION -> BEDS ==============================
 * get-cohort-board (AssignmentEngine.gs getCohortBoard) returns COHORT_PRODUCTION rows where
 * Location_ID is not blank, Cohort_Status is not CANCELLED and Planning_Year = ui.year, plus the
 * BED_MASTER grid. Location_ID is parsed here and the cohort tile is placed on the matching bed.
 * Accepted forms: B1-04 / BLK1-04 / BLOCK1-04 -> Block 1, Bed 04;  Z5-03 / ZONE5-03 -> Zone 5, Bed 03.
 * No stage math here: Current_Stage and Cohort_Status are displayed exactly as the backend sends them. */
/* Bed-map filters count BEDS (physical locations). Crop-lifecycle counts belong on the production dashboard. */
const FILTERS = [['ALL','All'],['OCCUPIED','Occupied'],['PROPOSED','Proposed'],['AVAILABLE','Available'],['UNVERIFIED','Not verified'],['POST_HARVEST','Post-harvest'],['EXCEPTION','Exceptions']];
/* A bed is in exactly one of three states: OCCUPIED (a cohort has this Location_ID in COHORT_PRODUCTION),
 * PROPOSED (no cohort placed, but the assignment engine has reserved it as a recommendation in
 * COHORT_ASSIGNMENT_QUEUE, awaiting manager approval), or AVAILABLE (neither). PROPOSED is display only:
 * nothing is written to COHORT_PRODUCTION until the manager approves. */
const PROPOSED_FILL = '#FBEBD6';
const UNVERIFIED_FILL = '#E4E0EE';   /* BED_MASTER.Bed_Status never initialised - physical readiness not yet verified by a manager */
const POST_HARVEST_FILL = '#F1DFA8';   /* cohort-less bed in bed-level post-harvest turnover (BED_STATUS_RULES R14) */
const DARK_FILLS = ['#2E7D32','#7C8B98','#B3261E','#C77700','#5B8FC9'];
function parseLocationId(id){
  const t=String(id==null?'':id).trim().toUpperCase().replace(/\s+/g,'');
  let m=t.match(/^(?:BLK|BLOCK|B)(\d+)-(\d+)$/);
  if(m) return { kind:'BLOCK', group:+m[1], bed:+m[2], label:'Block '+(+m[1]) };
  m=t.match(/^(?:ZONE|Z)(\d+)-(\d+)$/);
  if(m) return { kind:'ZONE', group:+m[1], bed:+m[2], label:'Zone '+(+m[1]) };
  return null;
}
const locKey = p => p.kind+p.group+'-'+p.bed;
function cohortStage(c){
  const cs=String(c.cohortStatus||'').toUpperCase(), st=String(c.currentStage||'').toUpperCase();
  if(cs==='TERMINATED') return 'TERMINATED';
  if(cs==='COMPLETE') return 'HARVEST_COMPLETE';
  return st || (cs==='PRE_PLANTING' ? 'PRE_PLANTING' : '');
}
const isLive = c => !['TERMINATED','COMPLETE'].includes(String(c.cohortStatus||'').toUpperCase());
const cohortStart = c => c.actualDob||c.plannedDob||'9999';
// A bed is a timeline: show the earliest LIVE cohort (the one in the bed now), else the latest finished one.
function pickCohort(list){ if(!list||!list.length) return null; const live=list.filter(isLive); return live.length ? live.slice().sort((a,b)=>cohortStart(a).localeCompare(cohortStart(b)))[0] : list[list.length-1]; }
async function loadCohortBoard(){
  let d;
  try{ d = await apiCall('get-cohort-board', { year: ui.year }); }
  catch(e){ state.board.error = (e.code?('['+e.code+'] '):'')+e.message; throw e; }
  state.board.error = '';
  const cohorts=(d&&d.cohorts)||[], byKey={}, unplaced=[];
  cohorts.forEach(c=>{ const p=parseLocationId(c.locationId); if(!p){ unplaced.push(c); return; } (byKey[locKey(p)]=byKey[locKey(p)]||[]).push(c); });
  state.board = { error:'', loaded:true, year:ui.year, beds:(d&&d.beds)||[], cohorts, byKey, unplaced, stats:(d&&d.stats)||{} };
}
function gridBeds(){
  return state.board.beds.length ? state.board.beds.map(x=>({ id:x.bedId, blockId:x.blockId, locationType:x.locationType })) : state.beds;
}
/* Proposals keyed by normalised bed id (same parser as the grid, so 'B1-10' / 'BLK1-10' / 'B1-010' all agree).
 * Source: get-assignment-queue -> proposed[] (Status PROPOSED, cohort still unassigned). Exceptions carry no bed. */
function bedKey(id){ const p=parseLocationId(id); return p ? locKey(p) : String(id==null?'':id).trim().toUpperCase(); }
function proposalIndex(){
  const src=state.aq.proposed||[];
  if(proposalIndex._src===src && proposalIndex._map) return proposalIndex._map;
  const m={};
  src.forEach(p=>{ if(!String(p.recommendedBed||'').trim()) return; (m[bedKey(p.recommendedBed)]=m[bedKey(p.recommendedBed)]||[]).push(p); });
  Object.keys(m).forEach(k=>m[k].sort((a,b)=>String(a.plannedDob).localeCompare(String(b.plannedDob))||String(a.cohortId).localeCompare(String(b.cohortId))));
  proposalIndex._src=src; proposalIndex._map=m; return m;
}
/* UNVERIFIED = BED_MASTER.Bed_Status never initialised. It says nothing about the bed's history; it means no manager has attested the bed is physically ready. */
function bedState(v){ return v.cohortId ? 'OCCUPIED' : (v.postHarvest&&v.postHarvest.bedLevel ? 'POST_HARVEST' : (String(v.bedStatus||'').toUpperCase()==='UNVERIFIED' ? 'UNVERIFIED' : (v.proposals&&v.proposals.length ? 'PROPOSED' : 'AVAILABLE'))); }
function bedView(b){
  const v = Object.assign({}, state.todayById[b.id]||{}, { id:b.id, blockId:b.blockId, locationType:b.locationType||(state.todayById[b.id]||{}).locationType||'' });
  v.proposals = proposalIndex()[bedKey(b.id)] || [];
  if(!state.board.loaded) return v;
  const p=parseLocationId(b.id), c = p ? pickCohort(state.board.byKey[locKey(p)]) : null;
  if(c){
    Object.assign(v, { cohortId:c.cohortId, cropId:c.cropId, cropName:c.cropName, cohortStatus:c.cohortStatus, currentStage:cohortStage(c),
      plannedDob:c.plannedDob||'', plantingDate:c.actualDob||'', harvestWindow:(c.harvestWindowStart||c.harvestWindowEnd)?((c.harvestWindowStart||'?')+' → '+(c.harvestWindowEnd||'?')):'' });
  }else{
    Object.assign(v, { cohortId:'', cropId:'', cropName:'', cohortStatus:'', currentStage:'', plannedDob:'', plantingDate:'', harvestWindow:'' });
  }
  return v;
}
function bedViewById(id){ const b=gridBeds().find(x=>x.id===id); return b?bedView(b):null; }
function bedMatches(v){
  if(ui.filter==='ALL') return true;
  if(ui.filter==='EXCEPTION') return bedExceptions(v.id).some(x=>x.status!=='RESOLVED');
  if(ui.filter==='OCCUPIED') return bedState(v)==='OCCUPIED';
  if(ui.filter==='PROPOSED') return bedState(v)==='PROPOSED';
  if(ui.filter==='AVAILABLE') return bedState(v)==='AVAILABLE';
  if(ui.filter==='UNVERIFIED') return bedState(v)==='UNVERIFIED';
  if(ui.filter==='POST_HARVEST') return bedState(v)==='POST_HARVEST';
  return true;
}
function filterCounts(views){
  const n={ ALL:views.length, OCCUPIED:0, PROPOSED:0, AVAILABLE:0, UNVERIFIED:0, POST_HARVEST:0, EXCEPTION:0 };
  views.forEach(v=>{
    n[bedState(v)]++;
    if(bedExceptions(v.id).some(x=>x.status!=='RESOLVED')) n.EXCEPTION++;
  });
  return n;
}
function setFilter(k){ ui.filter=k; render(); }
function setYear(y){ ui.year=+y; loadToday(); }
function boardNotice(views){
  const b=state.board; if(!b.loaded) return '';
  const gridKeys=new Set(gridBeds().map(x=>{ const p=parseLocationId(x.id); return p?locKey(p):x.id; }));
  const orphans=b.cohorts.filter(c=>{ const p=parseLocationId(c.locationId); return !p || !gridKeys.has(locKey(p)); });
  const placed=views.filter(v=>v.cohortId).length;
  if(orphans.length) return `${orphans.length} cohort(s) have a Location_ID that matches no bed: ${orphans.slice(0,6).map(c=>esc(c.cohortId+' → '+c.locationId)).join(', ')}${orphans.length>6?'…':''}`;
  if(!b.cohorts.length){
    const un=b.stats&&b.stats.unassigned, tot=b.stats&&b.stats.yearRows;
    const np=views.filter(v=>bedState(v)==='PROPOSED').length;
    return `No cohorts in ${ui.year} have a Location_ID yet${tot!=null?` (${tot} cohort rows in COHORT_PRODUCTION, ${un!=null?un:tot} unassigned)`:''}. ${np?`${np} bed${np===1?' is':'s are'} reserved as proposals awaiting approval - `:''}Open “Assignments” to review the recommended beds.`;
  }
  return '';
}

/* Assignment status (where cohorts are in the approval workflow) is a different dimension from the

function filterBar(){

function mapSVG(){
  const cols=BEDS_PER_ROW, cw=84, ch=58, gap=6, blockGap=26;
  const grid=gridBeds();
  const blocks=[...new Set(grid.map(b=>b.blockId))];
  let svg='', curY=16;
  blocks.forEach(blk=>{
    const beds=grid.filter(b=>b.blockId===blk), rows=Math.ceil(beds.length/cols);
    svg += `<text class="blocklabel" x="10" y="${curY-5}">${esc(blk)}</text>`;
    beds.forEach((b,idx)=>{
      const v=bedView(b), match=bedMatches(v), st=bedState(v), has=st==='OCCUPIED', prop=st==='PROPOSED', ph=st==='POST_HARVEST', pr=prop?v.proposals[0]:null;
      const col=idx%cols, row=Math.floor(idx/cols), bx=10+col*(cw+gap), by=curY+row*(ch+gap);
      const exc=bedExceptions(v.id).some(x=>x.status!=='RESOLVED'), hr=state.harvestReady.some(h=>h.bedId===v.id), sess=bedSessions(v.id).length;
      const qf=bedFill(v), fill=has?qf:(ph?POST_HARVEST_FILL:st==='UNVERIFIED'?UNVERIFIED_FILL:ui.overlay==='queue'?(qf!=='transparent'?qf:(prop?PROPOSED_FILL:qf)):(prop?PROPOSED_FILL:'#EEE')), tc=DARK_FILLS.includes(fill)?'#fff':'#1B1B18';
      const bedNo=esc(String(v.id).split('-')[1]||v.id);
      svg += `<g class="badge" opacity="${match?1:0.28}">
        <rect class="bed ${prop?'proposed':''} ${ui.selectedBed===v.id?'selected':''}" data-bed="${esc(v.id)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}"></rect>
        <text x="${bx+6}" y="${by+11}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${bedNo}</text>
        ${has&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(v.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(v.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">${esc((v.currentStage||v.cohortStatus||'').replace(/_/g,' '))}</text>`:''}
        ${prop&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(pr.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(pr.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">PROPOSED${v.proposals.length>1?' +'+(v.proposals.length-1):''}</text>`:''}
        ${!has&&!prop&&match?`<text x="${bx+cw/2}" y="${by+(ph&&(v.postHarvest.openSteps||[]).length?30:36)}" text-anchor="middle" font-size="8" font-weight="700" fill="${tc}">No crop assigned</text>
        ${ph&&(v.postHarvest.openSteps||[]).length?`<text x="${bx+cw/2}" y="${by+44}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">${(v.postHarvest.openSteps||[]).length} open</text>`:''}`:''}
        ${sess?`<circle cx="${bx+cw-7}" cy="${by+7}" r="4" fill="#1F3A2E"></circle>`:''}
        ${exc?`<circle cx="${bx+cw-19}" cy="${by+7}" r="4" fill="var(--danger)"></circle>`:''}
        ${hr?`<circle cx="${bx+cw-7}" cy="${by+ch-7}" r="4" fill="var(--ok)"></circle>`:''}
      </g>`;
    });
    curY += rows*(ch+gap) + blockGap;
  });
  const W=10+cols*(cw+gap);
  return `<svg viewBox="0 0 ${W} ${curY}" width="${W}" height="${curY}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

/**
 * Manager write-back actions, gated on Cohort_Status - these call
 * AssignmentEngine.gs only (assignBed / verifyPlanting / moveCohort /
 * completeCohort / terminateCohort). No crop-day or stage math happens here;
 * this board only ever displays what the backend already computed.
 */
function confidenceOf(p){ return (p.reasons||[]).some(r=>String(r).startsWith('⚠')) ? ['Review needed','chip-warn'] : ['Match','chip-ok']; }
/* An unoccupied bed is either PROPOSED (the engine reserved it in COHORT_ASSIGNMENT_QUEUE, awaiting approval) or
 * AVAILABLE. A proposal is labelled as pending and never presented as something this bed has: the bed is not
 * occupied and nothing is written to COHORT_PRODUCTION until a manager approves it in Assignments. */
function proposalCards(b){
  return b.proposals.map(p=>{ const cf=confidenceOf(p); return `<div class="card proposal"><div class="plabel">Pending assignment</div>
      <div class="row"><span>Pending</span><span>${esc(p.cropName)} ${esc(p.cohortId)}</span></div>

      <div class="qsub" style="margin-top:4px;">Approval required</div>
      <button class="btn btn-primary" style="margin:8px 0 0;" onclick="openQueue('proposed','${esc(p.cohortId)}')">Review Assignment</button></div>`; }).join('');
}
function pendingBlock(b, occupied){

/* ============================== ACTIONS & LIVE TASKS (Bed Profile command center) ==============================
 * Every activity a manager can dispatch is reachable from one panel, grouped into four working categories.
 * The category is only a filter over the live ACTIVITY_REFERENCE catalog (Activity_Domain / Post_Harvest_Sequence);
 * what a bed may actually start is still decided by startableActivities() here and validateActivity_ on the server. */
const ACTION_CATS=[['ALL','All'],['PREP','Soil & Bed Prep'],['CARE','Crop Maintenance'],['HARVEST','Harvest Operations'],['POST','Post-Harvest & Sanitation']];
function actCatOf(a){
  if(Number(a.postHarvestSequence)>0) return 'POST';
  const d=String(a.domain||'').trim().toLowerCase();
  if(d==='prep'||d==='planting') return 'PREP';
  if(d==='cropcare'||d==='state') return 'CARE';
  if(d==='harvest') return 'HARVEST';
  if(['field cleanup & prep','cover cropping','next-season prep','post-harvest'].indexOf(d)!==-1) return 'POST';
  return 'OTHER';   /* shown under All only */
}
function actState(){ if(!ui.act) ui.act={cat:'ALL',activity:'',workerId:''}; return ui.act; }
function setActCat(k){ const a=actState(); a.cat=k; a.activity=''; render(); }
function setActActivity(n){ actState().activity=n; render(); }
function setActWorker(id){ actState().workerId=id; render(); }
async function assignTask(bedId){
  const a=actState(), w=a.workerId;
  if(!a.activity){ toast('Choose an activity first.'); return; }
  if(!w){ toast(state.workers.length?'Choose a worker first.':'No workers are available to assign.'); return; }
  const act=a.activity; a.activity='';
  await startSessionFor(bedId, act, w);
}
/* "ACT_018: Harvest" when the backend sends the Activity_ID (catalog id / session activityId), else just the name. */
function actLabel(name,s){
  const c=(state.activityCatalog||[]).find(x=>x.name===name);
  const id=(s&&s.activityId)||(c&&(c.id||c.activityId))||'';
  return id ? id+': '+name : name;
}
/* Pending = manager dispatched, worker has not started. In progress = worker's clock is running (or paused / has an exception). */
function taskStatus(s){
  const k=String(s.status||'').toUpperCase();
  if(k==='ASSIGNED') return ['Pending','chip-warn'];
  if(k==='ACTIVE') return ['In progress','chip-ok'];
  if(k==='PAUSED') return ['In progress · paused','chip-warn'];
  if(k==='EXCEPTION') return ['In progress · exception','chip-danger'];
  if(k==='COMPLETED') return ['Complete','chip-neutral'];
  return [k||'Unknown','chip-neutral'];
}
function fmtTs(v){ if(!v) return ''; const d=new Date(v); return isNaN(d.getTime()) ? String(v) : d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function taskTimes(s){
  return { dispatched: s.assignedTime||s.assignedAt||s.dispatchedAt||s.createdAt||'', started: s.startTime||s.startedAt||s.start||'' };
}
function liveTaskBlock(b,sess){
  const recent=((b&&b.activityLog)||[]).slice(0,2);
  const cards=sess.map(s=>{
    const st=taskStatus(s), t=taskTimes(s), pending=String(s.status||'').toUpperCase()==='ASSIGNED';
    const who=(s.workerName||s.workerId||'Unassigned')+((s.workerName&&s.workerId)?' ('+s.workerId+')':'');
    return `<div class="card"><div class="task-title">${esc(actLabel(s.activity,s))}</div>
      <div class="row"><span>Status</span><span><span class="chip ${st[1]}">${esc(st[0])}</span></span></div>
      <div class="row"><span>Assigned to</span><span>${esc(who)}</span></div>
      ${t.dispatched?`<div class="row"><span>Dispatched</span><span>${esc(fmtTs(t.dispatched))}</span></div>`:''}
      <div class="row"><span>Started</span><span>${pending?'Waiting for worker to start':esc(fmtTs(t.started)||'—')}</span></div>
      <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'reassign'})">Reassign</button>
      <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'close'})">Close &amp; new</button></div>`;
  }).join('');
  const done=recent.map(r=>`<div class="row"><span>${esc(actLabel(r.taskType||r.activityName||''))} · ${esc(r.workerName||r.workerId||'')}</span><span><span class="chip chip-neutral">Complete</span> ${esc(fmtTs(r.endTime))}</span></div>`).join('');
  return `<h2 style="font-size:13px;margin:14px 0 6px;">Live tasks</h2>
    ${cards||`<div class="empty" style="padding:10px 0;">No task is assigned or running on this bed.</div>`}
    ${done?`<div class="qsub" style="margin:8px 0 2px;font-weight:700;">Recently completed</div>${done}`:''}`;
}
/* Verify & close: only the verifications this bed is actually waiting on. Each calls the existing manager action. */
function verifyCloseBlock(b){
  const cs=String(b.cohortStatus||'').toUpperCase(), btns=[], notes=[];
  const hr=(state.harvestReady||[]).find(h=>h.bedId===b.id);
  if(cs==='PRE_PLANTING') btns.push(`<button class="btn btn-primary" onclick="openModal('verify-planting',{cohortId:'${esc(b.cohortId)}',bedId:'${esc(b.id)}'})">Verify planting</button>`);
  if(b.cohortId && hr) btns.push(`<button class="btn btn-primary" onclick="verifyHarvestReady('${esc(b.cohortId)}','${esc(b.id)}')">Verify harvest ready</button>`);
  if(b.postHarvest && b.postHarvest.readyToVerify){
    const scope=b.postHarvest.bedLevel?'BED:'+b.id:b.cohortId;
    btns.push(`<button class="btn btn-primary" onclick="doVerifyTurnover('${esc(scope)}','${esc(b.id)}')">Verify bed ready</button>`);
  }
  if(String(b.bedStatus||'').toUpperCase()==='BLOCKED') btns.push(`<button class="btn btn-primary" onclick="doVerifyBedReady('${esc(b.id)}')">Clear block &amp; verify bed ready</button>`);
  if(b.cohortId && (hr || cs==='WAITING_NEXT_PICK')) notes.push('Harvest is completed by terminating the cohort (ACT_053 TerminateCohort), which opens post-harvest turnover for this bed.');
  return `<div class="qsub" style="font-weight:700;margin:12px 0 6px;">Verify &amp; close</div>
    ${btns.join('')||'<div class="note" style="margin-top:0;">Nothing is waiting for your verification on this bed.</div>'}
    ${notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}`;
}
/* ============ BED PROFILE = MINI DISPATCH CENTER ============
 * 1 Required workflow  - what must happen before the bed can be AVAILABLE (lifecycle; read-only status, no assign buttons)
 * 2 Assign work        - the manager's dispatch tool: pick activities, pick workers per activity, pick a date
 * 3 Active work        - reality: who is doing what, and its status

async function submitMultiAssign(){
  const d=maD(), c=maCounts(); if(d.busy||!d.acts.length||c.missing||!c.fresh) return;
  d.busy=true; maRefresh();
  try{
    const assignments=d.acts.map(a=>({ activity:a, workerIds:(d.map[a]||[]).slice() }));
    const r=await apiCall('start-sessions',{ bedId:d.bedId, assignments, scheduledDate:d.date }, 60000);
    d.result={ created:r.created||[], failed:r.failed||[], skipped:r.skipped||[] };
    if(d.result.created.length) toast(d.result.created.length+' task'+(d.result.created.length===1?'':'s')+' assigned.');
    /* keep only pairs that FAILED so the manager can adjust them; drop everything that went through or was already open */
    const bad={}; d.result.failed.forEach(f=>{ (bad[f.activity]=bad[f.activity]||[]).push(f.workerId); });
    d.acts=d.acts.filter(a=>bad[a]); d.map=d.acts.reduce((m,a)=>{ m[a]=bad[a]; return m; },{});
    d.busy=false; await loadToday(); maRefresh();
  }catch(e){ d.busy=false; toast(e.message); maRefresh(); }
}

/* Approval dashboard: turns the queue row's Reason lines into the four validation checks the manager needs to see. */
const VCHECKS=[['Approved block',/approved for|crop_block_map|block rule/i],['Planting window',/window/i],['Bed availability',/bed free|occupied|overlap|conflict|not free/i],['Rotation',/rotation/i]];
function validationChecks(p){
  let lines=p.reasons||[]; if(typeof lines==='string') lines=lines.split('\n');
  lines=lines.map(x=>String(x).trim()).filter(Boolean);
  const used=new Set();
  const cells=VCHECKS.map(([label,re])=>{
    const i=lines.findIndex((l,idx)=>!used.has(idx)&&re.test(l));
    if(i<0) return {label,state:'none',detail:'Not checked'};
    used.add(i); const l=lines[i];
    return {label,state:/^(⚠|✗|✖|!)/.test(l)?'w':'ok',detail:l.replace(/^[✓✔⚠✗✖!]\s*/,'')};
  });
  const extra=lines.filter((l,idx)=>!used.has(idx));
  return {cells,extra};
}
function checkGrid(p){
  const v=validationChecks(p);
  return `<div class="vgrid">${v.cells.map(c=>`<div class="vcell ${c.state==='none'?'':c.state}"><div class="vh"><span>${esc(c.label)}</span><span class="chip ${c.state==='ok'?'chip-ok':c.state==='w'?'chip-warn':'chip-neutral'}">${c.state==='ok'?'✓ Pass':c.state==='w'?'⚠ Review':'—'}</span></div><div class="vd">${esc(c.detail)}</div></div>`).join('')}</div>`
    + (v.extra.length?`<ul class="checks">${v.extra.map(r=>`<li class="${/^(⚠|✗)/.test(r)?'w':'ok'}">${esc(r)}</li>`).join('')}</ul>`:'');
}

/* Physical-bed gate on a recommendation (BED_STATUS_RULES R15 / Key Principle 4). The server's "Bed availability" check only looks
 * for other cohorts on the calendar; it says nothing about whether the bed is physically usable. So the card checks Bed_Status:
 *   AVAILABLE              -> approvable
 *   POST-HARVEST ACTIVITIES-> approvable (will be Available once steps are done and the manager verifies; planting waits for that)
 *   UNVERIFIED / BLOCKED / occupied -> NOT approvable until the manager verifies the bed / clears the block. */
function recBedGate(p){
  const b=(state.beds||[]).find(x=>x.id===p.recommendedBed); if(!b) return {ok:true,st:'',msg:''};
  const st=String(b.bedStatus||'').toUpperCase()||'UNVERIFIED';
  if(st==='AVAILABLE') return {ok:true,st,msg:'Bed is verified Available.'};
  if(st==='POST-HARVEST ACTIVITIES') return {ok:true,st,msg:'Bed is in post-harvest. It must be verified Available before planting.'};
  if(st==='UNVERIFIED') return {ok:false,st,msg:'Bed has not been verified physically ready. Verify it (or change the bed) before approving.'};
  if(st==='BLOCKED') return {ok:false,st,msg:'Bed is blocked. Clear the block and verify it first.'};
  return {ok:false,st,msg:'Bed is '+st.toLowerCase()+' and not free for a new cohort.'};
}

const PLAN_BLOCKS=['B1','B2','B3','B4','Z5']; // canonical short Block_ID, matches BLOCK_ROTATION_PLAN / BED_PLANTING_PLAN / BED_MASTER Bed_ID prefix
const BLOCK_LABELS={B1:'Block 1',B2:'Block 2',B3:'Block 3',B4:'Block 4',Z5:'Zone 5'};
const PLAN_YEARS=[2026,2027,2028];
const BLOCK_BEDS=55;
const ROTATION_FAMILIES=['Solanaceae','Fast Greens','Brassicas','Roots'];
const FAMILY_TEMPLATES={
  'Roots':[['Carrots',8,'March 1'],['Beets',7,'March 1'],['Turnips',6,'April 1']],
  'Solanaceae':[['Tomatoes',10,'May 1'],['Peppers',8,'May 15']],
  'Fast Greens':[['Lettuce',9,'Feb 15'],['Arugula',6,'Feb 15'],['Spinach',6,'March 1']],
  'Brassicas':[['Broccoli',9,'April 1'],['Kale',7,'April 1'],['Cabbage',6,'April 15']],
  'Perennial':[['Herbs',10,'—']]
};
const rotationOverrides={}, rotationStatusByYear={}, planningPlans={};
function familyForBlockYear(block,year){
  if(block==='Z5') return 'Perennial';
  const n=+block.slice(-1), off=((year-2026)%4+4)%4;
  const rotated= off? ROTATION_FAMILIES.slice(4-off).concat(ROTATION_FAMILIES.slice(0,4-off)) : ROTATION_FAMILIES.slice();
  return rotated[n-1];
}
function rotationFamily(block,year){ return (rotationOverrides[year]&&rotationOverrides[year][block]) || familyForBlockYear(block,year); }
function getRotationStatus(year){ return rotationStatusByYear[year] || (year<=2026?'Approved':'Draft'); }
function prevBlockFor(block,year){
  if(block==='Z5') return 'Z5';
  const fam=rotationFamily(block,year);
  for(const b of PLAN_BLOCKS){ if(b!=='Z5' && familyForBlockYear(b,year-1)===fam) return b; }
  return block;
}
function blockRangeLabel(block,beds){
  if(!beds.length) return '—';
  const n=block==='Z5'?5:+block.slice(-1);
  return 'B'+n+' '+String(beds[0]).padStart(2,'0')+' → B'+n+' '+String(beds[beds.length-1]).padStart(2,'0');
}
function planKey(b,y){ return b+'|'+y; }
function buildPlan(block,year){
  const fam=rotationFamily(block,year), tmpl=FAMILY_TEMPLATES[fam]||FAMILY_TEMPLATES['Roots'];
  let cursor=1; const crops=[];
  tmpl.forEach(([name,count,date])=>{
    const beds=[]; for(let i=0;i<count && cursor<=BLOCK_BEDS;i++,cursor++) beds.push(cursor);
    crops.push({ id:(block+'-'+year+'-'+name).replace(/\s+/g,'').toUpperCase(), cropName:name, family:fam, plantingDate:date,
      bedNums:beds, layoutStatus:'Pending', plantingStatus:'Not planted', harvestStatus:'Not started', plantedBeds:[],
      lastYearBedRange: year>PLAN_YEARS[0]?blockRangeLabel(prevBlockFor(block,year),beds):'—',
      rotationNote: prevBlockFor(block,year)+' → '+block, harvestWindow: date+' + 45 days' });
  });
  return { crops };
}
function getPlan(block,year){ const k=planKey(block,year); if(!planningPlans[k]) planningPlans[k]=buildPlan(block,year); return planningPlans[k]; }
function cropById(id){ return getPlan(ui.pBlock,ui.pYear).crops.find(x=>x.id===id); }
function cropBedRangeLabel(block,crop){ return blockRangeLabel(block,crop.bedNums); }
function harvestStatusOf(c){ return c.harvestStatus==='Complete'?'Complete':(c.plantingStatus==='Planted'?'In progress':'Not started'); }
function chipClassFor(s){ return {Confirmed:'chip-ok',Planted:'chip-ok',Complete:'chip-ok',Modified:'chip-warn','In progress':'chip-warn',Pending:'chip-neutral','Not planted':'chip-neutral','Not started':'chip-neutral'}[s]||'chip-neutral'; }
