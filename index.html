/* ============================== BED PROFILE ARCHITECTURE ==============================
 * The Bed Profile is a stack of independently-sourced layers, read and rendered in this order:
 *   BED_MASTER (physical bed) -> calculated Availability -> BED_PLANTING_PLAN (planning) ->
 *   BLOCK_ROTATION_PLAN (rotation) -> COHORT_PRODUCTION/FIELD_LIVE_SESSION (current production) -> history.
 * A missing plan row, cohort, session or history record must never blank a layer above it -
 * only BED_MASTER itself (the physical bed) is a hard requirement to render anything at all.
 * See "Bed Profile Architecture Fix" spec, sections 1-13. */

/* Optional BED_MASTER attribute: shown only when the backend actually returned a value for it
 * ("where already defined" - section 2). Never rendered as a placeholder dash. */
function profRow(label,val){ return (val==null||val==='')? '' : `<div class="row"><span>${esc(label)}</span><span>${esc(val)}</span></div>`; }
/* Field that must always show *some* explicit state (never a bare em-dash - section 11). */
function profRowOr(label,val,fallback){ return `<div class="row"><span>${esc(label)}</span><span>${esc((val!=null&&val!=='')?val:fallback)}</span></div>`; }

const LOCATION_TYPE_LABEL = { FIELD:'Field Bed', GREENHOUSE:'Greenhouse Bed', NURSERY:'Nursery Bed', HOOPHOUSE:'Hoophouse Bed' };
const PRODUCTION_TYPE_LABEL = { FIELD:'Field', GREENHOUSE:'Greenhouse', NURSERY:'Nursery', HOOPHOUSE:'Hoophouse' };
function locationTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return LOCATION_TYPE_LABEL[k] || (lt?lt+' Bed':''); }
function productionTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return PRODUCTION_TYPE_LABEL[k] || (lt||''); }

/* Availability is BED_MASTER.Bed_Status (BED_STATUS_RULES), never inferred from planning data. A
 * BED_PLANTING_PLAN row (even CONFIRMED) does not make a bed Reserved: RESERVED requires the manager to
 * confirm a specific cohort-to-bed assignment (R02). Blocked is the only override (non-Active physical
 * status or an open exception). "No cohort" alone falls back to OCCUPIED/AVAILABLE only when Bed_Status
 * is blank. Deliberately does NOT read COHORT_ASSIGNMENT_QUEUE/state.aq here: that queue is loaded for
 * the Daily Board's own year (ui.year), a different selector than the Season Planning year (ui.pYear)
 * this profile is showing - mixing the two produced wrong-season proposals. */
function bedAvailability(pb, cohortId, hasPlan, openExceptions, bedStatus){
  const ps=String(pbBedStatus(pb)||'').toUpperCase();
  if(ps==='BLOCKED') return 'BLOCKED';   /* was: any status other than 'ACTIVE' -> BLOCKED, which mislabelled every POST-HARVEST / AVAILABLE / RESERVED bed */
  if(openExceptions && openExceptions.length) return 'BLOCKED';
  /* BED_MASTER.Bed_Status is the single source of truth (BED_STATUS_RULES). A confirmed plan is NOT a
   * physical state: "Planning never changes physical bed status" (Key Principle 1), so hasPlan is ignored. */
  const bs=String(bedStatus||ps||'').trim().toUpperCase();
  if(bs) return bs;
  return cohortId?'OCCUPIED':'UNVERIFIED';   /* blank Bed_Status = never verified, not available */
}
/* Planning display gate. A confirmed plan row is only STAGED until BOTH gates are passed: (1) the bed is physically released
 * (manager Verify Bed Ready -> AVAILABLE) and (2) the manager approves the cohort-to-bed assignment (-> RESERVED). Display
 * only: it reads the same calculated availability the profile already shows and never writes or infers bed status. */
function planStage(avail, cohortId){
  const a=String(avail||'').toUpperCase();
  if(cohortId || a==='RESERVED' || a==='PLANTED' || a==='GROWING' || a==='HARVEST READY' || a==='HARVESTING' || a==='OCCUPIED') return { staged:false, waiting:'' };
  if(a==='UNVERIFIED') return { staged:true, waiting:'Awaiting bed verification', banner:'This bed has not been verified physically ready. The manager must verify it before this plan can move forward.' };
  if(a==='POST-HARVEST ACTIVITIES') return { staged:true, waiting:'Awaiting post-harvest completion and bed verification', banner:'Post-harvest work must be completed and the bed verified by a manager before this plan can move forward.' };
  if(a==='BLOCKED') return { staged:true, waiting:'Bed is blocked', banner:'This bed is blocked. The block must be cleared and the bed verified before this plan can move forward.' };
  return { staged:true, waiting:'Awaiting manager approval of the cohort assignment', banner:'The bed is available. This plan starts only after the manager approves the cohort assignment (see the assignment queue).' };
}
function availabilityLabel(a){ return a==='UNVERIFIED'?'NOT VERIFIED':a; }
function availabilityChip(a){ return {UNVERIFIED:'chip-warn',AVAILABLE:'chip-ok',RESERVED:'chip-warn','POST-HARVEST ACTIVITIES':'chip-warn',OCCUPIED:'chip-neutral',BLOCKED:'chip-danger'}[a]||'chip-neutral'; }

/* get-planning-context is a backend (Apps Script) response whose exact key casing for BED_MASTER
 * fields isn't visible from this file. Read each attribute defensively across the reasonable variants
 * a server could use, so a key-name mismatch never gets misread as "BED_MASTER has no value" and shown
 * as CONFIGURATION REQUIRED. This does NOT invent a value — if none of the keys are present, the field
 * genuinely wasn't returned. If Physical Status still shows CONFIGURATION REQUIRED after this, the
 * BED_MASTER.Bed_Status cell for that bed is empty at the source and needs to be filled in there. */
function pbField(pb, keys){ for(const k of keys){ if(pb && pb[k]!=null && pb[k]!=='') return pb[k]; } return ''; }
function pbBedStatus(pb){ return pbField(pb, ['bedStatus','Bed_Status','status','physicalStatus']); }
function pbZone(pb){ return pbField(pb, ['zone','Zone','irrigationZone']); }
function pbLocationType(pb){ return pbField(pb, ['locationType','Location_Type']); }
function pbBedLength(pb){ return pbField(pb, ['bedLength','Bed_Length']); }
function pbHealthStatus(pb){ return pbField(pb, ['bedHealthStatus','Bed_Health_Status','healthStatus']); }
function pbIrrigationStatus(pb){ return pbField(pb, ['bedIrrigationStatus','Bed_Irrigation_Status','irrigationStatus']); }

/* MASTER WAVE COLORS (Season Planning). Wave n = the n-th distinct planting date of that crop in the year (derived by
 * the backend, PlantingPlanAPI.gs). OPEN / no plan / no planting date = no fill. Status (Pending / Confirmed / Modified) is
 * shown by opacity, outline and the tile label, never by hue, so a wave keeps one color. */
const WAVE_COLORS={1:'#66BB6A',2:'#FDD835',3:'#64B5F6',4:'#B39DDB',5:'#FFA726',6:'#26C6DA',7:'#EC407A',8:'#A1887F',9:'#5C6BC0',10:'#26A69A'};
const NOT_IN_MASTER_COLOR='#B0BEC5';   /* dated bed whose date matches no Open Field Operation planting of its crop (PRODUCTION_WAVE_PLAN mirrors Open Field Operation): flagged, never renumbered */
function waveName(w){ return 'Wave '+w; }
function waveColor(w){ w=Number(w); return w>0 ? (WAVE_COLORS[w]||NOT_IN_MASTER_COLOR) : ''; }
function notInMaster(p){ return !!p && p.waveStatus==='NOT_IN_MASTER'; }
function isOpenPlan(p){ if(!p || !p.cropId || String(p.cropId).toUpperCase()==='OPEN') return true; return !(Number(p.wave)>0) && !notInMaster(p); }
function planFill(p){ return notInMaster(p) ? NOT_IN_MASTER_COLOR : waveColor(p.wave); }
function waveTag(p){ return notInMaster(p) ? 'W?' : 'W'+p.wave; }

function ppLeftHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="empty">Loading…</div>`;
  if(ctx.error) return `<div class="empty">${esc(ctx.error)}</div>`;
  if(!ctx.plan.found) return `<div class="empty">No planting plan yet for ${esc(BLOCK_LABELS[ui.pBlock])} in ${ui.pYear}.</div>`;
  return ctx.plan.crops.map(c=>{ const key=c.cropId+'|'+(c.wave||'');
    const wc=isOpenPlan(c)?'':planFill(c);
    const gap=c.bedCount===0;   /* Open Field Operation wave with no beds in this block yet */
    const edge=wc?`border-left:7px solid ${wc};background:linear-gradient(90deg,${wc}33,transparent 55%),var(--sand);${gap?'border-style:dashed;border-left-style:solid;opacity:.7;':''}`:'background:transparent;border-style:dashed;';
    const tag=notInMaster(c)?'Not in Open Field Operation':waveName(c.wave)+(c.masterWaveCount?' of '+c.masterWaveCount:'');
    return `<div class="card" style="${edge}${ui.ppSelectedKey===key?'outline:2px solid var(--forest);':''}" onclick="selectPPCrop('${esc(key)}')">
      <div class="row"><span><b style="color:var(--ink);">${esc(c.cropName)}</b>${wc?` <span class="chip" style="background:${wc};color:#14261D;">${esc(tag)}</span>`:''}</span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      <div class="row"><span>Beds</span><span>${gap?'none planned':c.bedCount}</span></div>
      <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
    </div>`;
  }).join('');
}

function ppLegend(){
  const ctx=ppCurrent(), crops=(ctx&&ctx.plan&&ctx.plan.crops)||[];
  const maxW=Math.max(5,...crops.map(c=>Number(c.wave)||0));
  const anyNim=crops.some(notInMaster);
  return Array.from({length:maxW},(_,i)=>i+1).map(w=>legendItem('background:'+waveColor(w)+';',waveName(w))).join('')+
    (anyNim?legendItem('background:'+NOT_IN_MASTER_COLOR+';border:2px dashed #B3261E;','Not in Open Field Operation'):'')+
    legendItem('background:transparent;border:1px solid var(--line);','OPEN / no plan')+
    legendItem('background:#B0BEC5;opacity:.55;','Pending (paler)')+
    legendItem('background:#B0BEC5;border:2px dashed #14261D;','Modified (dashed)');
}

function ppBedGridSVG(){
  const ctx=ppCurrent();
  if(!ctx || ctx.error || !ctx.physicalBeds.length) return `<div class="empty">${ctx&&ctx.error?esc(ctx.error):'No physical beds.'}</div>`;
  const beds=ctx.physicalBeds, byBed={}; ctx.plan.beds.forEach(b=>byBed[b.bedId]=b);
  const cols=Math.min(8,beds.length)||1, cw=70, ch=50, gap=6, rows=Math.ceil(beds.length/cols);
  let svg=`<defs><pattern id="hatchpp" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#EDE7D3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8FC9" stroke-width="3"/></pattern></defs>`;
  beds.forEach((pb,i)=>{
    const col=i%cols, row=Math.floor(i/cols), bx=10+col*(cw+gap), by=10+row*(ch+gap);
    const plan=byBed[pb.bedId];
    let fill='transparent', tc='#1B1B18', label='', fop=1, dash='';
    const open=isOpenPlan(plan);
    if(plan && !open){
      fill=planFill(plan); tc='#14261D';
      const st=String(plan.status||'').toUpperCase();
      label=waveTag(plan)+' · '+(st||'PENDING');
      if(notInMaster(plan)) dash='stroke="#B3261E" stroke-width="2" stroke-dasharray="4 2"';
      if(st==='PENDING') fop=.55;
      if(st==='MODIFIED' && !notInMaster(plan)) dash='stroke="#14261D" stroke-width="2" stroke-dasharray="4 2"';
    } else if(plan){ label='OPEN'; }
    const sel=ui.ppMulti?ui.ppSel.includes(pb.bedId):ui.ppSelectedBed===pb.bedId;
    svg += `<g><rect class="bed" data-ppbed="${esc(pb.bedId)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}" fill-opacity="${fop}" ${sel?'stroke="var(--forest)" stroke-width="3"':dash}></rect>
      <text x="${bx+6}" y="${by+13}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${esc(pb.bedId.split('-')[1]||pb.bedId)}</text>
      ${plan&&!open?`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tc}">${esc((plan.cropName||'').slice(0,10))}</text>`:`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9" fill="${tc}">Empty</text>`}
      ${label?`<text x="${bx+cw/2}" y="${by+42}" text-anchor="middle" font-size="6.5" font-weight="700" fill="${tc}" opacity=".85">${esc(label)}</text>`:''}
    </g>`;
  });
  const W=10+cols*(cw+gap), H=10+rows*(ch+gap);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

function ppRightHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="panelhead"><h2>Season Planning</h2></div><div class="panelbody"><div class="empty">Loading…</div></div>`;
  if(ctx.error) return `<div class="panelhead"><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2></div><div class="panelbody"><div class="empty">${esc(ctx.error)}</div></div>`;

  if(ui.ppMulti) return ppBulkHTML();
  if(ui.ppSelectedBed && ui.ppBedModify) return ppEditBedHTML();

  // Bed selected, read view -> the layered Bed Profile. BED_MASTER (the physical bed) is read and
  // rendered first and unconditionally; BED_PLANTING_PLAN, rotation, current execution (COHORT_PRODUCTION /
  // FIELD_LIVE_SESSION / FIELD_ACTIVITY_LOG, already pulled into state.board / state.sessions / state.todayById
  // at login) and history are each read and rendered as their own separate layer underneath it. None of them
  // being empty ever blanks the Bed Profile itself - see the Bed Profile Architecture Fix spec.
  if(ui.ppSelectedBed){
    const bedId=ui.ppSelectedBed;
    const pb=(ctx.physicalBeds||[]).find(p=>p.bedId===bedId);          // BED_MASTER — the physical bed
    const bed=ctx.plan.beds.find(b=>b.bedId===bedId);                   // BED_PLANTING_PLAN — may legitimately be absent
    const v=bedViewById(bedId)||{ id:bedId, proposals:[] };             // COHORT_PRODUCTION (cohort board) — may legitimately be empty
    const sess=bedSessions(bedId);                                      // FIELD_LIVE_SESSION
    const hist=(v.activityLog||[]).slice(0,10);                         // historical activity
    const openExc=bedExceptions(bedId).filter(x=>x.status==='OPEN');
    const avail=bedAvailability(pb, v.cohortId, !!bed, openExc, v.bedStatus);
    const stg=planStage(avail, v.cohortId);

    if(!pb){
      // No BED_MASTER record at all for this bed ID. This is a genuine configuration problem, not an
      // empty-but-legitimate state, so it is labelled as one rather than rendered as a blank/em-dash bed.
      return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
      <div class="panelbody">
        <div class="card">
          <div class="row"><span>Bed Profile</span><span class="chip chip-danger">CONFIGURATION REQUIRED</span></div>
          <div class="row"><span>Issue</span><span>No BED_MASTER record found for ${esc(bedId)}.</span></div>
        </div>
      </div>`;
    }

    return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">

      <h2 style="font-size:13px;margin:0 0 6px;">Bed Profile</h2>
      <div class="card">
        ${profRowOr('Physical Status', availabilityLabel(String(pbBedStatus(pb)||v.bedStatus||'').toUpperCase()), 'NOT VERIFIED')}
        ${profRow('Production Type', productionTypeLabel(pbLocationType(pb)))}
        ${profRow('Location Type', locationTypeLabel(pbLocationType(pb)))}
        ${profRow('Irrigation Zone', pbZone(pb))}
        ${profRow('Bed Length', pbBedLength(pb)!==''?(pbBedLength(pb)+' ft'):'')}
        ${profRow('Bed Health Status', pbHealthStatus(pb))}
        ${profRow('Irrigation Status', pbIrrigationStatus(pb))}
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Availability</h2>
      <div class="card">
        <div class="row"><span>Status</span><span><span class="chip ${availabilityChip(avail)}">${availabilityLabel(avail)}</span></span></div>
        ${avail==='UNVERIFIED'?`<div class="note">No one has verified this bed is physically ready (empty, cleared, sanity-checked). It cannot be assigned until you verify it. It becomes Available only after its reset sequence (ACT_037–051) is completed or overridden and you verify it.</div>
        `:''}
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Planning${bed&&stg.staged?' <span title="Locked until the bed is released and the assignment is approved" style="font-weight:400;">🔒</span>':''}</h2>
      <div class="card">${bed ? `
        ${stg.staged?`<div class="note" style="margin:0 0 6px;">${esc(stg.banner)}</div>`:''}
        <div style="${stg.staged?'color:var(--ink-soft);opacity:.7;':''}">
        <div class="row"><span>Crop</span><span>${esc(bed.cropName||v.cropName||'Not set')}</span></div>
        <div class="row"><span>Wave</span><span>${esc(bed.wave!=null&&bed.wave!==''?bed.wave:'Not set')}</span></div>
        <div class="row"><span>Planting Date</span><span>${esc(bed.plantingDate||'Not set')}</span></div>
        </div>
        <div class="row"><span>Plan Status</span><span><span class="chip ${stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?'chip-neutral':ppStatusChip(bed.status)}">${esc(stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?'STAGED':(bed.status||'Not set'))}</span></span></div>
        ${stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?`<div class="row"><span>Release</span><span>${esc(stg.waiting)}</span></div>`:''}
      ` : `
        <div class="row"><span>Current Plan</span><span>No current plan</span></div>
      `}</div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Rotation</h2>
      <div class="card">
        <div class="row"><span>Current Family</span><span>${esc((bed&&bed.cropFamily)||ctx.rotation.cropFamily||'Not set')}</span></div>
        <div class="row"><span>Previous Year Family</span><span>${esc(ctx.rotation.previousFamily||'Not tracked')}</span></div>
        <div class="row"><span>Rotation Result</span><span>${esc(ctx.rotation.result||'Not calculated')}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Current Production</h2>
      <div class="card">
        <div class="row"><span>Current Cohort</span><span>${esc(v.cohortId||'None')}</span></div>
        <div class="row"><span>Current Stage</span><span>${v.cohortId?esc((v.currentStage||'—').replace(/_/g,' ')):'Not Started'}</span></div>
        <div class="row"><span>Worker</span><span>${sess.length?esc(sess.map(s=>s.workerName).join(', ')):'None'}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">History</h2>
      <div class="qgh" style="cursor:pointer;" onclick="togglePPHistory()"><span>${ui.ppHistoryOpen?'▾':'▸'} ${hist.length?(hist.length+' record'+(hist.length===1?'':'s')):'No history'}</span></div>
      ${ui.ppHistoryOpen?(hist.length?hist.map(r=>`<div class="row"><span>${esc(r.taskType||r.activityName||'')} · ${esc(r.workerName||r.workerId||'')}</span><span>${esc(r.endTime||'')}</span></div>`).join(''):`<div class="empty" style="padding:10px 0;">No history recorded for this bed.</div>`):''}

      <h2 style="font-size:13px;margin:14px 0 6px;">Bed dispatch</h2>
      ${actionsPanel(v,sess)}
      <button class="btn btn-outline" ${ui.ppBusy?'disabled':''} onclick="ppOpenEdit()">${bed?'Modify Bed':'Add crop to this bed'}</button>
      <div class="note">Bed Profile above comes from BED_MASTER and always renders, whether or not this bed currently has a plan, cohort, session or history.</div>
    </div>`;
  }

  // Crop selected, read view -> "where should this crop be planted"
  if(ui.ppSelectedKey){
    const c=ctx.plan.crops.find(x=>(x.cropId+'|'+(x.wave||''))===ui.ppSelectedKey);
    if(c) return `<div class="panelhead"><div><h2>${esc(c.cropName)}</h2><div class="meta">${esc(c.cropFamily||'')} · ${ui.pYear}</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">
      <div class="card">
        <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
        <div class="row"><span>Beds required</span><span>${c.bedCount}</span></div>
        <div class="row"><span>Bed range</span><span>${esc(c.bedRange)}</span></div>
        <div class="row"><span>Wave</span><span>${c.wave!=null?c.wave:'—'}</span></div>
        <div class="row"><span>Layout status</span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      </div>
      <div class="note">Click a bed on the map to view or modify it individually.</div>
    </div>`;
  }

  // Nothing selected -> block-level summary + Confirm Layout / Modify Bed as the primary Season Planning actions
  const st=ctx.status;
  const planned = st.pending + st.confirmed + st.modified;
  const allConfirmed = ctx.plan.found && st.physicalBedCount>0 && st.confirmed>=st.physicalBedCount;
  const statusLabel = !ctx.plan.found ? 'Not generated' : allConfirmed ? 'Confirmed' : (st.confirmed>0 ? 'Partially confirmed' : 'Pending Confirmation');
  const statusChip = allConfirmed?'chip-ok':(!ctx.plan.found?'chip-neutral':'chip-warn');
  return `<div class="panelhead"><div><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2><div class="meta">${ui.pYear} · ${esc(ctx.rotation.cropFamily||'No rotation set')}</div></div></div>
  <div class="panelbody">
    <div class="card">
      <div class="row"><span>Beds</span><span>${st.physicalBedCount}</span></div>
      <div class="row"><span>Planned</span><span>${planned}</span></div>
      <div class="row"><span>Empty</span><span>${st.empty}</span></div>
      <div class="row"><span>Modified</span><span>${st.modified}</span></div>
      <div class="row"><span>Confirmed</span><span>${st.confirmed}</span></div>
      <div class="row"><span>Status</span><span><span class="chip ${statusChip}">${esc(statusLabel)}</span></span></div>
    </div>
    ${!ctx.plan.found ? `
      ${ctx.generationException?`<div class="note" style="color:var(--danger);">${esc(ctx.generationException)}</div>`
        :`<div class="note">No plan generated yet. The approved template (${esc(ctx.template.templateId||'')}) will determine bed-by-bed layout — nothing to choose here.</div>`}
      <button class="btn btn-primary" ${(ui.ppBusy||ctx.generationException)?'disabled':''} onclick="generatePlanReal()">${ui.ppBusy?'Generating…':'Generate Plan'}</button>
      <button class="btn btn-outline" onclick="ppToggleMulti()">Or plan beds by hand…</button>
    ` : `
      <h2 style="font-size:13px;margin:14px 0 6px;">Actions</h2>
      <button class="btn btn-primary" ${(ui.ppBusy||allConfirmed)?'disabled':''} onclick="confirmLayoutReal()">${allConfirmed?'Confirmed ✓':'Confirm Layout'}</button>
      <div class="note" style="margin-top:0;">Click a bed on the map, or a crop on the left, to open it and use Modify Bed — the exception workflow for when the standard template needs to change for one bed.</div>
      ${ppEditActionsHTML()}
      <button class="btn btn-ghost" onclick="ui.pAdvOpen=!ui.pAdvOpen;render();">${ui.pAdvOpen?'▾':'▸'} Advanced</button>
      ${ui.pAdvOpen?`<button class="btn btn-outline" ${ui.ppBusy?'disabled':''} onclick="generatePlanReal()">Regenerate from template</button>`:''}
    `}
  </div>`;
}

/* ============================== OPERATION PLANNER ==============================
 * The manager enters ONE planting date (+ waves, + optional interval) per crop; the screen derives
 *   sow / propagation start = planting - lead days, first harvest = planting + days to first harvest,
 *   harvest window closes = planting + max days. Save writes the wave dates to the workbook through
 *   'save-operation-plan' (OperationPlanner.gs): GREENHOUSE -> Master Calendar, FIELD -> Open Field Operation
 *   (open field must sit inside the Oregon allowable window). Each wave is filed under the month of its
 *   first harvest (max 2 per month: "Harvest 1" / "Harvest 2"). */
const OP_DEF_INT=14, OP_MAX=24, OP_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const opState={target:'GREENHOUSE',data:{},busy:false,error:null,filter:'',open:{},saving:false};
const opIso=n=>new Date(n*864e5).toISOString().slice(0,10);
const opSig=r=>JSON.stringify([r.first,r.waves,r.interval,r.custom]);
const opRows=()=>opState.data[opState.target]||[];
function opTypicalGap(d){ if(d.length<2) return ''; const g=[]; for(let i=1;i<d.length;i++) g.push(calDay(d[i])-calDay(d[i-1])); g.sort((a,b)=>a-b); return g[Math.floor(g.length/2)]; }
function opMakeRow(c){ const d=(c.dates||[]).slice().sort();
  const r=Object.assign({},c,{first:d[0]||'',waves:d.length||'',interval:'',custom:d.length>0,existing:d,gap:opTypicalGap(d),srv:'',srvSig:''}); r.orig=opSig(r); return r; }
function opDemoCrops(){ const seen={}, out=[];
  (typeof CAL_DATA!=='undefined'?CAL_DATA:[]).forEach(w=>{ if(seen[w.name]) return; seen[w.name]=1;
    const lead=(w.pre[1]+w.pre[2]+w.pre[3]>0)?w.pre.reduce((a,b)=>a+b,0):0;
    out.push({cropId:w.crop,name:w.name,method:w.method,hmin:w.hmin,hmax:w.hmax,lead,windows:[{start:'2027-04-01',end:'2027-09-30'}],dates:[]}); });
  return out; }
async function opLoad(force){
  const tg=opState.target; if(opState.busy||(opState.data[tg]&&!force)) return;
  opState.busy=true; opState.error=null; render();
  try{ const crops=IS_DEMO?opDemoCrops():((await apiCall('get-operation-plan',{target:tg})).crops||[]); opState.data[tg]=crops.map(opMakeRow); }
  catch(e){ opState.error=e.message||'Could not load the operation planner.'; }
  opState.busy=false; render();
}
function opDates(r){ if(r.custom) return r.existing.slice().sort();
  const n=Math.floor(Number(r.waves)); if(!r.first||!(n>=1)) return [];
  const st=Math.floor(Number(r.interval))||OP_DEF_INT, a=calDay(r.first), out=[]; for(let i=0;i<Math.min(n,OP_MAX);i++) out.push(opIso(a+i*st)); return out; }
function opInWin(md,w){ const a=w.start.slice(5), b=w.end.slice(5); return a<=b ? (md>=a&&md<=b) : (md>=a||md<=b); }
function opEval(r,tg){
  const res={dates:[],waves:[],level:'none',text:'Enter date + waves'};
  if(!r.cropId){ res.level='bad'; res.text='No CROP_REFERENCE match'; return res; }
  if(r.srv&&r.srvSig===opSig(r)){ res.level='bad'; res.text=r.srv; return res; }
  const n=Number(r.waves);
  if(!r.custom){ if(r.waves!==''&&(!Number.isInteger(n)||n<0||n>OP_MAX)){ res.level='bad'; res.text='Waves must be 0 to '+OP_MAX; return res; }
    if(r.interval!==''&&!(Number(r.interval)>=1)){ res.level='bad'; res.text='Interval must be 1 or more'; return res; } }
  const dates=opDates(r); res.dates=dates;
  if(!dates.length){ if(r.existing.length&&r.orig!==opSig(r)){ res.level='clear'; res.text='Will clear '+r.existing.length+' dates'; } return res; }
  const per={}; let bad='', tight=false;
  dates.forEach((d,i)=>{ const h=opIso(calDay(d)+r.hmin), m=Number(h.slice(5,7))-1; per[m]=(per[m]||0)+1;
    const slot=per[m]<=2?('H'+per[m]+' '+OP_MON[m]):'no slot';
    const gap=i?calDay(d)-calDay(dates[i-1]):null; if(gap!==null&&gap<OP_DEF_INT) tight=true;
    res.waves.push({n:i+1,plant:d,sow:opIso(calDay(d)-r.lead),h1:h,h2:opIso(calDay(d)+r.hmax),gap,slot}); });
  const over=Object.keys(per).filter(m=>per[m]>2);
  if(over.length) bad='More than 2 harvests start in '+OP_MON[over[0]]+' (max 2 per month)';
  if(!bad&&tg==='FIELD'){ if(!r.windows.length) bad='No Oregon window on file';
    else{ const out=dates.filter(d=>!r.windows.some(w=>opInWin(d.slice(5),w))); if(out.length) bad='OUT OF WINDOW ('+out.length+' of '+dates.length+')'; } }
  if(bad){ res.level='bad'; res.text=bad; } else if(tight){ res.level='warn'; res.text='OK · gap under '+OP_DEF_INT+' d'; } else { res.level='ok'; res.text='OK'; }
  return res; }
const opFmt=iso=>iso?calFull(iso):'-';
function opCells(r,e){ const w=e.waves, f=w[0], l=w[w.length-1];
  return {sow:f?opFmt(f.sow):'-',h1:f?opFmt(f.h1):'-',lp:l?opFmt(l.plant):'-',he:l?opFmt(l.h2):'-'}; }
function opDetail(r,e){ if(!e.waves.length) return '<div class="dim">No waves planned.</div>';
  return `<table><tr><th>Wave</th><th>Plant</th><th>Sow / propagate</th><th>First harvest</th><th>Window closes</th><th>Gap</th><th>Slot</th></tr>${e.waves.map(w=>`<tr><td>${w.n}</td><td>${opFmt(w.plant)}</td><td>${r.lead?opFmt(w.sow):'direct'}</td><td>${opFmt(w.h1)}</td><td>${opFmt(w.h2)}</td><td>${w.gap===null?'-':w.gap+' d'}</td><td>${w.slot}</td></tr>`).join('')}</table>`; }
function opRowHTML(r,i,tg){ const e=opEval(r,tg), c=opCells(r,e), dis=r.cropId?'':'disabled', dirty=r.orig!==opSig(r), open=!!opState.open[tg+i];
  const hide=opState.filter&&!(r.name+' '+r.cropId).toLowerCase().includes(opState.filter.toLowerCase());
  return `<tr id="op-r-${i}" data-q="${esc((r.name+' '+r.cropId).toLowerCase())}" class="${dirty?'dirty':''}" ${hide?'style="display:none"':''}>
    <td><div class="nm">${esc(r.name)}</div><div class="id">${esc(r.cropId||'no match')}</div></td>
    <td class="calc">${r.hmin} d</td>
    <td class="calc">${r.lead?r.lead+' d':'<span class="dim">none</span>'}<div class="mt">${esc(r.method||'')}</div></td>
    <td><input type="date" value="${esc(r.first)}" ${dis} onchange="opSet(${i},'first',this.value)" aria-label="First planting date ${esc(r.name)}"></td>
    <td><input type="number" min="0" max="${OP_MAX}" step="1" value="${esc(r.waves)}" ${dis} onchange="opSet(${i},'waves',this.value)" aria-label="Waves ${esc(r.name)}"></td>
    <td><input type="number" min="1" step="1" value="${esc(r.interval)}" placeholder="${r.gap||OP_DEF_INT}" ${dis} onchange="opSet(${i},'interval',this.value)" aria-label="Interval days ${esc(r.name)}"></td>
    <td class="calc" data-k="sow">${c.sow}</td><td class="calc" data-k="h1">${c.h1}</td><td class="calc" data-k="lp">${c.lp}</td><td class="calc" data-k="he">${c.he}</td>
    <td class="chkc"><span class="op-chk ${e.level}" data-k="chk">${esc(e.text)}</span></td>
    <td><button class="btn btn-ghost" style="width:auto;margin:0;padding:4px 10px" onclick="opToggle(${i})">${open?'Hide':'Waves'}</button></td></tr>`
    +(open?`<tr class="op-det" id="op-d-${i}"><td colspan="12">${opDetail(r,e)}</td></tr>`:''); }
function opSummary(){ const rows=opRows(), tg=opState.target; let planned=0, dirty=0;
  rows.forEach(r=>{ if(opDates(r).length) planned++; if(r.orig!==opSig(r)) dirty++; });
  return {txt:`${rows.length} crops, ${planned} with waves planned`, dirty}; }
function opChrome(){ const s=opSummary(), a=document.getElementById('op-sum'), b=document.getElementById('op-save');
  if(a) a.textContent=s.txt; if(b){ b.textContent=s.dirty?`Save (${s.dirty})`:'Save'; b.disabled=!s.dirty||opState.saving; } }
function opRefresh(i){ const r=opRows()[i], tg=opState.target, tr=document.getElementById('op-r-'+i); if(!r||!tr) return;
  const e=opEval(r,tg), c=opCells(r,e); tr.classList.toggle('dirty',r.orig!==opSig(r));
  ['sow','h1','lp','he'].forEach(k=>{ const el=tr.querySelector(`[data-k="${k}"]`); if(el) el.textContent=c[k]; });
  const chk=tr.querySelector('[data-k="chk"]'); chk.className='op-chk '+e.level; chk.textContent=e.text;
  const d=document.getElementById('op-d-'+i); if(d) d.firstElementChild.innerHTML=opDetail(r,e);
  opChrome(); }
function opSet(i,field,val){ const r=opRows()[i]; if(!r) return;
  if(r.custom){ /* first edit of an existing plan: switch to generated mode from what is shown */ r.custom=false; }
  r[field]=field==='waves'?(val===''?'':Number(val)):val; opRefresh(i); }
function opToggle(i){ const k=opState.target+i; opState.open[k]=!opState.open[k]; render(); }
function opFilter(v){ opState.filter=v; document.querySelectorAll('#op-body tr[data-q]').forEach(tr=>{ tr.style.display=(!v||tr.dataset.q.includes(v.toLowerCase()))?'':'none'; }); }
function opSetTarget(t){ if(t===opState.target) return; opState.target=t; opState.open={}; render(); }
function opReload(){ const rows=opRows(); if(rows.some(r=>r.orig!==opSig(r))&&!confirm('Discard your unsaved changes and reload from the workbook?')) return; opState.data[opState.target]=null; opLoad(true); }
async function opSave(){
  const tg=opState.target, rows=opRows(), sheet=tg==='FIELD'?'Open Field Operation':'Master Calendar';
  const dirty=rows.map((r,i)=>({r,i,e:opEval(r,tg)})).filter(x=>x.r.orig!==opSig(x.r));
  if(!dirty.length){ toast('No changes to save.'); return; }
  const bad=dirty.filter(x=>x.e.level==='bad');
  if(bad.length){ toast(`Fix ${bad.length} crop${bad.length>1?'s':''} first: ${bad.slice(0,3).map(x=>x.r.name).join(', ')}${bad.length>3?'…':''}`); return; }
  const over=dirty.filter(x=>x.r.existing.length).length;
  if(!confirm(`Save ${dirty.length} crop${dirty.length>1?'s':''} to ${sheet}?\n\n`+(tg==='FIELD'?'Open Field Operation is the source of truth for the wave plan, bed plan and cohorts.\n\n':'')+(over?`This replaces ALL existing planting dates for ${over} of them (each crop is rewritten as its new waves).`:'No existing dates are replaced.'))) return;
  opState.saving=true; opChrome();
  try{
    let results;
    if(IS_DEMO) results=dirty.map(x=>({cropId:x.r.cropId,ok:true}));
    else results=(await apiCall('save-operation-plan',{target:tg,plans:dirty.map(x=>({cropId:x.r.cropId,dates:x.e.dates}))})).results||[];
    let ok=0, fail=0;
    dirty.forEach(x=>{ const res=results.find(q=>q.cropId===x.r.cropId)||{ok:false,error:'No result returned.'};
      if(res.ok){ ok++; x.r.existing=x.e.dates.slice(); x.r.orig=opSig(x.r); x.r.srv=''; }
      else{ fail++; x.r.srv=res.error||'Could not save.'; x.r.srvSig=opSig(x.r); } });
    calState.data=null; calState.error=null; calState.align=null;          // Production calendars re-read the workbook next time
    if(tg==='FIELD'&&ok){ state.pp={}; try{ const cs_=cpS(); cs_.status=null; cs_.preview=null; }catch(e2){} }   // Season Planning + Cohort production re-read too
    opState.saving=false;
    toast((IS_DEMO?'Demo mode (nothing written): ':'')+`${ok} saved`+(fail?`, ${fail} refused - see the Check column`:'')+'.'+(tg==='FIELD'&&ok&&!IS_DEMO?' The wave plan follows Open Field Operation; check Season Planning and Cohort production for beds and cohorts still on the old dates.':''));
  }catch(err){ opState.saving=false; toast(err.message||'Could not save.'); }
}
function opScreen(){
  const tg=opState.target; if(!opState.data[tg]&&!opState.busy&&!opState.error) opLoad();
  const head=(inner)=>`<div class="op"><div class="op-top"><div><h2>Operation planner</h2><div class="sum" id="op-sum">${opState.data[tg]?opSummary().txt:'Loading…'}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="op-save" style="width:auto;margin:0" onclick="opSave()">${opState.data[tg]&&opSummary().dirty?'Save ('+opSummary().dirty+')':'Save'}</button><button class="btn btn-outline" style="width:auto;margin:0" onclick="opReload()">Reload</button><button class="btn btn-outline" style="width:auto;margin:0" onclick="goBoard()">Close</button></div></div>${inner}</div>`;
  const seg=`<div class="seg"><button class="${tg==='GREENHOUSE'?'active':''}" onclick="opSetTarget('GREENHOUSE')">Greenhouse</button><button class="${tg==='FIELD'?'active':''}" onclick="opSetTarget('FIELD')">Open field</button></div>`;
  if(opState.busy&&!opState.data[tg]) return head(`<div class="op-ctl">${seg}</div><div class="card">Loading operation planner…</div>`);
  if(opState.error&&!opState.data[tg]) return head(`<div class="op-ctl">${seg}</div><div class="card">${esc(opState.error)}<br><button class="btn btn-outline" style="width:auto;margin-top:8px" onclick="opState.error=null;opLoad(true)">Retry</button></div>`);
  const rows=opRows(), sheet=tg==='FIELD'?'Open Field Operation':'Master Calendar';
  const help=`Enter the first planting date and the number of waves (0 to ${OP_MAX}); leave the interval blank to use ${OP_DEF_INT} days. Sow (propagation) date = planting date minus the crop's lead days; harvest = planting date plus days to first harvest. Saving rewrites each changed crop in <b>${sheet}</b>, filing every wave under the month of its first harvest (max 2 per month).${tg==='FIELD'?' Open-field waves must be inside the crop\'s Oregon allowable window.':' Greenhouse planting is not limited to the Oregon window.'}${IS_DEMO?' <b>Demo mode: nothing is written.</b>':''}`;
  const th=['Crop','Days to 1st harvest','Propagation lead','First planting date','Waves','Interval (days)','First sow','First harvest','Last planting','Last harvest ends','Check',''].map(h=>`<th>${h}</th>`).join('');
  return head(`<div class="op-ctl">${seg}<input type="search" placeholder="Find a crop" value="${esc(opState.filter)}" oninput="opFilter(this.value)"></div><div class="op-help">${help}</div>
    <div class="op-wrap"><table class="op-t"><thead><tr>${th}</tr></thead><tbody id="op-body">${rows.map((r,i)=>opRowHTML(r,i,tg)).join('')}</tbody></table></div>`)
    .replace('id="op-save" ','id="op-save" '+(opSummary().dirty&&!opState.saving?'':'disabled '));
}

/* RULE: Open Field Operation is the ONLY source of entries on the production calendar. Master Calendar is a

 * The feed's FIELD plantings are checked against the dates read straight from Open Field Operation

  try{ const r=await apiCall('get-operation-plan',{target:'FIELD'}), set=new Set();

/* ============================== IRRIGATION CALENDAR ==============================
 * A cohort's irrigation calendar switches on when its planting is VERIFIED (COHORT_PRODUCTION.Actual_DOB, written by
 * verify-planting). Watering dates run from that verified planting date using IRRIGATION_PROFILE (IrrigationCalendar.gs).
 * The manager then assigns workers: 'assign-irrigation' starts Irrigation sessions through the same path as start-sessions.
 * Crops with no irrigation profile are listed, never guessed. */
const IRR_ST={OVERDUE:['Overdue','#B3261E'],DUE:['Due today','#C77700'],UPCOMING:['Upcoming','#6B6B5E'],ASSIGNED:['Assigned','#3A78C9'],IN_PROGRESS:['In progress','#2E7D32'],COMPLETED:['Done','#5B3F8C']};
const irr={data:null,busy:false,error:null,month:null,day:null,loaded:null,pick:{},workers:null,sending:false};
const irrToday=()=>calToday();
function irrRange(){ const [y,m]=irr.month.split('-').map(Number); return {from:`${irr.month}-01`,to:`${irr.month}-${String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0')}`}; }
async function irrLoad(force){
  if(!irr.month) irr.month=irrToday().slice(0,7);
  if(irr.busy||(!force&&irr.loaded===irr.month&&irr.data)) return;
  irr.busy=true; irr.error=null; render();
  try{
    if(IS_DEMO){ irr.data={items:[],activeCohorts:0,waitingForVerification:0,noSchedule:[],demo:true}; }
    else{ irr.data=await apiCall('get-irrigation-calendar',irrRange()); irr.pick={}; }
    irr.loaded=irr.month;
  }catch(err){ irr.error=err.message||'Could not load the irrigation calendar.'; }
  irr.busy=false; render();
}
async function irrWorkers(){
  if(irr.workers) return irr.workers;
  let list=(state.workers||[]).map(w=>({id:w.workerId,name:w.name,role:w.role}));
  if(!list.length&&!IS_DEMO){ try{ const r=await apiCall('list-workers'); list=(r.workers||r||[]).filter(u=>String(u.Status||'ACTIVE').toUpperCase()==='ACTIVE').map(u=>({id:u.Worker_ID,name:u.Name,role:u.Role})); }catch(e){} }
  irr.workers=list.filter(w=>!/^(manager|founder)$/i.test(w.role||'')); render(); return irr.workers;
}
function irrNav(n){ const [y,m]=irr.month.split('-').map(Number); irr.month=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7); irr.day=null; irrLoad(true); }
function irrGoToday(){ irr.month=irrToday().slice(0,7); irr.day=irrToday(); irrLoad(true); }
function irrPickDay(d){ irr.day=d; irrWorkers(); render(); }
function irrWorst(it){ const o=['OVERDUE','DUE','IN_PROGRESS','ASSIGNED','UPCOMING','COMPLETED']; return o.find(s=>it.beds.some(b=>b.status===s))||'UPCOMING'; }
const irrAssignable=b=>b.status==='OVERDUE'||b.status==='DUE'||b.status==='UPCOMING';
function irrSel(it){ const k=it.cohortId+'|'+it.date; return irr.pick[k]=irr.pick[k]||{beds:it.beds.filter(irrAssignable).map(b=>b.bedId),workers:[]}; }
function irrToggle(i,kind,v){ const it=irrDayItems()[i]; if(!it) return; const s=irrSel(it), a=s[kind], at=a.indexOf(v); if(at<0) a.push(v); else a.splice(at,1); render(); }
function irrDayItems(){ return ((irr.data&&irr.data.items)||[]).filter(x=>x.date===irr.day); }
async function irrAssign(i){
  const it=irrDayItems()[i]; if(!it||irr.sending) return; const s=irrSel(it);
  if(!s.beds.length){ toast('Choose at least one bed.'); return; }
  if(!s.workers.length){ toast('Choose at least one worker.'); return; }
  irr.sending=true; render();
  try{ const r=await apiCall('assign-irrigation',{cohortId:it.cohortId,date:it.date,bedIds:s.beds,workerIds:s.workers},60000);
    toast(r.created?`Irrigation assigned: ${r.created} task${r.created===1?'':'s'}.`+(r.failed&&r.failed.length?` ${r.failed.length} failed.`:''):'Nothing was assigned'+(r.failed&&r.failed.length?` (${r.failed.length} failed).`:'.'));
    irr.sending=false; await irrLoad(true);
  }catch(err){ irr.sending=false; toast(err.message||'Could not assign irrigation.'); render(); }
}
function irrCardHTML(it,i){
  const st=irrWorst(it), c=IRR_ST[st], sel=irrSel(it), canAssign=it.beds.some(irrAssignable), workers=irr.workers||[];
  const beds=it.beds.map(b=>{ const a=irrAssignable(b), x=IRR_ST[b.status];
    return `<label class="irr-bed">${a?`<input type="checkbox" ${sel.beds.includes(b.bedId)?'checked':''} onchange="irrToggle(${i},'beds','${esc(b.bedId)}')">`:''}<b>${esc(b.bedId)}</b><span class="irr-st" style="--c:${x[1]}">${x[0]}${b.workerName?' · '+esc(b.workerName):''}</span></label>`; }).join('');
  const ws=canAssign?`<div class="irr-w">${workers.length?workers.map(w=>`<label class="irr-chip"><input type="checkbox" ${sel.workers.includes(w.id)?'checked':''} onchange="irrToggle(${i},'workers','${esc(w.id)}')">${esc(w.name||w.id)}</label>`).join(''):'<span class="note">Loading workers…</span>'}</div>
     <button class="btn" style="width:auto;margin:8px 0 0" ${irr.sending?'disabled':''} onclick="irrAssign(${i})">${irr.sending?'Assigning…':'Assign irrigation'}</button>`:'';
  return `<div class="cal-item" style="--c:${c[1]}"><div class="kind">${c[0]} · irrigation ${it.seq} of ${it.of}</div><div class="nm">${esc(it.cropName)} <span style="font-weight:600;color:var(--ink-soft)">${esc(it.cohortId)}</span></div>
    <div class="sb">Day ${it.dayAfterPlanting} after verified planting (${calFull(it.plantingDate)})${it.depthInches!=null?` · ${it.depthInches} in`:''}${it.reducedDepth?' · <b>reduced depth (pre-harvest dry-down)</b>':''}</div>
    <div class="irr-beds">${beds}</div>${ws}</div>`;
}
function irrScreen(){
  if(!irr.data&&!irr.busy&&!irr.error) irrLoad();

  const d=irr.data||{items:[]}, t=irrToday(), items=d.items||[], by={}; items.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
  const [y,m]=irr.month.split('-').map(Number), mname=new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
  const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(), dim=new Date(Date.UTC(y,m,0)).getUTCDate(); let cells='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>cells+=`<div class="cal-dow">${n}</div>`);

  for(let n=1;n<=dim;n++){ const iso=`${irr.month}-${String(n).padStart(2,'0')}`, ev=by[iso]||[];
    cells+=`<button class="cal-cell ${ev.length?'has':''} ${iso===t?'today':''} ${iso===irr.day?'sel':''}" onclick="irrPickDay('${iso}')"><span class="d">${n}</span>${ev.slice(0,2).map(e=>`<div class="cal-chip" style="--c:${IRR_ST[irrWorst(e)][1]}" title="${esc(e.cropName+' · '+e.cohortId)}">💧 ${esc(e.cropName)}</div>`).join('')}${ev.length>2?`<div class="cal-more">+${ev.length-2} more</div>`:''}</button>`; }
  const dayItems=irr.day?irrDayItems():[];
  const dayBody=irr.day?`<div class="cal-day-h">${calLong(irr.day)}</div>${dayItems.length?dayItems.map(irrCardHTML).join(''):'<div class="card">No irrigation scheduled this day.</div>'}`:'';
  const over=items.filter(x=>x.beds.some(b=>b.status==='OVERDUE')).length, due=items.filter(x=>x.beds.some(b=>b.status==='DUE')).length;
  const cards=[['Verified cohorts',d.activeCohorts||0,'#2E7D32'],['Overdue this month',over,'#B3261E'],['Due today',due,'#C77700'],['Waiting for planting verification',d.waitingForVerification||0,'#6B6B5E']]
    .map(([k,v,c])=>`<div class="cal-card" style="--c:${c};cursor:default"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const ns=(d.noSchedule||[]).length?`<div class="cal-align warn"><b>${d.noSchedule.length} verified cohort(s) have no irrigation schedule</b> (add or fix the crop's IRRIGATION_PROFILE): ${esc(d.noSchedule.slice(0,8).map(x=>x.cohortId+' '+x.cropName).join(', '))}${d.noSchedule.length>8?'…':''}</div>`:'';
  const empty=!d.activeCohorts?`<div class="cal-insight">${d.demo?'Irrigation needs the live workbook.':'No cohort has a verified planting yet. A cohort\'s irrigation calendar switches on as soon as its planting is verified.'}</div>`:'';
  const leg=Object.values(IRR_ST).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('');
  return shell(`<div class="cal-cards">${cards}</div>${empty}${ns}<div class="cal-legend" style="margin-bottom:10px">${leg}</div>
  <div class="cal-nav"><button onclick="irrNav(-1)" aria-label="Previous month">‹</button><div class="ttl"><b>${mname}</b><span>${items.length} irrigation${items.length===1?'':'s'} scheduled${irr.busy?' · updating…':''}</span></div><button onclick="irrNav(1)" aria-label="Next month">›</button><button onclick="irrGoToday()">Today</button></div>
  <div class="cal-grid">${cells}</div>${dayBody}
  <div class="cal-note">Schedule starts on each cohort's verified planting date and repeats at its IRRIGATION_PROFILE frequency until harvest (dry-down rules applied). Assigning starts Irrigation tasks for the chosen beds and workers.</div>`);
}

/* ============================== MANAGER SHELL: SIX TABS ==============================
 * The manager screens are grouped into six tabs; each tab holds the views that already existed plus the new ones.
 * ui.pMode is still the single "which view" switch (every older function keys off it), so a tab is only a grouping.
 *   Infrastructure & Crop Groups  block capacity, rotation family, crop groups per block; rotation editor; crop profile; add crop
 *   Bed Status Board              every bed's Bed_Status by block, Verify Bed Ready, start-of-operations block release
 *   Open Field Operation          OFO schedule editor, production calendar
 *   Bed Planting Plan             Smart allocation dashboard (generate-season), bed layout (BED_PLANTING_PLAN), bed plan sheet
 *   Cohorts                       cohort production, planting execution, harvest, irrigation calendar
 *   Post-Harvest & Cover Crop     beds in turnover with the cover crop mix chosen by exit date
 * NO new Bed_Status value is introduced. "Ready" is the AVAILABLE state itself: BED_STATUS_RULES says AVAILABLE means
 * physically usable and is entered only by the manager's Verify Bed Ready (R11/R13/R14/R15). */
const MOCK_MODES={ exec:1, harvest:1, cover:1 };   /* client-side preview screens: nothing is written to the workbook */
function ptabOf(mode){ return PLAN_TABS.find(t=>t.views.some(v=>v[0]===mode))||PLAN_TABS[0]; }
function setPTab(k){ const t=PLAN_TABS.find(x=>x.k===k); if(t) setPMode(t.views[0][0]); }
function planTabStrip(){
  const cur=ptabOf(ui.pMode);
  return `<div class="ptabs" role="tablist">${PLAN_TABS.map(t=>`<button role="tab" aria-selected="${t.k===cur.k}" class="${t.k===cur.k?'active':''}" onclick="setPTab('${t.k}')">${esc(t.label)}</button>`).join('')}</div>`;
}
function planSubViews(){
  const t=ptabOf(ui.pMode); if(t.views.length<2) return '';
  return `<div class="seg" style="flex-wrap:wrap;">${t.views.map(([k,l])=>`<button class="${ui.pMode===k?'active':''}" onclick="setPMode('${k}')">${esc(l)}</button>`).join('')}</div>`;
}
function planToolbarControls(){
  const m=ui.pMode;
  const yr=`<select onchange="setPYear(this.value)" aria-label="Year">${PLAN_YEARS.map(y=>`<option value="${y}" ${y===ui.pYear?'selected':''}>${y}</option>`).join('')}</select>`;
  const blk=`<select onchange="setPBlock(this.value)" aria-label="Block">${PLAN_BLOCKS.map(b=>`<option value="${b}" ${b===ui.pBlock?'selected':''}>${esc(BLOCK_LABELS[b])}</option>`).join('')}</select>`;
  const refresh=`<button class="btn btn-ghost" style="width:auto;margin:0;" onclick="refreshPlanning()">↻ Refresh</button>`;
  if(m==='addcrop'||m==='calendar'||m==='irrigation'||m==='operation'||m==='sheet') return '';
  if(m==='cohorts') return yr;
  if(m==='cropref') return `<input id="cr-search" placeholder="Search crops…" value="${esc(ui.crFilter)}" oninput="setCrFilter(this.value)" style="min-width:180px;">`;
  if(m==='infra'||m==='smart') return yr+refresh;
  if(m==='bedboard'||m==='postharvest') return refresh;
  return blk+yr+refresh+(m==='plan'?`<button class="btn btn-outline" style="width:auto;margin:0;" onclick="openBedEdit('')">+ Add bed</button>`:'');
}
function mockNotice(){
  return MOCK_MODES[ui.pMode]?`<div class="notice">Preview only: changes on this screen stay in the browser and are not written to the workbook. Use the Daily board for real planting, harvest and bed release.</div>`:'';
}
/* Loads get-planning-context for all five blocks into state.pp (same cache the Bed layout view uses). */
const inf={busy:false,err:'',tried:{}};
async function infraLoad(force){
  if(inf.busy) return; inf.busy=true; inf.err=''; inf.tried[ui.pYear]=true; render();
  for(const b of PLAN_BLOCKS){
    const k=ppKey(ui.pYear,b);
    if(force||!state.pp[k]||state.pp[k].error){
      try{ state.pp[k]=await apiCall('get-planning-context',{year:ui.pYear,blockId:b}); }
      catch(e){ state.pp[k]={error:errMsg(e)}; }
    }
  }
  inf.busy=false; render();
}
function infraEnsure(){ if(!inf.busy&&!inf.tried[ui.pYear]&&PLAN_BLOCKS.some(b=>!state.pp[ppKey(ui.pYear,b)])) setTimeout(()=>infraLoad(),0); }
function layoutSummary(b){
  const c=state.pp[ppKey(ui.pYear,b)]; if(!c) return null; if(c.error) return {error:c.error};
  const rows=(c.plan&&c.plan.beds)||[], crop=r=>r.cropId&&String(r.cropId).toUpperCase()!=='OPEN';
  const confirmed=rows.filter(r=>crop(r)&&r.status==='CONFIRMED'), pending=rows.filter(r=>crop(r)&&r.status!=='CONFIRMED');
  const groups={}; confirmed.concat(pending).forEach(r=>{ const f=r.cropFamily||'No family set'; const g=groups[f]=groups[f]||{}; g[r.cropId]=(g[r.cropId]||0)+1; });
  const cap=(c.physicalBeds||[]).length;
  return { cap, confirmed:confirmed.length, pending:pending.length, open:Math.max(0,cap-confirmed.length-pending.length), groups, rotation:c.rotation||{}, template:c.template||{} };
}

const bb={data:{},busy:false,err:'',tried:false,sel:'B1',reason:'',confirm:false,dry:null,res:null,relBusy:false};
function bbStatusOf(b){ return String(b.bedStatus||'').trim().toUpperCase()||'UNVERIFIED'; }
function bbStyle(st){ const x=BB_STATUS.find(s=>s[0]===st)||['','','#EEE','#1B1B18']; return {fill:x[2],tc:x[3],label:x[1]||st}; }

/* ================= Urgent production (shortfall crop year) =================
 * Manager picks crop(s), a planting date and waves. The backend (UrgentProduction.gs) checks the Oregon window, works out the block
 * from the block layout / rotation, finds beds that are free AND verified ready, and creates cohorts tagged "Shortfall crop year".
 * Nothing is written until "Create shortfall production". */
const urg={opts:null,optsErr:'',loading:false,rows:[],reason:'',busy:false,res:null,err:'',alarm:null,confirmOut:false,done:false};
function urgBlankRow(){ return {cropId:'',date:'',waves:1,beds:'',gap:'',block:''}; }
function urgMsg(e){ return (e&&e.message)?e.message:String(e||'Something went wrong.'); }
async function openUrgent(){
  urg.rows=[urgBlankRow()]; urg.reason=''; urg.res=null; urg.err=''; urg.alarm=null; urg.confirmOut=false; urg.done=false;
  openModal('urgent');
  if(!urg.opts && !urg.loading){
    urg.loading=true; render();
    try{ urg.opts=await apiCall('get-urgent-options',{}); urg.optsErr=''; }catch(e){ urg.optsErr=urgMsg(e); }
    urg.loading=false; render();
  }
}
/* Instant Oregon-window test for the alarm popup (the server re-checks every wave date). Windows repeat yearly (month/day). */
function urgWindowCheck(cropId, iso){
  const c=(urg.opts?urg.opts.crops:[]).find(x=>x.cropId===cropId);
  if(!c||!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return null;
  const md=iso.slice(5); let inside=false;
  (c.windows||[]).forEach(w=>{ if(w.from<=w.to ? (md>=w.from&&md<=w.to) : (md>=w.from||md<=w.to)) inside=true; });
  const pass=inside&&c.fieldAllowed;
  return {pass, name:c.name, date:iso, ranges:(c.windows||[]).map(w=>w.label), fieldAllowed:c.fieldAllowed};
}
function urgSet(i,key,val){
  const r=urg.rows[i]; if(!r) return; r[key]=val; urg.res=null; urg.err=''; urg.confirmOut=false;
  if((key==='cropId'||key==='date') && r.cropId && r.date){
    if(r.date<todayISO()){ toast('The planting date is in the past.'); }
    else{ const c=urgWindowCheck(r.cropId,r.date); if(c) urg.alarm=c; }
  }
  render();
}
function urgAddRow(){ if(urg.rows.length<((urg.opts&&urg.opts.maxCrops)||10)){ urg.rows.push(urgBlankRow()); render(); } }
function urgDelRow(i){ urg.rows.splice(i,1); if(!urg.rows.length) urg.rows.push(urgBlankRow()); urg.res=null; render(); }
function urgAlarmClose(clearDate){ if(clearDate&&urg.alarm){ const r=urg.rows.find(x=>x.date===urg.alarm.date); if(r) r.date=''; urg.res=null; } urg.alarm=null; render(); }
function urgPayload(dry){
  return { items:urg.rows.filter(r=>r.cropId||r.date).map(r=>({cropId:r.cropId,plantingDate:r.date,waves:r.waves||1,bedsPerWave:r.beds||'',gapDays:r.gap||'',block:r.block||''})),
           reason:urg.reason, dryRun:dry, confirmOutOfWindow:urg.confirmOut };
}
async function urgCheck(){
  if(urg.busy) return; urg.busy=true; urg.err=''; urg.res=null; urg.confirmOut=false; render();
  try{ urg.res=await apiCall('urgent-production',urgPayload(true),120000); }catch(e){ urg.err=urgMsg(e); }

async function urgCreate(){
  const r=urg.res; if(urg.busy||!r||!r.dryRun) return;
  const n=r.summary.placed;
  if(!confirm('Create shortfall production?\n\n'+n+' wave(s) will be created and their beds reserved.'+(r.summary.outOfWindow?'\n\n'+r.summary.outOfWindow+' wave(s) are OUTSIDE the Oregon allowable window and will be planted anyway.':'')+'\n\nWaves without enough ready beds are not created.')) return;
  urg.busy=true; urg.err=''; render();
  try{
    const res=await apiCall('urgent-production',urgPayload(false),330000);
    urg.res=res;

    else{
      urg.done=true; toast('Shortfall production created: '+res.summary.created+' cohort(s), '+res.summary.assigned+' bed(s) reserved.');
      try{ bbForget(); bb.tried=false; }catch(e){}
      try{ if(typeof loadToday==='function') await loadToday(); }catch(e){}
      try{ if(typeof loadCohortBoard==='function') await loadCohortBoard(); }catch(e){}
    }

  urg.busy=false; render();
}

  const pairs=keys.reduce((n,k)=>n+(d.matrix[k]||[]).length,0), CH=Math.max(1,Math.min(25,Math.floor(24/Math.max(1,pairs))));
  try{
    for(let i=0;i<items.length;i+=CH){
      d.progress='Working on beds '+(i+1)+'–'+Math.min(i+CH,items.length)+' of '+items.length+'…'; render();
      const r=await apiCall('assign-turnover-bulk',{ items:items.slice(i,i+CH), mode:d.mode, scheduledDate:d.date }, 180000);
      ['created','skipped','failed','removed','locked'].forEach(k=>{ (r[k]||[]).forEach(x=>d.result[k].push(x)); });
    }
  }catch(e){ d.result.error=e.message||'The request failed.'; }
  d.busy=false; d.progress='';
  const n=d.result.created.length+d.result.removed.length; if(n) toast(n+' change'+(n===1?'':'s')+' saved.');
  render(); await loadToday();
}
async function phaUnassignOne(id){

  catch(e){ toast(e.message); }

}
async function phaClearSelected(){
  const ids=Object.keys(pha.sel); if(pha.busy||!ids.length) return;

  pha.busy=true; render();
  try{ const r=await apiCall('unassign-sessions',{ bedIds:ids }, 120000);

/* ---- render: center bed map (Plan/Exec/Harvest/Cover share one 55-bed grid) ---- */
function planBedVisual(mode,crop,n){
  if(!crop) return { fill:'#EEE', tc:'#1B1B18', label:'' };
  if(mode==='plan'){
    if(crop.layoutStatus==='Modified') return { fill:'url(#hatch)', tc:'#14261D', label:'MODIFIED' };
    if(crop.layoutStatus==='Confirmed') return { fill:'#2E7D32', tc:'#fff', label:'CONFIRMED' };
    return { fill:'#D8CFAE', tc:'#1B1B18', label:'PENDING' };
  }
  if(mode==='exec'){ const planted=crop.plantedBeds.includes(n); return planted? { fill:'#2E7D32', tc:'#fff', label:'PLANTED' } : { fill:'#D8CFAE', tc:'#1B1B18', label:'ASSIGNED' }; }
  if(mode==='harvest'){
    if(crop.harvestStatus==='Complete') return { fill:'#7C8B98', tc:'#fff', label:'HARVEST COMPLETE' };
    if(crop.plantingStatus!=='Planted') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    return n%3===0? { fill:'#2E7D32', tc:'#fff', label:'HARVEST READY' } : { fill:'#8FBF8A', tc:'#1B1B18', label:'GROWING' };
  }
  if(mode==='cover'){
    if(crop.harvestStatus!=='Complete') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    const applied=state.cover[ui.pBlock]&&state.cover[ui.pBlock].status==='Applied';
    return applied? { fill:'#2E7D32', tc:'#fff', label:'COVER CROP' } : { fill:'#7C8B98', tc:'#fff', label:'HARVEST COMPLETE' };
  }
  return { fill:'#EEE', tc:'#1B1B18', label:'' };
}
function planBedGridSVG(mode){
  const plan=getPlan(ui.pBlock,ui.pYear), cols=8, cw=70, ch=50, gap=6, rows=Math.ceil(BLOCK_BEDS/cols);
  let svg=`<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#EDE7D3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8FC9" stroke-width="3"/></pattern></defs>`;
  for(let n=1;n<=BLOCK_BEDS;n++){
    const crop=plan.crops.find(c=>c.bedNums.includes(n)), col=(n-1)%cols, row=Math.floor((n-1)/cols), bx=10+col*(cw+gap), by=10+row*(ch+gap);
    const info=planBedVisual(mode,crop,n), sel=ui.pModifying&&ui.pSelBeds.includes(n);
    svg += `<g><rect class="bed" data-pbed="${n}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${info.fill}" ${sel?'stroke="var(--forest)" stroke-width="3"':''}></rect>
      <text x="${bx+6}" y="${by+13}" font-size="8" font-weight="700" fill="${info.tc}" opacity=".7">${String(n).padStart(2,'0')}</text>
      ${crop?`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${info.tc}">${esc(crop.cropName.slice(0,10))}</text>`:`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9" fill="${info.tc}">Empty</text>`}
      ${info.label?`<text x="${bx+cw/2}" y="${by+42}" text-anchor="middle" font-size="6.5" font-weight="700" fill="${info.tc}" opacity=".85">${esc(info.label)}</text>`:''}
    </g>`;
  }
  const W=10+cols*(cw+gap), H=10+rows*(ch+gap);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

}

    }
    case 'move-cohort': {
      const oldBed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!oldBed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      const newBed=demoBeds.find(b=>b.id===p.newLocationId); if(!newBed) return bad('Bed not found.','LOCATION_NOT_FOUND');
      if(newBed.cohortId) return bad('That bed is already occupied.','LOCATION_OCCUPIED');
      newBed.cohortId=oldBed.cohortId; newBed.cropName=oldBed.cropName; newBed.cohortStatus=oldBed.cohortStatus; newBed.currentStage=oldBed.currentStage;
      oldBed.cohortId=''; oldBed.cropName=''; oldBed.cohortStatus=''; oldBed.currentStage='';
      return ok({done:true});
    }
    case 'complete-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='COMPLETE'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    case 'override-post-harvest':
      if(String(p.reason||'').trim().length<5) return bad('An explanation is required.','OVERRIDE_REASON_REQUIRED');
      if(!(p.activities||[]).length) return bad('Select at least one step.','NO_STEPS_SELECTED');
      return ok({ done:true });
    case 'terminate-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='TERMINATED'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    case 'get-team':
      return ok({ team:Object.entries(demoUsers).map(([id,u])=>({ workerId:id.toLowerCase(), name:u.name, role:u.role, status:'ACTIVE', hasPin:!!u.pin, canReset:me.role==='Founder'||['Worker','Technician','Scout'].includes(u.role)||id===me.id })), addableRoles:me.role==='Founder'?['Worker','Manager','Founder','Technician','Scout']:['Worker','Technician','Scout'] });
    case 'add-worker': {
      const nm=String(p.name||'').trim(); if(nm.length<2) return bad('Enter the worker\u2019s name (2 to 60 characters).','TEAM_ERROR');
      let id=String(p.workerId||'').trim().toLowerCase()||nm.split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g,'')||'worker';
      if(demoUsers[id.toUpperCase()]) return bad('Worker ID "'+id+'" is already in use.','TEAM_ERROR');
      const pin=String(p.pin||'')||String(Math.floor(100000+Math.random()*900000));
      demoUsers[id.toUpperCase()]={ pin, name:nm, role:p.role||'Worker' };
      return ok({ worker:{ workerId:id, name:nm, role:p.role||'Worker', status:'ACTIVE' }, pin, pinGenerated:!p.pin });
    }
    case 'reset-worker-pin': {
      const u=demoUsers[String(p.workerId||'').toUpperCase()]; if(!u) return bad('No worker with ID '+p.workerId+'.','TEAM_ERROR');
      const pin=String(p.pin||'')||String(Math.floor(100000+Math.random()*900000)); u.pin=pin;
      return ok({ workerId:p.workerId, name:u.name, pin, pinGenerated:!p.pin });
    }
    case 'get-labor-hours':
      return ok({ missingElapsed:0, sessions:[
        { sessionId:'S-1', workerId:'jo', worker:'Jo Lindqvist', activity:'Weeding', bedId:'B1-02', start:'2026-10-13 08:00', end:'2026-10-13 10:30', minutes:150 },
        { sessionId:'S-2', workerId:'jo', worker:'Jo Lindqvist', activity:'Planting', bedId:'B1-03', start:'2026-10-14 08:00', end:'2026-10-14 09:15', minutes:75 } ] });
    case 'get-cover-windows': {
      const wins=[{crop:'CLV',name:'Clover',windowNo:1,startLabel:'Mar 1',endLabel:'Apr 15'},{crop:'BKW',name:'Buckwheat',windowNo:1,startLabel:'May 15',endLabel:'Jul 15'},
                  {crop:'CLV',name:'Clover',windowNo:2,startLabel:'Sep 1',endLabel:'Oct 15'},{crop:'RYE',name:'Rye',windowNo:1,startLabel:'Sep 1',endLabel:'Oct 20'},{crop:'VET',name:'Vetch',windowNo:1,startLabel:'Sep 1',endLabel:'Oct 15'}];
      const out={source:'RANCH_ALLOWABLE_PLANTING_CAL',windows:wins};
      if(p.date){ const md=+p.date.slice(5,7)*100+ +p.date.slice(8,10), open=md>=901&&md<=1015?'Clover + Rye + Vetch':md>=515&&md<=715?'Buckwheat':'';
        out.mix=open?{openNow:true,label:open,purpose:'',exitDate:p.date}:{openNow:false,label:'No cover crop window is open on '+p.date+' (demo data).',exitDate:p.date}; }
      return ok(out);
    }
    case 'get-urgent-options': return ok({label:'Shortfall crop year',maxWaves:12,maxCrops:10,defaultGapDays:14,crops:[
        {cropId:'KAL',name:'Kale (demo)',category:'Leafy Greens',plantingMethod:'TRANSPLANT',fieldAllowed:true,windows:[{from:'03-20',to:'04-25',label:'Mar 20 - Apr 25'},{from:'08-01',to:'09-10',label:'Aug 1 - Sep 10'}]}]});
    case 'urgent-production': return ok({ok:true,dryRun:p.dryRun!==false,items:[],notes:['Demo mode: nothing is created.'],summary:{waves:0,placed:0,short:0,outOfWindow:0,created:0,assigned:0}});
    case 'get-rotation-plan': return ok({rows:[],statusByYear:{},families:[],editableBlocks:['B1','B2','B3','B4']});
    case 'save-rotation': return ok({year:p.year,status:'Draft',assignments:p.assignments});
    case 'approve-rotation': return ok({year:p.year,status:'Approved'});
    default: return bad('That action is not available.','UNKNOWN_ACTION');
  }
}

/* ============================== START ============================== */
/* Enter signs in. In the ID box it jumps to the PIN first if the PIN is still empty. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||ui.screen!=='login') return;
  const t=e.target; if(!t||(t.id!=='in-id'&&t.id!=='in-pin')) return;
  e.preventDefault();
  const id=$('#in-id'), pin=$('#in-pin');
  if(t.id==='in-id'&&id.value.trim()&&!pin.value.trim()){ pin.focus(); return; }
  doLogin();
});
if(restoreSession()){
  /* A saved sign-in: go straight to the board. If the server no longer accepts the token, apiCall's forceLogout returns to the login screen. */
  ui.screen='board'; render(); loadToday().catch(()=>{});
} else render();
</script>
