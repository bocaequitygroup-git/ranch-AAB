<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Assignment Board — Ngapori Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-dark:#14261D; --sand:#F5F1E6; --paper:#FFFFFF; --ink:#1B1B18; --ink-soft:#5B5A52;
  --line:#DCD5C4; --ok:#2E7D32; --warn:#C77700; --danger:#B3261E; --irrigation:#3A78C9; --musthave:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; } }
:root[data-theme="dark"]{ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; }
*{box-sizing:border-box;} html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topbar .brand{font-weight:800;font-size:15px;}
.topbar .sub{font-size:11px;color:#C9D6CD;}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 11px;border-radius:8px;}
.conn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;}
.conn[data-s=online]{background:#E4F1E5;color:var(--ok);} .conn[data-s=demo]{background:#FBEBD6;color:var(--warn);}
.conn[data-s=offline],.conn[data-s=error]{background:#F7DEDB;color:var(--danger);}
.demo-strip{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:5px 16px;text-align:center;}
.wrap{flex:1;display:flex;min-height:0;}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.toolbar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--paper);}
.toolbar select,.toolbar input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.seg{display:flex;gap:4px;background:var(--sand);padding:3px;border-radius:9px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-soft);}
.seg button.active{background:var(--forest);color:#fff;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);padding:8px 14px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mapscroll{flex:1;overflow:auto;padding:14px;}
.bed{stroke:var(--line);stroke-width:1;cursor:pointer;}
.bed:hover{stroke:var(--forest);stroke-width:2;}
.bed.selected{stroke:var(--forest);stroke-width:3;}
.bed.proposed{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3;}
.bed.proposed:hover{stroke:var(--forest);stroke-width:2;stroke-dasharray:none;}
.bed.proposed.selected{stroke:var(--forest);stroke-width:3;stroke-dasharray:none;}
.sw.sw-proposed{background:#FBEBD6;border:1.5px dashed var(--warn);width:11px;height:11px;}
.sw.sw-avail{background:#EEE;border:1px solid var(--line);}
.badge text,.badge circle{pointer-events:none;}
.bed{pointer-events:all;}
.notice{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:7px 14px;border-bottom:1px solid var(--line);}
.seg .n{opacity:.65;font-weight:600;margin-left:3px;}
.blocklabel{font-size:9px;font-weight:800;fill:var(--ink-soft);}
.panel{width:360px;max-width:92vw;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:margin .15s;}
.panel.closed{display:none;}
.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.panelhead h2{margin:0;font-size:16px;}
.panelhead .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panelhead button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.tabs{display:flex;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:none;padding:10px 4px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--forest);border-color:var(--forest);}
.panelbody{flex:1;overflow-y:auto;padding:14px 16px;}
.card{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.row span:first-child{color:var(--ink-soft);} .row span:last-child{font-weight:700;text-align:right;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;}
.chip-ok{background:#E4F1E5;color:var(--ok);} .chip-warn{background:#FBEBD6;color:var(--warn);} .chip-danger{background:#F7DEDB;color:var(--danger);} .chip-neutral{background:var(--line);color:var(--ink-soft);}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
.btn-primary{background:var(--forest);color:#fff;} .btn-outline{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
.btn-danger{background:var(--danger);color:#fff;} .btn-cta{padding:10px 20px;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.15);}
.proposal{border-left:4px solid var(--warn);} .proposal .plabel{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
.proposal .pname{font-size:15px;font-weight:800;} .proposal .pcode{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.qfocus{outline:3px solid var(--forest);outline-offset:2px;}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 10px;line-height:1.45;}
.btn-reject{background:transparent;color:var(--danger);border:1.5px solid var(--danger);} .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:600;}
.empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;}
.field{margin-bottom:12px;} .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.loginwrap{max-width:380px;margin:60px auto;padding:0 16px;}
.error{background:#F7DEDB;color:var(--danger);padding:10px 13px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:420px;border-radius:14px;padding:18px;max-height:86vh;overflow-y:auto;margin:16px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;}
.sheet.wide{max-width:720px;}
.astrip{gap:6px;padding-top:6px;padding-bottom:6px;} .alabel{font-size:11px;font-weight:800;color:var(--ink-soft);margin-right:4px;text-transform:uppercase;letter-spacing:.03em;}
.astat{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
.astat b{font-size:15px;} .astat span{color:var(--ink-soft);font-weight:600;} .astat.warn{border-color:var(--warn);}
.pill{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:#fff;color:var(--forest);font-size:11px;font-weight:800;margin-left:4px;}
.qgh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:14px 0 6px;position:sticky;top:-18px;background:var(--paper);padding:6px 0;z-index:1;}
.qtop{display:flex;justify-content:space-between;gap:10px;} .qsub{font-size:12px;color:var(--ink-soft);} .qdates{font-size:11.5px;color:var(--ink-soft);text-align:right;}
.qrec{margin:10px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;} .qrec>span:first-child{color:var(--ink-soft);font-size:11.5px;} .qrec b{font-size:19px;color:var(--forest);}
.checks{list-style:none;margin:6px 0 10px;padding:0;font-size:12px;} .checks li{padding:2px 0;} .checks li.ok{color:var(--ok);} .checks li.w{color:var(--warn);font-weight:600;}
.qbtns{display:flex;gap:8px;} .qbtns .btn{margin:0;} .qwarn{border-color:var(--warn);}
.leftpanel{width:280px;max-width:80vw;overflow-y:auto;padding:12px;border-right:1px solid var(--line);background:var(--paper);}
.leftpanel .card{cursor:pointer;}
table.rotmatrix th,table.rotmatrix td{border-bottom:1px solid var(--line);}
@media (max-width:760px){ .wrap{flex-direction:column;} .panel{width:100%;border-left:none;border-top:1px solid var(--line);max-height:60vh;} .leftpanel{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:32vh;} }
</style>
</head>
<body><div id="app"></div>
<script>
/* ============================== CONFIG ============================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';              // set to your Apps Script /exec URL to go live
const APP_NAME = 'ranch_aab';
const IS_DEMO = !WEB_APP_URL;
const REQUEST_TIMEOUT_MS = 20000;
const N_BLOCKS = 6, BEDS_PER_ROW = 8;   // 6 blocks laid out as grids; ~231 beds total (last block trimmed)
const TOTAL_BEDS = 231;
const CROPS = [['Lettuce','LET'],['Kale','KAL'],['Arugula','ARU'],['Radish','RAD'],['Mesclun Mix','MCH'],['Spinach','SPN']];
// These values are COHORT_PRODUCTION.Current_Stage exactly as ActivityEngine.gs
// writes them (its biology clock: Actual_DOB -> Crop_Day -> Current_Stage).
// This file never computes a stage itself - it only displays what the
// backend sends as bed.currentStage. Cohort_Status (PLANNED/PRE_PLANTING/
// ACTIVE/COMPLETE/TERMINATED) is a separate, manager-driven field written by
// AssignmentEngine.gs and shown alongside it, not conflated with it.
const CURRENT_STAGES = ['PRE_PLANTING','GROWING','HARVEST_READY','HARVEST_COMPLETE','TERMINATED'];
const STAGE_COLOR = { PRE_PLANTING:'#D8CFAE', GROWING:'#8FBF8A', HARVEST_READY:'#2E7D32', HARVEST_COMPLETE:'#7C8B98', TERMINATED:'#C9C2AE' };
const QUEUE_COLOR = { MUST_DO:'#B3261E', ATTENTION:'#C77700', ROUTINE:'#5B8FC9', NONE:'transparent' };
const EXC_LABEL = { NO_BLOCK_RULE:'No block rule for this crop', NO_BED_AVAILABLE:'No suitable bed available', NO_LOCATIONS_OF_TYPE:'No beds of this type', MISSING_DATES:'Missing planting / harvest dates', OUTSIDE_PLANTING_WINDOW:'Outside planting window' };
const APPROVE_CHUNK = 5;   // approvals per request: each one re-validates against the live sheets
const COHORT_STATUS_LABEL = { PLANNED:'Planned', PRE_PLANTING:'Assigned · awaiting planting', ACTIVE:'Active', COMPLETE:'Complete', TERMINATED:'Terminated' };

/* ============================== STATE ============================== */
const state = { managerId:null, name:null, role:null, token:null, beds:[], sessions:[], exceptions:[], harvestReady:[], queueByBed:{}, workers:[], eligibleLocations:[],
  aq:{ loaded:false, error:'', counts:{}, proposed:[], exceptions:[], plantingReady:[], generatedDate:'' }, candidates:{ locations:[] },
  todayById:{}, board:{ loaded:false, year:null, beds:[], cohorts:[], byKey:{}, unplaced:[], stats:{} }, cover:{},
  pp:{} /* Planting Plan cache, keyed "year|blockId" -> getPlanningContext() result, or {error} */ };
const ui = { screen:'login', loginErr:'', overlay:'stage', selectedBed:null, tab:'overview', modal:null, modalDraft:{}, toast:'', queueTab:'', focusCohort:null, focusPending:false, generating:false, resetScroll:false, filter:'ALL', year:new Date().getFullYear(), loading:false,
  pMode:'plan', pBlock:'B1', pYear:2027, pSelectedCrop:null, pModifying:false, pSelBeds:[], pAdvOpen:false, pEditingRotation:false, pRotDraft:{},
  ppSelectedKey:null /* selected crop group key "cropId|wave" in real Planting Plan mode */, ppSelectedBed:null, ppBedModify:false, ppBedDraftCrop:'', ppBusy:false, ppHistoryOpen:false,
  crSelectedId:null, crFilter:'' /* Crop Reference mode: selected crop id, list search text */ };
const $=(s,r=document)=>r.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deviceLabel=()=>String(navigator.userAgent||'unknown').slice(0,120);
function toast(msg){ ui.toast=msg; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{ui.toast='';render();},3200); }

/* ============================== API ============================== */
function apiError(message, code){ const e=new Error(message); e.code=code; e.isApiError=true; return e; }
async function apiCall(action, payload={}, timeoutMs){
  const body=Object.assign({}, payload);
  if(state.token && body.token===undefined) body.token=state.token;
  let json;
  try{
    if(IS_DEMO){ json = await mockBackend(action, body); }
    else{
      const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), timeoutMs||REQUEST_TIMEOUT_MS);
      let resp;
      try{ resp=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},body)),redirect:'follow',signal:ctrl.signal}); }
      finally{ clearTimeout(timer); }
      if(!resp.ok) throw apiError('The server answered with status '+resp.status+'.','HTTP');
      json = JSON.parse(await resp.text());
    }
  }catch(err){
    setConn(navigator.onLine===false?'offline':'error');
    if(err && err.isApiError) throw err;
    throw apiError('Could not reach the server.','NETWORK');
  }
  setConn(IS_DEMO?'demo':'online');
  if(json && json.ok===false){
    const e=apiError(json.error||'The request failed.', json.code||'API');
    if(state.managerId && ['UNAUTHENTICATED','ROLE_NOT_ALLOWED'].includes(String(json.code))) forceLogout(e.message);
    throw e;
  }
  return json.data!==undefined ? json.data : json;
}
function setConn(s){ const el=$('#conn'); if(!el) return; el.dataset.s=s; el.textContent={online:'Connected',demo:'Demo data',offline:'Offline',error:'Server not reachable'}[s]||s; }
function forceLogout(msg){ Object.assign(state,{managerId:null,name:null,role:null,token:null}); ui.screen='login'; ui.loginErr=msg||''; render(); }

/* ============================== AUTH ============================== */
async function doLogin(){
  const id=$('#in-id').value.trim(), pin=$('#in-pin').value.trim();
  if(!id||!pin){ ui.loginErr='Enter your worker ID and PIN.'; render(); return; }
  try{
    const res = await apiCall('login', { workerId:id, pin, app:APP_NAME, device:deviceLabel() });
    Object.assign(state, { managerId:res.workerId, name:res.name, role:res.role, token:res.token });
    ui.loginErr=''; ui.screen='board'; render();
    await loadToday();
  }catch(e){ ui.loginErr=e.message; render(); }
}
function logout(){ apiCall('logout',{}).catch(()=>{}); Object.assign(state,{managerId:null,name:null,role:null,token:null}); ui.screen='login'; ui.selectedBed=null; render(); }

/* ============================== DATA LOAD ============================== */
async function loadToday(){
  ui.loading=true; render();
  const [today, board, aq] = await Promise.allSettled([ apiCall('get-manager-today-view', {}), loadCohortBoard(), loadAssignmentQueue() ]);
  ui.loading=false;
  if(today.status==='fulfilled'){
    const d=today.value||{};
    state.beds = d.beds||[]; state.sessions=d.sessions||[]; state.exceptions=d.exceptions||[];
    state.harvestReady=d.harvestReady||[]; state.queueByBed=d.queueByBed||{}; state.workers=d.workers||[];
    state.todayById={}; state.beds.forEach(b=>{ state.todayById[b.id]=b; });
  }
  setConn(IS_DEMO?'demo':'online'); render();
  if(today.status==='rejected') toast(today.reason.message);
  else if(board.status==='rejected') toast('Cohort board: '+board.reason.message);
  else if(aq.status==='rejected') toast('Assignment queue: '+aq.reason.message);
}

/* ============================== COHORT BOARD: COHORT_PRODUCTION -> BEDS ==============================
 * get-cohort-board (AssignmentEngine.gs getCohortBoard) returns COHORT_PRODUCTION rows where
 * Location_ID is not blank, Cohort_Status is not CANCELLED and Planning_Year = ui.year, plus the
 * BED_MASTER grid. Location_ID is parsed here and the cohort tile is placed on the matching bed.
 * Accepted forms: B1-04 / BLK1-04 / BLOCK1-04 -> Block 1, Bed 04;  Z5-03 / ZONE5-03 -> Zone 5, Bed 03.
 * No stage math here: Current_Stage and Cohort_Status are displayed exactly as the backend sends them. */
/* Bed-map filters count BEDS (physical locations). Crop-lifecycle counts belong on the production dashboard. */
const FILTERS = [['ALL','All'],['OCCUPIED','Occupied'],['PROPOSED','Proposed'],['AVAILABLE','Available'],['EXCEPTION','Exceptions']];
/* A bed is in exactly one of three states: OCCUPIED (a cohort has this Location_ID in COHORT_PRODUCTION),
 * PROPOSED (no cohort placed, but the assignment engine has reserved it as a recommendation in
 * COHORT_ASSIGNMENT_QUEUE, awaiting manager approval), or AVAILABLE (neither). PROPOSED is display only:
 * nothing is written to COHORT_PRODUCTION until the manager approves. */
const PROPOSED_FILL = '#FBEBD6';
const DARK_FILLS = ['#2E7D32','#7C8B98','#B3261E','#C77700','#5B8FC9'];
function parseLocationId(id){
  const t=String(id==null?'':id).trim().toUpperCase().replace(/\s+/g,'');
  let m=t.match(/^(?:BLK|BLOCK|B)(\d+)-(\d+)$/);
  if(m) return { kind:'BLOCK', group:+m[1], bed:+m[2], label:'Block '+(+m[1]) };
  m=t.match(/^(?:ZONE|Z)(\d+)-(\d+)$/);
  if(m) return { kind:'ZONE', group:+m[1], bed:+m[2], label:'Zone '+(+m[1]) };
  return null;
}
const locKey = p => p.kind+p.group+'-'+p.bed;
function cohortStage(c){
  const cs=String(c.cohortStatus||'').toUpperCase(), st=String(c.currentStage||'').toUpperCase();
  if(cs==='TERMINATED') return 'TERMINATED';
  if(cs==='COMPLETE') return 'HARVEST_COMPLETE';
  return st || (cs==='PRE_PLANTING' ? 'PRE_PLANTING' : '');
}
const isLive = c => !['TERMINATED','COMPLETE'].includes(String(c.cohortStatus||'').toUpperCase());
const cohortStart = c => c.actualDob||c.plannedDob||'9999';
// A bed is a timeline: show the earliest LIVE cohort (the one in the bed now), else the latest finished one.
function pickCohort(list){ if(!list||!list.length) return null; const live=list.filter(isLive); return live.length ? live.slice().sort((a,b)=>cohortStart(a).localeCompare(cohortStart(b)))[0] : list[list.length-1]; }
async function loadCohortBoard(){
  let d;
  try{ d = await apiCall('get-cohort-board', { year: ui.year }); }
  catch(e){ state.board.error = (e.code?('['+e.code+'] '):'')+e.message; throw e; }
  state.board.error = '';
  const cohorts=(d&&d.cohorts)||[], byKey={}, unplaced=[];
  cohorts.forEach(c=>{ const p=parseLocationId(c.locationId); if(!p){ unplaced.push(c); return; } (byKey[locKey(p)]=byKey[locKey(p)]||[]).push(c); });
  state.board = { error:'', loaded:true, year:ui.year, beds:(d&&d.beds)||[], cohorts, byKey, unplaced, stats:(d&&d.stats)||{} };
}
function gridBeds(){
  return state.board.beds.length ? state.board.beds.map(x=>({ id:x.bedId, blockId:x.blockId, locationType:x.locationType })) : state.beds;
}
/* Proposals keyed by normalised bed id (same parser as the grid, so 'B1-10' / 'BLK1-10' / 'B1-010' all agree).
 * Source: get-assignment-queue -> proposed[] (Status PROPOSED, cohort still unassigned). Exceptions carry no bed. */
function bedKey(id){ const p=parseLocationId(id); return p ? locKey(p) : String(id==null?'':id).trim().toUpperCase(); }
function proposalIndex(){
  const src=state.aq.proposed||[];
  if(proposalIndex._src===src && proposalIndex._map) return proposalIndex._map;
  const m={};
  src.forEach(p=>{ if(!String(p.recommendedBed||'').trim()) return; (m[bedKey(p.recommendedBed)]=m[bedKey(p.recommendedBed)]||[]).push(p); });
  Object.keys(m).forEach(k=>m[k].sort((a,b)=>String(a.plannedDob).localeCompare(String(b.plannedDob))||String(a.cohortId).localeCompare(String(b.cohortId))));
  proposalIndex._src=src; proposalIndex._map=m; return m;
}
function bedState(v){ return v.cohortId ? 'OCCUPIED' : (v.proposals&&v.proposals.length ? 'PROPOSED' : 'AVAILABLE'); }
function bedView(b){
  const v = Object.assign({}, state.todayById[b.id]||{}, { id:b.id, blockId:b.blockId, locationType:b.locationType||(state.todayById[b.id]||{}).locationType||'' });
  v.proposals = proposalIndex()[bedKey(b.id)] || [];
  if(!state.board.loaded) return v;
  const p=parseLocationId(b.id), c = p ? pickCohort(state.board.byKey[locKey(p)]) : null;
  if(c){
    Object.assign(v, { cohortId:c.cohortId, cropId:c.cropId, cropName:c.cropName, cohortStatus:c.cohortStatus, currentStage:cohortStage(c),
      plannedDob:c.plannedDob||'', plantingDate:c.actualDob||'', harvestWindow:(c.harvestWindowStart||c.harvestWindowEnd)?((c.harvestWindowStart||'?')+' → '+(c.harvestWindowEnd||'?')):'' });
  }else{
    Object.assign(v, { cohortId:'', cropId:'', cropName:'', cohortStatus:'', currentStage:'', plannedDob:'', plantingDate:'', harvestWindow:'' });
  }
  return v;
}
function bedViewById(id){ const b=gridBeds().find(x=>x.id===id); return b?bedView(b):null; }
function bedMatches(v){
  if(ui.filter==='ALL') return true;
  if(ui.filter==='EXCEPTION') return bedExceptions(v.id).some(x=>x.status!=='RESOLVED');
  if(ui.filter==='OCCUPIED') return bedState(v)==='OCCUPIED';
  if(ui.filter==='PROPOSED') return bedState(v)==='PROPOSED';
  if(ui.filter==='AVAILABLE') return bedState(v)==='AVAILABLE';
  return true;
}
function filterCounts(views){
  const n={ ALL:views.length, OCCUPIED:0, PROPOSED:0, AVAILABLE:0, EXCEPTION:0 };
  views.forEach(v=>{
    n[bedState(v)]++;
    if(bedExceptions(v.id).some(x=>x.status!=='RESOLVED')) n.EXCEPTION++;
  });
  return n;
}
function setFilter(k){ ui.filter=k; render(); }
function setYear(y){ ui.year=+y; loadToday(); }
function boardNotice(views){
  const b=state.board; if(!b.loaded) return '';
  const gridKeys=new Set(gridBeds().map(x=>{ const p=parseLocationId(x.id); return p?locKey(p):x.id; }));
  const orphans=b.cohorts.filter(c=>{ const p=parseLocationId(c.locationId); return !p || !gridKeys.has(locKey(p)); });
  const placed=views.filter(v=>v.cohortId).length;
  if(orphans.length) return `${orphans.length} cohort(s) have a Location_ID that matches no bed: ${orphans.slice(0,6).map(c=>esc(c.cohortId+' → '+c.locationId)).join(', ')}${orphans.length>6?'…':''}`;
  if(!b.cohorts.length){
    const un=b.stats&&b.stats.unassigned, tot=b.stats&&b.stats.yearRows;
    const np=views.filter(v=>bedState(v)==='PROPOSED').length;
    return `No cohorts in ${ui.year} have a Location_ID yet${tot!=null?` (${tot} cohort rows in COHORT_PRODUCTION, ${un!=null?un:tot} unassigned)`:''}. ${np?`${np} bed${np===1?' is':'s are'} reserved as proposals awaiting approval - `:''}Open “Assignments” to review the recommended beds.`;
  }
  return '';
}

/* ==================== ASSIGNMENT ENGINE WRITE-BACK ACTIONS ====================
 * These call AssignmentEngine.gs only: assignBed / verifyPlanting / moveCohort /
 * completeCohort / terminateCohort. No stage or crop-day math lives here - the
 * board only refreshes and re-renders whatever the backend sends back.
 */
/* Bed assignment is a proposal/approval workflow: BedAssignmentEngine.gs recommends a bed for every
 * planned cohort (crop block rule, bed availability over time, rotation, planting window); the manager
 * approves or changes it. Nothing here asks the manager to pick from the full bed list. */
async function loadAssignmentQueue(){
  try{ const d=await apiCall('get-assignment-queue', { year: ui.year }); state.aq=Object.assign({ loaded:true, error:'' }, d); }
  catch(e){ state.aq.error=(e.code?('['+e.code+'] '):'')+e.message; throw e; }
}
function openQueue(tab, focusCohortId){
  ui.focusCohort=focusCohortId||null; ui.focusPending=!!focusCohortId;
  const c=state.aq.counts||{};
  ui.queueTab = tab ? tab : c.proposed ? 'proposed' : c.exceptions ? 'exceptions' : (c.plantingReady ? 'assigned' : 'proposed');
  openModal('queue');
}
function setQueueTab(t){ ui.queueTab=t; ui.resetScroll=true; render(); }
async function doGenerate(){
  ui.generating=true; state.aq.error=''; render();
  try{
    const r=await apiCall('generate-bed-recommendations', { year: ui.year }, 90000);
    await loadAssignmentQueue();
    ui.queueTab = r.proposed ? 'proposed' : 'exceptions'; ui.resetScroll=true;
    toast(r.proposed+' recommended · '+r.exceptions+' need review');
  }catch(e){ state.aq.error='Generate failed: '+(e.code?('['+e.code+'] '):'')+e.message; toast(e.message); }
  ui.generating=false; render();
}
async function approveAssignment(cohortId){
  try{ const r=await apiCall('approve-assignment', { cohortId }, 60000); toast('Approved → '+r.locationId+'. Ready for planting.'); }
  catch(e){ toast(e.message); }
  await loadToday();
}
async function doApproveBatch(ids){
  if(!ids||!ids.length) return;
  if(!confirm('Approve '+ids.length+' recommended assignments?')) return;
  let ok=0, failed=0;
  for(let i=0;i<ids.length;i+=APPROVE_CHUNK){
    toast('Approving '+Math.min(i+APPROVE_CHUNK,ids.length)+' of '+ids.length+'…');
    try{ const r=await apiCall('approve-assignments', { cohortIds: ids.slice(i,i+APPROVE_CHUNK) }, 120000); ok+=r.approved; failed+=r.failed; }
    catch(e){ failed+=ids.length-i; break; }
  }
  toast(ok+' approved'+(failed?(' · '+failed+' need attention - regenerate or change location'):''));
  await loadToday();
}
async function openChangeAssignmentBed(cohortId){
  try{ state.candidates = await apiCall('get-bed-candidates', { cohortId }); openModal('change-loc', { cohortId }); }
  catch(e){ toast(e.message); }

/* Validates server-side (bed exists / available / crop allowed / rotation). Saves the new bed onto the proposal and

}

function mapSVG(){
  const cols=BEDS_PER_ROW, cw=84, ch=58, gap=6, blockGap=26;
  const grid=gridBeds();
  const blocks=[...new Set(grid.map(b=>b.blockId))];
  let svg='', curY=16;
  blocks.forEach(blk=>{
    const beds=grid.filter(b=>b.blockId===blk), rows=Math.ceil(beds.length/cols);
    svg += `<text class="blocklabel" x="10" y="${curY-5}">${esc(blk)}</text>`;
    beds.forEach((b,idx)=>{
      const v=bedView(b), match=bedMatches(v), st=bedState(v), has=st==='OCCUPIED', prop=st==='PROPOSED', pr=prop?v.proposals[0]:null;
      const col=idx%cols, row=Math.floor(idx/cols), bx=10+col*(cw+gap), by=curY+row*(ch+gap);
      const exc=bedExceptions(v.id).some(x=>x.status!=='RESOLVED'), hr=state.harvestReady.some(h=>h.bedId===v.id), sess=bedSessions(v.id).length;
      const qf=bedFill(v), fill=has?qf:(ui.overlay==='queue'?(qf!=='transparent'?qf:(prop?PROPOSED_FILL:qf)):(prop?PROPOSED_FILL:'#EEE')), tc=DARK_FILLS.includes(fill)?'#fff':'#1B1B18';
      const bedNo=esc(String(v.id).split('-')[1]||v.id);
      svg += `<g class="badge" opacity="${match?1:0.28}">
        <rect class="bed ${prop?'proposed':''} ${ui.selectedBed===v.id?'selected':''}" data-bed="${esc(v.id)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}"></rect>
        <text x="${bx+6}" y="${by+11}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${bedNo}</text>
        ${has&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(v.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(v.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">${esc((v.currentStage||v.cohortStatus||'').replace(/_/g,' '))}</text>`:''}
        ${prop&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(pr.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(pr.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">PROPOSED${v.proposals.length>1?' +'+(v.proposals.length-1):''}</text>`:''}
        ${sess?`<circle cx="${bx+cw-7}" cy="${by+7}" r="4" fill="#1F3A2E"></circle>`:''}
        ${exc?`<circle cx="${bx+cw-19}" cy="${by+7}" r="4" fill="var(--danger)"></circle>`:''}
        ${hr?`<circle cx="${bx+cw-7}" cy="${by+ch-7}" r="4" fill="var(--ok)"></circle>`:''}
      </g>`;
    });
    curY += rows*(ch+gap) + blockGap;
  });
  const W=10+cols*(cw+gap);
  return `<svg viewBox="0 0 ${W} ${curY}" width="${W}" height="${curY}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

/**
 * Manager write-back actions, gated on Cohort_Status - these call
 * AssignmentEngine.gs only (assignBed / verifyPlanting / moveCohort /
 * completeCohort / terminateCohort). No crop-day or stage math happens here;
 * this board only ever displays what the backend already computed.
 */
function confidenceOf(p){ return (p.reasons||[]).some(r=>String(r).startsWith('⚠')) ? ['Review needed','chip-warn'] : ['Match','chip-ok']; }
/* An unoccupied bed is either PROPOSED (the engine reserved it in COHORT_ASSIGNMENT_QUEUE, awaiting approval) or
 * AVAILABLE. A proposal is labelled as pending and never presented as something this bed has: the bed is not
 * occupied and nothing is written to COHORT_PRODUCTION until a manager approves it in Assignments. */
function proposalCards(b){
  return b.proposals.map(p=>{ const cf=confidenceOf(p); return `<div class="card proposal"><div class="plabel">Pending assignment</div>
      <div class="row"><span>Pending</span><span>${esc(p.cropName)} ${esc(p.cohortId)}</span></div>
      <div class="row"><span>Planting</span><span>${esc(p.plannedDob||'—')}</span></div>
      <div class="row"><span>Confidence</span><span><span class="chip ${cf[1]}">${cf[0]}</span></span></div>
      <div class="qsub" style="margin-top:4px;">Approval required</div>
      <button class="btn btn-primary" style="margin:8px 0 0;" onclick="openQueue('proposed','${esc(p.cohortId)}')">Review Assignment</button></div>`; }).join('');
}
function pendingBlock(b, occupied){
  if(!b.proposals.length) return '';
  return `<h2 style="font-size:13px;margin:14px 0 6px;">${occupied?'Next in this bed (proposed)':'Pending assignment'}</h2>
    <div class="note" style="margin-top:0;">Proposals only. Nothing is assigned to ${esc(b.id)} until a manager approves it in Assignments.</div>${proposalCards(b)}`;
}
function emptyBedBlock(b){
  if(b.proposals.length){
    return `<div class="card">
      <div class="row"><span>Status</span><span><span class="chip chip-warn">Proposed</span></span></div>
      <div class="row"><span>Current</span><span>No crop assigned</span></div></div>
      ${pendingBlock(b,false)}`;
  }
  return `<div class="card">
      <div class="row"><span>Status</span><span><span class="chip chip-ok">Available</span></span></div>
      <div class="row"><span>Current</span><span>No crop assigned</span></div>
      <div class="row"><span>Pending</span><span>No pending assignments</span></div></div>`;
}
function cohortActionButtons(b){
  const cs=b.cohortStatus||'';
  const btns=[];
  if(cs==='PRE_PLANTING'){
    btns.push(`<button class="btn btn-primary" onclick="openModal('verify-planting',{cohortId:'${esc(b.cohortId)}',bedId:'${esc(b.id)}'})">Verify planting</button>`);
  }
  if(cs==='PRE_PLANTING' || cs==='ACTIVE'){
    btns.push(`<button class="btn btn-outline" onclick="openMoveModal('${esc(b.cohortId)}')">Move to another bed</button>`);
  }
  if(cs==='ACTIVE'){
    btns.push(`<button class="btn btn-outline" onclick="doCompleteCohort('${esc(b.cohortId)}')">Mark cohort complete</button>`);
  }
  if(cs==='PRE_PLANTING' || cs==='ACTIVE'){
    btns.push(`<button class="btn btn-danger" onclick="openModal('terminate',{cohortId:'${esc(b.cohortId)}'})">Terminate cohort</button>`);
  }
  return btns.length? `<div style="margin:10px 0;">${btns.join('')}</div>` : '';
}
function activityTab(b){
  const rows=(b.activityLog||[]);
  return rows.length? `<div class="card">${rows.map(r=>`<div class="row"><span>${esc(r.taskType)} · ${esc(r.workerName||r.workerId)}</span><span>${esc(r.endTime||'')}</span></div>`).join('')}</div>` : `<div class="empty">No completed activity logged for this bed yet.</div>`;
}
function exceptionsTab(b,exc){
  return exc.length? exc.map(x=>`<div class="card">
    <div class="row"><span>${esc(x.type)}</span><span class="chip ${x.severity==='CRITICAL'||x.severity==='HIGH'?'chip-danger':'chip-warn'}">${esc(x.severity)}</span></div>
    <div class="row"><span>Reported</span><span>${esc(x.workerName||x.worker||'')}</span></div>
    ${x.notes?`<div class="row"><span>Notes</span><span>${esc(x.notes)}</span></div>`:''}
    ${x.status==='OPEN'?`<button class="btn btn-primary" onclick="openModal('resolve',{exceptionId:'${esc(x.id)}'})">Mark resolved</button>`:`<span class="chip chip-ok">RESOLVED</span>`}
  </div>`).join('') : `<div class="empty">No exceptions on this bed.</div>`;
}
function harvestTab(b,hr){
  if(!hr) return `<div class="empty">This bed's cohort is not flagged harvest-ready.</div>`;
  return `<div class="card">
    <div class="row"><span>Target qty</span><span>${esc(hr.targetQty||'—')}</span></div>
    <div class="row"><span>Target date</span><span>${esc(hr.targetDate||'—')}</span></div>
    <div class="row"><span>Notes</span><span>${esc(hr.notes||'—')}</span></div></div>
    <button class="btn btn-primary" onclick="verifyHarvestReady('${esc(b.cohortId)}','${esc(b.id)}')">Verify harvest ready</button>
    <button class="btn btn-outline" onclick="verifyHarvestComplete('${esc(b.cohortId)}')">Mark harvest complete</button>`;
}

function modalHTML(){
  if(!ui.modal) return '';
  let inner='';
  if(ui.modal==='dispatch') inner=dispatchModal();
  else if(ui.modal==='reassign') inner=reassignModal();
  else if(ui.modal==='resolve') inner=resolveModal();
  else if(ui.modal==='queue') inner=queueModal();
  else if(ui.modal==='change-loc') inner=changeLocModal();
  else if(ui.modal==='reject') inner=rejectModal();
  else if(ui.modal==='verify-planting') inner=verifyPlantingModal();
  else if(ui.modal==='move') inner=moveModal();
  else if(ui.modal==='terminate') inner=terminateModal();
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet${ui.modal==='queue'?' wide':''}">${inner}</div></div>`;
}

  ['Harvest',['Harvest Prep','Harvest']],

function resolveModal(){

function queueModal(){
  const a=state.aq, c=a.counts||{}, tab=ui.queueTab||'proposed', has=(c.proposed||0)+(c.exceptions||0)>0;
  const tabs=[['proposed','Recommended',c.proposed||0],['exceptions','Exceptions',c.exceptions||0],['assigned','Assigned',c.plantingReady||0]];
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">
      <div><h2 style="font-size:16px;margin:0;">Bed assignments · ${esc(ui.year)}</h2>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">${c.unassigned||0} unassigned cohorts${c.rejected?` · ${c.rejected} rejected`:''}${a.generatedDate?` · recommendations generated ${esc(a.generatedDate)}`:''}</div></div>
      <button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);">✕</button></div>
    ${a.error?`<div class="error">${esc(a.error)}</div>`:''}
    <button class="btn btn-primary" ${ui.generating?'disabled':''} onclick="doGenerate()">${ui.generating?'Generating…':(has?'Regenerate assignments':'Generate assignments')}</button>
    ${(c.notYetProposed>0&&has)?`<div class="notice" style="border-radius:8px;margin-bottom:10px;">${c.notYetProposed} cohort(s) have no recommendation yet. Regenerate to include them.</div>`:''}
    <div class="seg" style="margin-bottom:6px;">${tabs.map(([k,l,n])=>`<button class="${tab===k?'active':''}" onclick="setQueueTab('${k}')">${l} (${n})</button>`).join('')}</div>

function reasonList(p){ return `<ul class="checks">${(p.reasons||[]).map(r=>`<li class="${String(r).startsWith('⚠')?'w':'ok'}">${esc(r)}</li>`).join('')}</ul>`; }
function cohortHead(p){ return `<div class="qtop"><div><b>${esc(p.cropName)}</b><div class="qsub">Wave ${esc(p.waveNumber)} · ${esc(p.cohortId)}</div></div><div class="qdates">DOB ${esc(p.plannedDob)}<br>ends ${esc(p.endDate||'—')}</div></div>`; }
function proposedList(){
  const list=state.aq.proposed||[];
  if(!list.length) return `<div class="empty">${(state.aq.counts&&state.aq.counts.unassigned)?'Nothing is waiting for approval yet. Click “Generate assignments” and the system will propose a bed for each unassigned cohort.':'Every cohort has a bed.'}</div>`;
  const groups={}; list.forEach(p=>{ const g=p.blockId||'Unplaced'; (groups[g]=groups[g]||[]).push(p); });
  return Object.keys(groups).sort().map(g=>{ const items=groups[g];
    return `<div class="qgh"><span><b>${esc(g)}</b> · ${items.length}</span><button class="btn btn-outline" style="width:auto;margin:0;padding:5px 10px;font-size:12px;" onclick="doApproveBatch(${esc(JSON.stringify(items.map(p=>p.cohortId)))})">Approve all ${items.length}</button></div>`
      + items.map(p=>`<div id="qc-${esc(p.cohortId)}" class="card ${(p.reasons||[]).some(r=>String(r).startsWith('⚠'))?'qwarn':''} ${ui.focusCohort===p.cohortId?'qfocus':''}">${cohortHead(p)}
        <div class="qrec"><span>Recommended location</span><b>${esc(p.recommendedBed)}</b><span class="chip chip-neutral">${esc(p.blockId)}</span></div>
        ${reasonList(p)}
        <div class="qbtns"><button class="btn btn-primary" onclick="approveAssignment('${esc(p.cohortId)}')">Approve</button><button class="btn btn-outline" onclick="openChangeAssignmentBed('${esc(p.cohortId)}')">Change</button><button class="btn btn-reject" onclick="openRejectModal('${esc(p.cohortId)}')">Reject</button></div></div>`).join('');
  }).join('');
}
function exceptionList(){
  const list=state.aq.exceptions||[];
  if(!list.length) return `<div class="empty">No exceptions. Every cohort has a recommendation.</div>`;
  return list.map(p=>`<div class="card qwarn">${cohortHead(p)}
    <div class="qrec"><span class="chip chip-danger">${esc(EXC_LABEL[p.exceptionType]||p.exceptionType||'Exception')}</span></div>
    <ul class="checks">${(p.reasons||[]).map(r=>`<li class="w">${esc(r)}</li>`).join('')}</ul>
    <div class="qbtns">${p.exceptionType==='MISSING_DATES'?'':`<button class="btn btn-outline" onclick="openChangeAssignmentBed('${esc(p.cohortId)}')">Choose a location</button>`}<button class="btn btn-reject" onclick="openRejectModal('${esc(p.cohortId)}')">Reject</button></div></div>`).join('');
}
function assignedList(){
  const list=state.aq.plantingReady||[];

  return list.map(p=>`<div class="card"><div class="qtop"><div><b>${esc(p.cropName)}</b><div class="qsub">Wave ${esc(p.waveNumber)} · ${esc(p.cohortId)}</div></div><div class="qdates">Planned DOB<br>${esc(p.plannedDob)}</div></div>

function changeLocModal(){

/* ============================== SEASON PLANNING (BED_PLANTING_PLAN / BLOCK_ROTATION_PLAN) ==============================

const PLAN_MODES=[['plan','Season Planning'],['exec','Planting Execution'],['harvest','Harvest'],['cover','Cover Crop'],['rotation','Rotation'],['cropref','Crop Profile']];
/* CROP_MASTER: crop-identity master, reconciled per the ranch's authority model:

 *    joined via a manually-verified Crop_ID map (life.crop_id -> reference.crop_id) because the two sheets
 *    use different ID schemes for the same crops. That map is NOT stored here; it was resolved once when this
 *    file was generated and only the resolved data is embedded below.
 *  - CROP_PROPAGATION_PARAMETERS (lead-day breakdown) and RANCH_ALLOWABLE_PLANTING_CAL (planting window)
 *    already use CROP_REFERENCE's ID scheme, so no mapping was needed for those.
 *  - One unresolved gap: AMA-L (Amaranth, Leafy) has no CROP_LIFECYCLE record. CROP_LIFECYCLE's only
 *    "Mchicha / Amaranth" row was assigned to MCH; see that crop's `gap` field. Needs a ranch decision.
 *  - Land allocation / bed / layout-status fields are intentionally NOT part of this master - those are

const PLAN_BLOCKS=['B1','B2','B3','B4','Z5']; // canonical short Block_ID, matches BLOCK_ROTATION_PLAN / BED_PLANTING_PLAN / BED_MASTER Bed_ID prefix
const BLOCK_LABELS={B1:'Block 1',B2:'Block 2',B3:'Block 3',B4:'Block 4',Z5:'Zone 5'};
const PLAN_YEARS=[2026,2027,2028];
const BLOCK_BEDS=55;
const ROTATION_FAMILIES=['Solanaceae','Fast Greens','Brassicas','Roots'];
const FAMILY_TEMPLATES={
  'Roots':[['Carrots',8,'March 1'],['Beets',7,'March 1'],['Turnips',6,'April 1']],
  'Solanaceae':[['Tomatoes',10,'May 1'],['Peppers',8,'May 15']],
  'Fast Greens':[['Lettuce',9,'Feb 15'],['Arugula',6,'Feb 15'],['Spinach',6,'March 1']],
  'Brassicas':[['Broccoli',9,'April 1'],['Kale',7,'April 1'],['Cabbage',6,'April 15']],
  'Perennial':[['Herbs',10,'—']]
};
const rotationOverrides={}, rotationStatusByYear={}, planningPlans={};
function familyForBlockYear(block,year){
  if(block==='Z5') return 'Perennial';
  const n=+block.slice(-1), off=((year-2026)%4+4)%4;
  const rotated= off? ROTATION_FAMILIES.slice(4-off).concat(ROTATION_FAMILIES.slice(0,4-off)) : ROTATION_FAMILIES.slice();
  return rotated[n-1];
}
function rotationFamily(block,year){ return (rotationOverrides[year]&&rotationOverrides[year][block]) || familyForBlockYear(block,year); }
function getRotationStatus(year){ return rotationStatusByYear[year] || (year<=2026?'Approved':'Draft'); }
function prevBlockFor(block,year){
  if(block==='Z5') return 'Z5';
  const fam=rotationFamily(block,year);
  for(const b of PLAN_BLOCKS){ if(b!=='Z5' && familyForBlockYear(b,year-1)===fam) return b; }
  return block;
}
function blockRangeLabel(block,beds){
  if(!beds.length) return '—';
  const n=block==='Z5'?5:+block.slice(-1);
  return 'B'+n+' '+String(beds[0]).padStart(2,'0')+' → B'+n+' '+String(beds[beds.length-1]).padStart(2,'0');
}
function planKey(b,y){ return b+'|'+y; }
function buildPlan(block,year){
  const fam=rotationFamily(block,year), tmpl=FAMILY_TEMPLATES[fam]||FAMILY_TEMPLATES['Roots'];
  let cursor=1; const crops=[];
  tmpl.forEach(([name,count,date])=>{
    const beds=[]; for(let i=0;i<count && cursor<=BLOCK_BEDS;i++,cursor++) beds.push(cursor);
    crops.push({ id:(block+'-'+year+'-'+name).replace(/\s+/g,'').toUpperCase(), cropName:name, family:fam, plantingDate:date,
      bedNums:beds, layoutStatus:'Pending', plantingStatus:'Not planted', harvestStatus:'Not started', plantedBeds:[],
      lastYearBedRange: year>PLAN_YEARS[0]?blockRangeLabel(prevBlockFor(block,year),beds):'—',
      rotationNote: prevBlockFor(block,year)+' → '+block, harvestWindow: date+' + 45 days' });
  });
  return { crops };
}
function getPlan(block,year){ const k=planKey(block,year); if(!planningPlans[k]) planningPlans[k]=buildPlan(block,year); return planningPlans[k]; }
function cropById(id){ return getPlan(ui.pBlock,ui.pYear).crops.find(x=>x.id===id); }
function cropBedRangeLabel(block,crop){ return blockRangeLabel(block,crop.bedNums); }
function harvestStatusOf(c){ return c.harvestStatus==='Complete'?'Complete':(c.plantingStatus==='Planted'?'In progress':'Not started'); }
function chipClassFor(s){ return {Confirmed:'chip-ok',Planted:'chip-ok',Complete:'chip-ok',Modified:'chip-warn','In progress':'chip-warn',Pending:'chip-neutral','Not planted':'chip-neutral','Not started':'chip-neutral'}[s]||'chip-neutral'; }

/* ---- Planting Plan actions ---- */
function confirmLayout(cropId){ const c=cropById(cropId); if(!c) return; c.layoutStatus='Confirmed'; toast(c.cropName+' layout confirmed and locked.'); render(); }
function startModify(cropId){ const c=cropById(cropId); if(!c) return; ui.pModifying=true; ui.pSelBeds=c.bedNums.slice(); render(); }
function toggleModifyBed(n){ if(!ui.pModifying) return; const i=ui.pSelBeds.indexOf(n); if(i>=0) ui.pSelBeds.splice(i,1); else ui.pSelBeds.push(n); render(); }
function cancelModify(){ ui.pModifying=false; render(); }
function saveModifyLayout(cropId){
  const plan=getPlan(ui.pBlock,ui.pYear), c=plan.crops.find(x=>x.id===cropId); if(!c) return;
  const taken=new Set(); plan.crops.forEach(x=>{ if(x.id!==cropId) x.bedNums.forEach(n=>taken.add(n)); });
  const clash=ui.pSelBeds.filter(n=>taken.has(n));
  if(clash.length){ toast('Beds already assigned to another crop: '+clash.join(', ')); return; }
  if(!ui.pSelBeds.length){ toast('Select at least one bed.'); return; }
  c.bedNums=ui.pSelBeds.slice().sort((a,b)=>a-b); c.layoutStatus='Modified'; ui.pModifying=false;
  toast(c.cropName+' layout modified.'); render();
}
function resetPlan(cropId){
  if(!confirm('Reset the planting plan for this crop? This clears its bed assignments.')) return;
  const c=cropById(cropId); if(!c) return;
  c.bedNums=[]; c.layoutStatus='Pending'; c.plantingStatus='Not planted'; c.plantedBeds=[];
  toast(c.cropName+' planting plan reset.'); render();
}
/* ---- Planting Execution actions ---- */
function markCropPlanted(cropId){ const c=cropById(cropId); if(!c) return; c.plantingStatus='Planted'; c.plantedBeds=c.bedNums.slice(); toast('All cohorts for '+c.cropName+' marked PLANTED.'); render(); }
function markBedPlanted(cropId,bedNum){
  const c=cropById(cropId); if(!c) return;
  if(!c.plantedBeds.includes(bedNum)) c.plantedBeds.push(bedNum);
  c.plantingStatus = c.plantedBeds.length>=c.bedNums.length ? 'Planted' : 'In progress';
  render();
}

function markHarvestComplete(cropId){ const c=cropById(cropId); if(!c) return; c.harvestStatus='Complete'; toast(c.cropName+' cohorts set to HARVEST_COMPLETE.'); render(); }

function applyCoverCrop(block){

function openEditRotation(){ ui.pRotDraft={}; PLAN_BLOCKS.filter(b=>b!=='Z5').forEach(b=>{ ui.pRotDraft[b]=rotationFamily(b,ui.pYear); }); ui.pEditingRotation=true; render(); }
function setRotDraft(block,fam){ ui.pRotDraft[block]=fam; }
function saveRotationDraft(){ rotationOverrides[ui.pYear]=Object.assign({},ui.pRotDraft); rotationStatusByYear[ui.pYear]='Draft'; ui.pEditingRotation=false; toast('Rotation for '+ui.pYear+' saved as draft.'); render(); }
function cancelEditRotation(){ ui.pEditingRotation=false; render(); }
function approveRotation(){
  if(!confirm('Approve the '+ui.pYear+' rotation plan? This locks BLOCK_ROTATION_PLAN and generates BED_PLANTING_PLAN for every block.')) return;
  rotationStatusByYear[ui.pYear]='Approved';
  PLAN_BLOCKS.filter(b=>b!=='Z5').forEach(b=>{ delete planningPlans[planKey(b,ui.pYear)]; getPlan(b,ui.pYear); });
  toast(ui.pYear+' rotation approved. Planting plans generated for all blocks.'); render();
}

/* ============================== REAL Planting Plan mode (BED_PLANTING_PLAN via PlantingPlanAPI.gs) ==============================
 * This replaces the mock buildPlan()/getPlan() data path ONLY for pMode==='plan'. Execution/Harvest/Cover/Rotation
 * modes above are unchanged and still run on client-side mock data — wire those to their own backend actions later.
 * Flow: display -> manager interaction -> send action -> refresh. No recommendation/assignment logic lives here;
 * the backend (approved BLOCK_TEMPLATE / BLOCK_ROTATION_PLAN) is the only source of what should be planted where. */
function ppKey(year,block){ return year+'|'+block; }
function ppCurrent(){ return state.pp[ppKey(ui.pYear,ui.pBlock)]; }
async function loadPlanningContext(force){
  const key=ppKey(ui.pYear,ui.pBlock);
  if(state.pp[key] && !force) return;
  ui.ppBusy=true; render();
  try{
    const data=await apiCall('get-planning-context', { year:ui.pYear, blockId:ui.pBlock });
    state.pp[key]=data;
  }catch(err){
    state.pp[key]={ error:err.message||'Could not load the planning context.' };
  }
  ui.ppBusy=false; render();
}
function ensurePlanLoaded(){ if(!state.pp[ppKey(ui.pYear,ui.pBlock)] && !ui.ppBusy) loadPlanningContext(); }

function selectPPCrop(key){
  // Clicking a crop card in Season Planning opens that crop's Crop Profile (identity record),
  // not the in-plan bed-assignment popup — Season Planning's own "where is this crop planted"
  // view is still reachable by clicking a bed on the map.
  const cropId=(key||'').split('|')[0];
  ui.pMode='cropref';
  ui.crSelectedId=cropId;
  ui.ppSelectedKey=null; ui.ppSelectedBed=null; ui.ppBedModify=false; ui.ppHistoryOpen=false;
  render();
}
function selectPPBed(bedId){ ui.ppSelectedBed=bedId; ui.ppBedModify=false; ui.ppHistoryOpen=false;

  ui.ppSelectedKey = bed ? bed.cropId+'|'+(bed.wave||'') : null;

}
function clearPPSelection(){ ui.ppSelectedKey=null; ui.ppSelectedBed=null; ui.ppBedModify=false; ui.ppHistoryOpen=false; render(); }
function togglePPHistory(){ ui.ppHistoryOpen=!ui.ppHistoryOpen; render(); }

async function generatePlanReal(){
  ui.ppBusy=true; render();
  try{
    const res=await apiCall('generate-planting-plan', { year:ui.pYear, blockId:ui.pBlock });
    state.pp[ppKey(ui.pYear,ui.pBlock)]=null; await loadPlanningContext(true);
    toast((res.regeneratedOverConfirmed?'Plan regenerated (previous confirmed layout was reset to Pending). ':'Plan generated. ')+res.written+' bed(s) written.');
  }catch(err){ ui.ppBusy=false; toast(err.message||'Could not generate the plan.'); render(); }
}
async function confirmLayoutReal(){

function startBedModify(){ const ctx=ppCurrent(); const bed=ctx&&ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed); ui.ppBedDraftCrop=bed?bed.cropId:''; ui.ppBedModify=true; render(); }
function cancelBedModify(){ ui.ppBedModify=false; render(); }
async function saveBedModifyReal(){
  const ctx=ppCurrent(); const bed=ctx&&ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed);
  if(!bed) return;
  if(!ui.ppBedDraftCrop){ toast('Choose a crop.'); return; }

function ppStatusChip(status){ const s=String(status||'').toUpperCase(); return {PENDING:'chip-neutral',CONFIRMED:'chip-ok',MODIFIED:'chip-warn',MIXED:'chip-warn',EMPTY:'chip-neutral'}[s]||'chip-neutral'; }

/* ============================== BED PROFILE ARCHITECTURE ==============================
 * The Bed Profile is a stack of independently-sourced layers, read and rendered in this order:
 *   BED_MASTER (physical bed) -> calculated Availability -> BED_PLANTING_PLAN (planning) ->
 *   BLOCK_ROTATION_PLAN (rotation) -> COHORT_PRODUCTION/FIELD_LIVE_SESSION (current production) -> history.
 * A missing plan row, cohort, session or history record must never blank a layer above it -
 * only BED_MASTER itself (the physical bed) is a hard requirement to render anything at all.
 * See "Bed Profile Architecture Fix" spec, sections 1-13. */

/* Optional BED_MASTER attribute: shown only when the backend actually returned a value for it
 * ("where already defined" - section 2). Never rendered as a placeholder dash. */
function profRow(label,val){ return (val==null||val==='')? '' : `<div class="row"><span>${esc(label)}</span><span>${esc(val)}</span></div>`; }
/* Field that must always show *some* explicit state (never a bare em-dash - section 11). */
function profRowOr(label,val,fallback){ return `<div class="row"><span>${esc(label)}</span><span>${esc((val!=null&&val!=='')?val:fallback)}</span></div>`; }

const LOCATION_TYPE_LABEL = { FIELD:'Field Bed', GREENHOUSE:'Greenhouse Bed', NURSERY:'Nursery Bed', HOOPHOUSE:'Hoophouse Bed' };
const PRODUCTION_TYPE_LABEL = { FIELD:'Field', GREENHOUSE:'Greenhouse', NURSERY:'Nursery', HOOPHOUSE:'Hoophouse' };
function locationTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return LOCATION_TYPE_LABEL[k] || (lt?lt+' Bed':''); }
function productionTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return PRODUCTION_TYPE_LABEL[k] || (lt||''); }

/* Availability is calculated from the existing planning/assignment/operational data - it is never
 * inferred from "no cohort" alone (section 4). A bed with no cohort can still be Reserved (a
 * BED_PLANTING_PLAN row already exists for it) or Blocked (physical status isn't Active, or the bed
 * carries an open exception). Deliberately does NOT read COHORT_ASSIGNMENT_QUEUE/state.aq here: that
 * queue is loaded for the Daily Board's own year (ui.year), a different selector than the Season
 * Planning year (ui.pYear) this profile is showing - mixing the two produced wrong-season proposals. */
function bedAvailability(pb, cohortId, hasPlan, openExceptions){
  const ps=String(pbBedStatus(pb)||'').toUpperCase();
  if(ps && ps!=='ACTIVE') return 'BLOCKED';
  if(openExceptions && openExceptions.length) return 'BLOCKED';
  if(cohortId) return 'OCCUPIED';
  if(hasPlan) return 'RESERVED';
  return 'AVAILABLE';
}
function availabilityChip(a){ return {AVAILABLE:'chip-ok',RESERVED:'chip-warn',OCCUPIED:'chip-neutral',BLOCKED:'chip-danger'}[a]||'chip-neutral'; }

/* get-planning-context is a backend (Apps Script) response whose exact key casing for BED_MASTER
 * fields isn't visible from this file. Read each attribute defensively across the reasonable variants
 * a server could use, so a key-name mismatch never gets misread as "BED_MASTER has no value" and shown
 * as CONFIGURATION REQUIRED. This does NOT invent a value — if none of the keys are present, the field
 * genuinely wasn't returned. If Physical Status still shows CONFIGURATION REQUIRED after this, the
 * BED_MASTER.Bed_Status cell for that bed is empty at the source and needs to be filled in there. */
function pbField(pb, keys){ for(const k of keys){ if(pb && pb[k]!=null && pb[k]!=='') return pb[k]; } return ''; }
function pbBedStatus(pb){ return pbField(pb, ['bedStatus','Bed_Status','status','physicalStatus']); }
function pbZone(pb){ return pbField(pb, ['zone','Zone','irrigationZone']); }
function pbLocationType(pb){ return pbField(pb, ['locationType','Location_Type']); }
function pbBedLength(pb){ return pbField(pb, ['bedLength','Bed_Length']); }
function pbHealthStatus(pb){ return pbField(pb, ['bedHealthStatus','Bed_Health_Status','healthStatus']); }
function pbIrrigationStatus(pb){ return pbField(pb, ['bedIrrigationStatus','Bed_Irrigation_Status','irrigationStatus']); }

function ppLeftHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="empty">Loading…</div>`;
  if(ctx.error) return `<div class="empty">${esc(ctx.error)}</div>`;
  if(!ctx.plan.found) return `<div class="empty">No planting plan yet for ${esc(BLOCK_LABELS[ui.pBlock])} in ${ui.pYear}.</div>`;
  return ctx.plan.crops.map(c=>{ const key=c.cropId+'|'+(c.wave||'');
    return `<div class="card" style="${ui.ppSelectedKey===key?'outline:2px solid var(--forest);':''}" onclick="selectPPCrop('${esc(key)}')">
      <div class="row"><span><b style="color:var(--ink);">${esc(c.cropName)}</b></span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      <div class="row"><span>Beds</span><span>${c.bedCount}</span></div>
      <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
    </div>`;
  }).join('');
}

function ppLegend(){
  return legendItem('background:#D8CFAE;','Pending')+legendItem('background:#2E7D32;','Confirmed')+
    legendItem('background:repeating-linear-gradient(45deg,#8FBF8A,#8FBF8A 3px,#fff 3px,#fff 6px);','Modified')+
    legendItem('background:#EEE;border:1px solid var(--line);','Empty (no plan)');
}

function ppBedGridSVG(){
  const ctx=ppCurrent();
  if(!ctx || ctx.error || !ctx.physicalBeds.length) return `<div class="empty">${ctx&&ctx.error?esc(ctx.error):'No physical beds.'}</div>`;
  const beds=ctx.physicalBeds, byBed={}; ctx.plan.beds.forEach(b=>byBed[b.bedId]=b);
  const cols=Math.min(8,beds.length)||1, cw=70, ch=50, gap=6, rows=Math.ceil(beds.length/cols);
  let svg=`<defs><pattern id="hatchpp" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#EDE7D3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8FC9" stroke-width="3"/></pattern></defs>`;
  beds.forEach((pb,i)=>{
    const col=i%cols, row=Math.floor(i/cols), bx=10+col*(cw+gap), by=10+row*(ch+gap);
    const plan=byBed[pb.bedId];
    let fill='#EEE', tc='#1B1B18', label='';
    if(plan){
      if(plan.status==='MODIFIED'){ fill='url(#hatchpp)'; tc='#14261D'; label='MODIFIED'; }
      else if(plan.status==='CONFIRMED'){ fill='#2E7D32'; tc='#fff'; label='CONFIRMED'; }
      else { fill='#D8CFAE'; tc='#1B1B18'; label='PENDING'; }
    }
    const sel=ui.ppSelectedBed===pb.bedId;
    svg += `<g><rect class="bed" data-ppbed="${esc(pb.bedId)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}" ${sel?'stroke="var(--forest)" stroke-width="3"':''}></rect>
      <text x="${bx+6}" y="${by+13}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${esc(pb.bedId.split('-')[1]||pb.bedId)}</text>
      ${plan?`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tc}">${esc((plan.cropName||'').slice(0,10))}</text>`:`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9" fill="${tc}">Empty</text>`}
      ${label?`<text x="${bx+cw/2}" y="${by+42}" text-anchor="middle" font-size="6.5" font-weight="700" fill="${tc}" opacity=".85">${esc(label)}</text>`:''}
    </g>`;
  });
  const W=10+cols*(cw+gap), H=10+rows*(ch+gap);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

function ppRightHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="panelhead"><h2>Season Planning</h2></div><div class="panelbody"><div class="empty">Loading…</div></div>`;
  if(ctx.error) return `<div class="panelhead"><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2></div><div class="panelbody"><div class="empty">${esc(ctx.error)}</div></div>`;

  // Bed selected + modifying -> assign-crop form
  if(ui.ppSelectedBed && ui.ppBedModify){
    const bed=ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed);
    const options=(ctx.template.crops||[]).map(c=>`<option value="${esc(c.cropId)}" ${c.cropId===ui.ppBedDraftCrop?'selected':''}>${esc(c.cropName)} (${esc(c.cropId)})</option>`).join('');
    return `<div class="panelhead"><div><h2>${esc(ui.ppSelectedBed)}</h2><div class="meta">Modify Bed · exception workflow</div></div><button onclick="cancelBedModify()">✕</button></div>
    <div class="panelbody">
      <div class="note">Select an allowed crop for this physical bed. Choices are restricted to crops approved on this block's template (${esc(ctx.template.templateId||'')}) — not the full ranch crop list. To approve a crop the template doesn't include, update BLOCK_TEMPLATE and regenerate the plan instead.</div>
      <div class="field"><label>Crop</label><select onchange="ui.ppBedDraftCrop=this.value;">${options||'<option value="">No template crops available</option>'}</select></div>
      <button class="btn btn-primary" ${ui.ppBusy?'disabled':''} onclick="saveBedModifyReal()">Save</button>
      <button class="btn btn-ghost" onclick="cancelBedModify()">Cancel</button>
      <div class="note">Saving sets this bed's Layout Status to MODIFIED. The original template assignment stays in BLOCK_TEMPLATE, so it's always traceable.</div>
    </div>`;
  }

  // Bed selected, read view -> the layered Bed Profile. BED_MASTER (the physical bed) is read and
  // rendered first and unconditionally; BED_PLANTING_PLAN, rotation, current execution (COHORT_PRODUCTION /
  // FIELD_LIVE_SESSION / FIELD_ACTIVITY_LOG, already pulled into state.board / state.sessions / state.todayById
  // at login) and history are each read and rendered as their own separate layer underneath it. None of them
  // being empty ever blanks the Bed Profile itself - see the Bed Profile Architecture Fix spec.
  if(ui.ppSelectedBed){
    const bedId=ui.ppSelectedBed;
    const pb=(ctx.physicalBeds||[]).find(p=>p.bedId===bedId);          // BED_MASTER — the physical bed
    const bed=ctx.plan.beds.find(b=>b.bedId===bedId);                   // BED_PLANTING_PLAN — may legitimately be absent
    const v=bedViewById(bedId)||{ id:bedId, proposals:[] };             // COHORT_PRODUCTION (cohort board) — may legitimately be empty
    const sess=bedSessions(bedId);                                      // FIELD_LIVE_SESSION
    const hist=(v.activityLog||[]).slice(0,10);                         // historical activity
    const openExc=bedExceptions(bedId).filter(x=>x.status==='OPEN');
    const avail=bedAvailability(pb, v.cohortId, !!bed, openExc);

    if(!pb){
      // No BED_MASTER record at all for this bed ID. This is a genuine configuration problem, not an
      // empty-but-legitimate state, so it is labelled as one rather than rendered as a blank/em-dash bed.
      return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
      <div class="panelbody">
        <div class="card">
          <div class="row"><span>Bed Profile</span><span class="chip chip-danger">CONFIGURATION REQUIRED</span></div>
          <div class="row"><span>Issue</span><span>No BED_MASTER record found for ${esc(bedId)}.</span></div>
        </div>
      </div>`;
    }

    return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">

      <h2 style="font-size:13px;margin:0 0 6px;">Bed Profile</h2>
      <div class="card">
        ${profRowOr('Physical Status', pbBedStatus(pb), 'CONFIGURATION REQUIRED')}
        ${profRow('Production Type', productionTypeLabel(pbLocationType(pb)))}
        ${profRow('Location Type', locationTypeLabel(pbLocationType(pb)))}
        ${profRow('Irrigation Zone', pbZone(pb))}
        ${profRow('Bed Length', pbBedLength(pb)!==''?(pbBedLength(pb)+' ft'):'')}
        ${profRow('Bed Health Status', pbHealthStatus(pb))}
        ${profRow('Irrigation Status', pbIrrigationStatus(pb))}
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Availability</h2>
      <div class="card">
        <div class="row"><span>Status</span><span><span class="chip ${availabilityChip(avail)}">${avail}</span></span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Planning</h2>
      <div class="card">${bed ? `
        <div class="row"><span>Crop</span><span>${esc(bed.cropName||v.cropName||'Not set')}</span></div>
        <div class="row"><span>Wave</span><span>${esc(bed.wave!=null&&bed.wave!==''?bed.wave:'Not set')}</span></div>
        <div class="row"><span>Planting Date</span><span>${esc(bed.plantingDate||'Not set')}</span></div>
        <div class="row"><span>Layout Status</span><span><span class="chip ${ppStatusChip(bed.status)}">${esc(bed.status||'Not set')}</span></span></div>
      ` : `
        <div class="row"><span>Current Plan</span><span>No current plan</span></div>
      `}</div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Rotation</h2>
      <div class="card">
        <div class="row"><span>Current Family</span><span>${esc((bed&&bed.cropFamily)||ctx.rotation.cropFamily||'Not set')}</span></div>
        <div class="row"><span>Previous Year Family</span><span>${esc(ctx.rotation.previousFamily||'Not tracked')}</span></div>
        <div class="row"><span>Rotation Result</span><span>${esc(ctx.rotation.result||'Not calculated')}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Current Production</h2>
      <div class="card">
        <div class="row"><span>Current Cohort</span><span>${esc(v.cohortId||'None')}</span></div>
        <div class="row"><span>Current Stage</span><span>${v.cohortId?esc((v.currentStage||'—').replace(/_/g,' ')):'Not Started'}</span></div>
        <div class="row"><span>Worker</span><span>${sess.length?esc(sess.map(s=>s.workerName).join(', ')):'None'}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">History</h2>
      <div class="qgh" style="cursor:pointer;" onclick="togglePPHistory()"><span>${ui.ppHistoryOpen?'▾':'▸'} ${hist.length?(hist.length+' record'+(hist.length===1?'':'s')):'No history'}</span></div>
      ${ui.ppHistoryOpen?(hist.length?hist.map(r=>`<div class="row"><span>${esc(r.taskType||r.activityName||'')} · ${esc(r.workerName||r.workerId||'')}</span><span>${esc(r.endTime||'')}</span></div>`).join(''):`<div class="empty" style="padding:10px 0;">No history recorded for this bed.</div>`):''}

      <h2 style="font-size:13px;margin:14px 0 6px;">Actions</h2>
      <button class="btn btn-primary" onclick="openModal('dispatch',{bedId:'${esc(bedId)}'})">New Activity</button>
      <button class="btn btn-outline" ${sess.length?'':'disabled title="No worker currently on this bed."'} onclick="openModal('reassign',{sessionId:'${sess.length?esc(sess[0].id):''}',mode:'reassign'})">Reassign worker</button>
      <button class="btn btn-outline" ${(ui.ppBusy||!bed)?'disabled':''} ${bed?'':'title="This bed has no BED_PLANTING_PLAN row yet — generate the plan first."'} onclick="startBedModify()">Modify Bed</button>
      <div class="note">Bed Profile above comes from BED_MASTER and always renders, whether or not this bed currently has a plan, cohort, session or history.</div>
    </div>`;
  }

  // Crop selected, read view -> "where should this crop be planted"
  if(ui.ppSelectedKey){
    const c=ctx.plan.crops.find(x=>(x.cropId+'|'+(x.wave||''))===ui.ppSelectedKey);
    if(c) return `<div class="panelhead"><div><h2>${esc(c.cropName)}</h2><div class="meta">${esc(c.cropFamily||'')} · ${ui.pYear}</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">
      <div class="card">
        <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
        <div class="row"><span>Beds required</span><span>${c.bedCount}</span></div>
        <div class="row"><span>Bed range</span><span>${esc(c.bedRange)}</span></div>
        <div class="row"><span>Wave</span><span>${c.wave!=null?c.wave:'—'}</span></div>
        <div class="row"><span>Layout status</span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      </div>
      <div class="note">Click a bed on the map to view or modify it individually.</div>
    </div>`;
  }

  // Nothing selected -> block-level summary + Confirm Layout / Modify Bed as the primary Season Planning actions
  const st=ctx.status;
  const planned = st.pending + st.confirmed + st.modified;
  const allConfirmed = ctx.plan.found && st.physicalBedCount>0 && st.confirmed>=st.physicalBedCount;
  const statusLabel = !ctx.plan.found ? 'Not generated' : allConfirmed ? 'Confirmed' : (st.confirmed>0 ? 'Partially confirmed' : 'Pending Confirmation');
  const statusChip = allConfirmed?'chip-ok':(!ctx.plan.found?'chip-neutral':'chip-warn');
  return `<div class="panelhead"><div><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2><div class="meta">${ui.pYear} · ${esc(ctx.rotation.cropFamily||'No rotation set')}</div></div></div>
  <div class="panelbody">
    <div class="card">
      <div class="row"><span>Beds</span><span>${st.physicalBedCount}</span></div>
      <div class="row"><span>Planned</span><span>${planned}</span></div>
      <div class="row"><span>Empty</span><span>${st.empty}</span></div>
      <div class="row"><span>Modified</span><span>${st.modified}</span></div>
      <div class="row"><span>Confirmed</span><span>${st.confirmed}</span></div>
      <div class="row"><span>Status</span><span><span class="chip ${statusChip}">${esc(statusLabel)}</span></span></div>
    </div>
    ${!ctx.plan.found ? `
      ${ctx.generationException?`<div class="note" style="color:var(--danger);">${esc(ctx.generationException)}</div>`
        :`<div class="note">No plan generated yet. The approved template (${esc(ctx.template.templateId||'')}) will determine bed-by-bed layout — nothing to choose here.</div>`}
      <button class="btn btn-primary" ${(ui.ppBusy||ctx.generationException)?'disabled':''} onclick="generatePlanReal()">${ui.ppBusy?'Generating…':'Generate Plan'}</button>
    ` : `
      <h2 style="font-size:13px;margin:14px 0 6px;">Actions</h2>
      <button class="btn btn-primary" ${(ui.ppBusy||allConfirmed)?'disabled':''} onclick="confirmLayoutReal()">${allConfirmed?'Confirmed ✓':'Confirm Layout'}</button>
      <div class="note" style="margin-top:0;">Click a bed on the map, or a crop on the left, to open it and use Modify Bed — the exception workflow for when the standard template needs to change for one bed.</div>
      <button class="btn btn-ghost" onclick="ui.pAdvOpen=!ui.pAdvOpen;render();">${ui.pAdvOpen?'▾':'▸'} Advanced</button>
      ${ui.pAdvOpen?`<button class="btn btn-outline" ${ui.ppBusy?'disabled':''} onclick="generatePlanReal()">Regenerate from template</button>`:''}
    `}
  </div>`;
}

function legendItem(style,label){ return `<span><span class="sw" style="${style}"></span>${label}</span>`; }
function planLegend(mode){
  if(mode==='plan') return legendItem('background:#D8CFAE;','Pending')+legendItem('background:#2E7D32;','Confirmed')+legendItem('background:repeating-linear-gradient(45deg,#8FBF8A,#8FBF8A 3px,#fff 3px,#fff 6px);','Modified')+legendItem('background:#EEE;border:1px solid var(--line);','Empty');

/* ---- render: center bed map (Plan/Exec/Harvest/Cover share one 55-bed grid) ---- */
function planBedVisual(mode,crop,n){
  if(!crop) return { fill:'#EEE', tc:'#1B1B18', label:'' };
  if(mode==='plan'){
    if(crop.layoutStatus==='Modified') return { fill:'url(#hatch)', tc:'#14261D', label:'MODIFIED' };
    if(crop.layoutStatus==='Confirmed') return { fill:'#2E7D32', tc:'#fff', label:'CONFIRMED' };
    return { fill:'#D8CFAE', tc:'#1B1B18', label:'PENDING' };
  }
  if(mode==='exec'){ const planted=crop.plantedBeds.includes(n); return planted? { fill:'#2E7D32', tc:'#fff', label:'PLANTED' } : { fill:'#D8CFAE', tc:'#1B1B18', label:'ASSIGNED' }; }
  if(mode==='harvest'){
    if(crop.harvestStatus==='Complete') return { fill:'#7C8B98', tc:'#fff', label:'HARVEST COMPLETE' };
    if(crop.plantingStatus!=='Planted') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    return n%3===0? { fill:'#2E7D32', tc:'#fff', label:'HARVEST READY' } : { fill:'#8FBF8A', tc:'#1B1B18', label:'GROWING' };
  }
  if(mode==='cover'){
    if(crop.harvestStatus!=='Complete') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    const applied=state.cover[ui.pBlock]&&state.cover[ui.pBlock].status==='Applied';

    const u=demoUsers[String(p.workerId||'').toUpperCase()];
    if(!u||u.pin!==String(p.pin)) return bad('Worker ID or PIN is not correct.','AUTH_FAILED');
    if(!['Manager','Founder'].includes(u.role)) return bad('This app is for Manager and Founder accounts. Your account is set up as '+u.role+'.','ROLE_NOT_ALLOWED');
    const token='demo-'+Math.random().toString(36).slice(2);
    demoSessionsByToken[token]={ id:String(p.workerId).toUpperCase(), name:u.name, role:u.role };
    return ok({ workerId:String(p.workerId).toUpperCase(), name:u.name, role:u.role, token });
  }
  if(action==='logout'){ delete demoSessionsByToken[p.token]; return ok({loggedOut:true}); }
  const me=demoSessionsByToken[p.token];
  if(!me) return bad('Your session ended. Sign in again.','UNAUTHENTICATED');
  switch(action){
    case 'get-manager-today-view':
      return ok({ beds:demoBeds, sessions:demoSessions, exceptions:demoExceptions, harvestReady:demoHarvestReady, queueByBed:demoQueue, workers:demoWorkers });
    case 'start-session': {
      demoSessions.push({ id:'S-'+Math.floor(Math.random()*9000+1000), bedId:p.bedId, workerId:p.workerId, workerName:(demoWorkers.find(w=>w.workerId===p.workerId)||{}).name||p.workerId, activity:p.activity||'Task', status:'ACTIVE' });
      return ok({done:true});
    }
    case 'reassign-session': case 'close-and-new-session': {
      const s=demoSessions.find(x=>x.id===p.sessionId); if(!s) return bad('Session not found.','NOT_FOUND');
      s.workerId=p.toWorkerId; s.workerName=(demoWorkers.find(w=>w.workerId===p.toWorkerId)||{}).name||p.toWorkerId;
      if(action==='close-and-new-session') s.status='ACTIVE';
      return ok({done:true});
    }
    case 'resolve-exception': {
      const x=demoExceptions.find(e=>e.id===p.exceptionId); if(x) x.status='RESOLVED';
      return ok({done:true});
    }
    case 'verify-harvest-ready': {
      const i=demoHarvestReady.findIndex(h=>h.cohortId===p.cohortId); if(i>=0) demoHarvestReady.splice(i,1);
      return ok({done:true});
    }
    case 'verify-harvest-complete': {
      demoBeds.filter(b=>b.cohortId===p.cohortId).forEach(b=>b.currentStage='HARVEST_COMPLETE');
      return ok({done:true});
    }
    // ---- AssignmentEngine.gs mirrors: manager write-back actions only ----
    case 'get-cohort-board': {
      const cohorts = demoBeds.filter(b=>b.cohortId).map(b=>({ cohortId:b.cohortId, cropId:b.cohortId.slice(0,3), cropName:b.cropName, locationId:b.id,
        cohortStatus:b.cohortStatus, currentStage:b.currentStage, planningYear:p.year||new Date().getFullYear(), actualDob:b.plantingDate||'', harvestWindowStart:'', harvestWindowEnd:'' }));
      return ok({ year:p.year, beds:demoBeds.map(b=>({ bedId:b.id, blockId:b.blockId, locationType:b.locationType })), cohorts, stats:{ yearRows:cohorts.length+demoAssign.proposed.length+demoAssign.exceptions.length, unassigned:demoAssign.proposed.length+demoAssign.exceptions.length } });
    }
    case 'get-assignment-queue':
      return ok({ year:p.year, generatedDate:'demo', counts:{ rejected:demoRejected, unassigned:demoAssign.proposed.length+demoAssign.exceptions.length, proposed:demoAssign.proposed.length, exceptions:demoAssign.exceptions.length, notYetProposed:0, plantingReady:demoBeds.filter(b=>b.cohortStatus==='PRE_PLANTING').length },
        proposed:demoAssign.proposed, exceptions:demoAssign.exceptions,
        plantingReady:demoBeds.filter(b=>b.cohortStatus==='PRE_PLANTING').map(b=>({ cohortId:b.cohortId, cropName:b.cropName, waveNumber:'', locationId:b.id, plannedDob:'' })) });
    case 'generate-bed-recommendations':
      return ok({ ok:true, year:p.year, proposed:demoAssign.proposed.length, exceptions:demoAssign.exceptions.length, total:demoAssign.proposed.length+demoAssign.exceptions.length });
    case 'get-bed-candidates':
      return ok({ ok:true, cohortId:p.cohortId, recommendedBlocks:['Block 1'], locations:demoBeds.filter(b=>!b.cohortId).map(b=>({ locationId:b.id, blockId:b.blockId, outOfRule:b.blockId!=='Block 1', note:b.blockId!=='Block 1'?'Outside approved block':'Empty in this window' })) });
    case 'approve-assignment': case 'approve-assignments': {
      const ids = action==='approve-assignments' ? p.cohortIds : [p.cohortId]; let approved=0, lastBed='';
      ids.forEach(id=>{
        const list = demoAssign.proposed.some(x=>x.cohortId===id) ? demoAssign.proposed : demoAssign.exceptions, i=list.findIndex(x=>x.cohortId===id); if(i<0) return;
        const q=list[i], bed=demoBeds.find(b=>b.id===q.recommendedBed); if(!bed||bed.cohortId) return; lastBed=bed.id;
        bed.cohortId=q.cohortId; bed.cropName=q.cropName; bed.cohortStatus='PRE_PLANTING'; bed.currentStage=''; list.splice(i,1); approved++;
      });
      if(action==='approve-assignment') return approved ? ok({ cohortId:p.cohortId, locationId:lastBed }) : bad('That bed is no longer free for this cohort\'s dates. Regenerate recommendations or pick another bed.','LOCATION_OCCUPIED');
      return ok({ approved, failed:ids.length-approved, results:[] });
    }
    case 'get-eligible-locations': {
      const vacant = demoBeds.filter(b=>!b.cohortId).map(b=>({ locationId:b.id, blockId:b.blockId, locationType:b.locationType }));
      return ok({ cohortId:p.cohortId, productionPath:'FIELD', locations:vacant });
    }
    case 'change-assignment-bed': {
      const src=demoAssign.proposed.find(x=>x.cohortId===p.cohortId)||demoAssign.exceptions.find(x=>x.cohortId===p.cohortId);
      if(!src) return bad('No open recommendation for that cohort.','QUEUE_ROW_NOT_FOUND');
      const bed=demoBeds.find(b=>b.id===p.newLocationId); if(!bed) return bad('Bed not found.','LOCATION_NOT_FOUND');
      if(bed.cohortId) return bad(bed.id+' is already reserved during this cohort\'s window.','LOCATION_UNAVAILABLE');
      src.recommendedBed=bed.id; src.blockId=bed.blockId; src.status='PROPOSED'; src.exceptionType='';
      src.reasons=['✓ Location changed by manager to '+bed.id].concat(demoReasons(bed.blockId));
      const ei=demoAssign.exceptions.indexOf(src); if(ei>=0){ demoAssign.exceptions.splice(ei,1); demoAssign.proposed.push(src); }
      return ok({ cohortId:p.cohortId, recommendedBed:bed.id, status:'PROPOSED' });
    }
    case 'reject-assignment': {
      if(!String(p.reason||'').trim()) return bad('A reason is required.','REASON_REQUIRED');
      let hit=false; [demoAssign.proposed,demoAssign.exceptions].forEach(l=>{ const i=l.findIndex(x=>x.cohortId===p.cohortId); if(i>=0){ l.splice(i,1); hit=true; } });
      if(!hit) return bad('No open recommendation for that cohort.','QUEUE_ROW_NOT_FOUND');
      demoRejected++; return ok({ cohortId:p.cohortId, status:'REJECTED' });
    }
    case 'verify-planting': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      if(bed.cohortStatus!=='PRE_PLANTING') return bad('This cohort is not awaiting planting verification.','WRONG_STATUS');
      bed.cohortStatus='ACTIVE'; bed.currentStage='PRE_PLANTING'; bed.plantingDate=p.actualDob;
      return ok({done:true});
    }
    case 'move-cohort': {
      const oldBed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!oldBed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      const newBed=demoBeds.find(b=>b.id===p.newLocationId); if(!newBed) return bad('Bed not found.','LOCATION_NOT_FOUND');
      if(newBed.cohortId) return bad('That bed is already occupied.','LOCATION_OCCUPIED');
      newBed.cohortId=oldBed.cohortId; newBed.cropName=oldBed.cropName; newBed.cohortStatus=oldBed.cohortStatus; newBed.currentStage=oldBed.currentStage;
      oldBed.cohortId=''; oldBed.cropName=''; oldBed.cohortStatus=''; oldBed.currentStage='';
      return ok({done:true});
    }
    case 'complete-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='COMPLETE'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    case 'terminate-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='TERMINATED'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    default: return bad('That action is not available.','UNKNOWN_ACTION');
  }
}

/* ============================== START ============================== */
render();
</script>
