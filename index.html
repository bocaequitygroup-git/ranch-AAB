<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Assignment Board — Ngapori Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-dark:#14261D; --sand:#F5F1E6; --paper:#FFFFFF; --ink:#1B1B18; --ink-soft:#5B5A52;
  --line:#DCD5C4; --ok:#2E7D32; --warn:#C77700; --danger:#B3261E; --irrigation:#3A78C9; --musthave:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; } }
:root[data-theme="dark"]{ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; }
*{box-sizing:border-box;} html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topbar .brand{font-weight:800;font-size:15px;}
.topbar .sub{font-size:11px;color:#C9D6CD;}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 11px;border-radius:8px;}
.conn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;}
.conn[data-s=online]{background:#E4F1E5;color:var(--ok);} .conn[data-s=demo]{background:#FBEBD6;color:var(--warn);}
.conn[data-s=offline],.conn[data-s=error]{background:#F7DEDB;color:var(--danger);}
.demo-strip{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:5px 16px;text-align:center;}
.wrap{flex:1;display:flex;min-height:0;}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.toolbar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--paper);}
.toolbar select,.toolbar input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.seg{display:flex;gap:4px;background:var(--sand);padding:3px;border-radius:9px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-soft);}
.seg button.active{background:var(--forest);color:#fff;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);padding:8px 14px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mapscroll{flex:1;overflow:auto;padding:14px;}
.bed{stroke:var(--line);stroke-width:1;cursor:pointer;}
.bed:hover{stroke:var(--forest);stroke-width:2;}
.bed.selected{stroke:var(--forest);stroke-width:3;}
.badge{pointer-events:none;}
.blocklabel{font-size:9px;font-weight:800;fill:var(--ink-soft);}
.panel{width:360px;max-width:92vw;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:margin .15s;}
.panel.closed{display:none;}
.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.panelhead h2{margin:0;font-size:16px;}
.panelhead .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panelhead button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.tabs{display:flex;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:none;padding:10px 4px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--forest);border-color:var(--forest);}
.panelbody{flex:1;overflow-y:auto;padding:14px 16px;}
.card{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.row span:first-child{color:var(--ink-soft);} .row span:last-child{font-weight:700;text-align:right;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;}
.chip-ok{background:#E4F1E5;color:var(--ok);} .chip-warn{background:#FBEBD6;color:var(--warn);} .chip-danger{background:#F7DEDB;color:var(--danger);} .chip-neutral{background:var(--line);color:var(--ink-soft);}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
.btn-primary{background:var(--forest);color:#fff;} .btn-outline{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
.btn-danger{background:var(--danger);color:#fff;} .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:600;}
.empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;}
.field{margin-bottom:12px;} .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.loginwrap{max-width:380px;margin:60px auto;padding:0 16px;}
.error{background:#F7DEDB;color:var(--danger);padding:10px 13px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:420px;border-radius:14px;padding:18px;max-height:86vh;overflow-y:auto;margin:16px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;}
@media (max-width:760px){ .wrap{flex-direction:column;} .panel{width:100%;border-left:none;border-top:1px solid var(--line);max-height:60vh;} }
</style>
</head>
<body><div id="app"></div>
<script>
/* ============================== CONFIG ============================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';              // set to your Apps Script /exec URL to go live
const APP_NAME = 'ranch_aab';
const IS_DEMO = !WEB_APP_URL;
const REQUEST_TIMEOUT_MS = 20000;
const N_BLOCKS = 6, BEDS_PER_ROW = 8;   // 6 blocks laid out as grids; ~231 beds total (last block trimmed)
const TOTAL_BEDS = 231;
const CROPS = [['Lettuce','LET'],['Kale','KAL'],['Arugula','ARU'],['Radish','RAD'],['Mesclun Mix','MCH'],['Spinach','SPN']];
const STATES = ['PRE_PLANTING','GROWING','HARVEST_READY','HARVEST_COMPLETE','TERMINATED'];
const STATE_COLOR = { PRE_PLANTING:'#D8CFAE', GROWING:'#8FBF8A', HARVEST_READY:'#2E7D32', HARVEST_COMPLETE:'#7C8B98', TERMINATED:'#C9C2AE' };
const QUEUE_COLOR = { MUST_DO:'#B3261E', ATTENTION:'#C77700', ROUTINE:'#5B8FC9', NONE:'transparent' };

/* ============================== STATE ============================== */
const state = { managerId:null, name:null, role:null, token:null, beds:[], sessions:[], exceptions:[], harvestReady:[], queueByBed:{}, workers:[] };
const ui = { screen:'login', loginErr:'', overlay:'state', selectedBed:null, tab:'overview', modal:null, modalDraft:{}, toast:'' };
const $=(s,r=document)=>r.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deviceLabel=()=>String(navigator.userAgent||'unknown').slice(0,120);
function toast(msg){ ui.toast=msg; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{ui.toast='';render();},3200); }

/* ============================== API ============================== */
function apiError(message, code){ const e=new Error(message); e.code=code; e.isApiError=true; return e; }
async function apiCall(action, payload={}){
  const body=Object.assign({}, payload);
  if(state.token && body.token===undefined) body.token=state.token;
  let json;
  try{
    if(IS_DEMO){ json = await mockBackend(action, body); }
    else{
      const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), REQUEST_TIMEOUT_MS);
      let resp;
      try{ resp=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},body)),redirect:'follow',signal:ctrl.signal}); }
      finally{ clearTimeout(timer); }
      if(!resp.ok) throw apiError('The server answered with status '+resp.status+'.','HTTP');
      json = JSON.parse(await resp.text());
    }
  }catch(err){
    setConn(navigator.onLine===false?'offline':'error');
    if(err && err.isApiError) throw err;
    throw apiError('Could not reach the server.','NETWORK');
  }
  setConn(IS_DEMO?'demo':'online');
  if(json && json.ok===false){
    const e=apiError(json.error||'The request failed.', json.code||'API');
    if(state.managerId && ['UNAUTHENTICATED','ROLE_NOT_ALLOWED'].includes(String(json.code))) forceLogout(e.message);
    throw e;
  }
  return json.data!==undefined ? json.data : json;
}
function setConn(s){ const el=$('#conn'); if(!el) return; el.dataset.s=s; el.textContent={online:'Connected',demo:'Demo data',offline:'Offline',error:'Server not reachable'}[s]||s; }
function forceLogout(msg){ Object.assign(state,{managerId:null,name:null,role:null,token:null}); ui.screen='login'; ui.loginErr=msg||''; render(); }

/* ============================== AUTH ============================== */
async function doLogin(){
  const id=$('#in-id').value.trim(), pin=$('#in-pin').value.trim();
  if(!id||!pin){ ui.loginErr='Enter your worker ID and PIN.'; render(); return; }
  try{
    const res = await apiCall('login', { workerId:id, pin, app:APP_NAME, device:deviceLabel() });
    Object.assign(state, { managerId:res.workerId, name:res.name, role:res.role, token:res.token });
    ui.loginErr=''; ui.screen='board'; render();
    await loadToday();
  }catch(e){ ui.loginErr=e.message; render(); }
}
function logout(){ apiCall('logout',{}).catch(()=>{}); Object.assign(state,{managerId:null,name:null,role:null,token:null}); ui.screen='login'; ui.selectedBed=null; render(); }

/* ============================== DATA LOAD ============================== */
async function loadToday(){
  try{
    const d = await apiCall('get-manager-today-view', {});
    state.beds = d.beds||[]; state.sessions=d.sessions||[]; state.exceptions=d.exceptions||[];
    state.harvestReady=d.harvestReady||[]; state.queueByBed=d.queueByBed||{}; state.workers=d.workers||[];
    setConn(IS_DEMO?'demo':'online'); render();
  }catch(e){ toast(e.message); }
}

/* ============================== DISPATCH / TRIAGE ACTIONS ============================== */
async function startSessionFor(bedId, activity, workerId){
  try{ await apiCall('start-session', { bedId, activity, workerId }); toast('Session started.'); closeModal(); await loadToday(); }
  catch(e){ toast(e.message); }
}
async function reassignSession(sessionId, toWorkerId, note){
  try{ await apiCall('reassign-session', { sessionId, toWorkerId, note }); toast('Session reassigned.'); closeModal(); await loadToday(); }
  catch(e){ toast(e.message); }
}
async function closeAndNew(sessionId, toWorkerId, note){
  try{ await apiCall('close-and-new-session', { sessionId, toWorkerId, note }); toast('Closed and started new.'); closeModal(); await loadToday(); }
  catch(e){ toast(e.message); }
}
async function resolveException(exceptionId, notes){
  try{ await apiCall('resolve-exception', { exceptionId, notes }); toast('Exception marked resolved.'); closeModal(); await loadToday(); }
  catch(e){ toast(e.message); }
}
async function verifyHarvestReady(cohortId, bedId){
  try{ await apiCall('verify-harvest-ready', { cohortId, bedId }); toast('Harvest readiness verified.'); await loadToday(); }
  catch(e){ toast(e.message); }
}
async function verifyHarvestComplete(cohortId){
  try{ await apiCall('verify-harvest-complete', { cohortId }); toast('Cohort marked harvest complete.'); await loadToday(); }
  catch(e){ toast(e.message); }
}

/* ============================== UI HELPERS ============================== */
function selectBed(bedId){ ui.selectedBed=bedId; ui.tab='overview'; render(); }
function closePanel(){ ui.selectedBed=null; render(); }
function setOverlay(mode){ ui.overlay=mode; render(); }
function setTab(t){ ui.tab=t; render(); }
function openModal(name, draft){ ui.modal=name; ui.modalDraft=draft||{}; render(); }
function closeModal(){ ui.modal=null; ui.modalDraft={}; render(); }

function bedFill(bed){
  if(ui.overlay==='queue'){ const q=state.queueByBed[bed.id]; return QUEUE_COLOR[q||'NONE']; }
  return STATE_COLOR[bed.state] || '#EEE';
}
function bedExceptions(bedId){ return state.exceptions.filter(x=>x.bedId===bedId); }
function bedSessions(bedId){ return state.sessions.filter(x=>x.bedId===bedId && x.status!=='COMPLETED'); }

/* ============================== RENDER ============================== */
function render(){ $('#app').innerHTML = ui.screen==='login' ? loginScreen() : boardScreen(); attachMapEvents(); const idEl=$('#in-id'); if(idEl) idEl.focus(); setConn(state.managerId?(IS_DEMO?'demo':'online'):'idle'); }

function loginScreen(){
  return `<div class="loginwrap">
    <h1 style="font-size:22px;margin:40px 0 4px;">Activity Assignment Board</h1>
    <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;">Manager / Founder sign-in. Workers cannot access this board.</p>
    ${ui.loginErr?`<div class="error">${esc(ui.loginErr)}</div>`:''}
    <div class="field"><label>Worker ID</label><input id="in-id" placeholder="usr-manager1" autocomplete="off"></div>
    <div class="field"><label>PIN</label><input id="in-pin" type="password" inputmode="numeric" placeholder="••••"></div>
    <button class="btn btn-primary" onclick="doLogin()">Log in</button>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:14px;">Demo sign-ins: usr-manager1 / 1234, usr-founder1 / 1234 (PIN 1234).</p>
  </div>`;
}

function boardScreen(){
  return `
  ${IS_DEMO?`<div class="demo-strip">Demo mode with generated sample data. Set WEB_APP_URL to connect to your live backend.</div>`:''}
  <div class="topbar">
    <div><div class="brand">Activity Assignment Board</div><div class="sub">${esc(state.name||'')} · ${esc(state.role||'')}</div></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="conn" id="conn" data-s="idle"></span><button onclick="logout()">Log out</button></div>
  </div>
  <div class="wrap">
    <div class="mapcol">
      <div class="toolbar">
        <div class="seg">
          <button class="${ui.overlay==='state'?'active':''}" onclick="setOverlay('state')">Cohort state</button>
          <button class="${ui.overlay==='queue'?'active':''}" onclick="setOverlay('queue')">Queue</button>
        </div>
        <button class="btn btn-ghost" style="width:auto;margin:0;" onclick="loadToday()">↻ Refresh</button>
      </div>
      <div class="legend">${legendHTML()}</div>
      <div class="mapscroll">${mapSVG()}</div>
    </div>
    <div class="panel ${ui.selectedBed?'':'closed'}">${ui.selectedBed?panelHTML():''}</div>
  </div>
  ${ui.toast?`<div class="toast">${esc(ui.toast)}</div>`:''}
  ${modalHTML()}`;
}

function legendHTML(){
  if(ui.overlay==='queue') return Object.entries(QUEUE_COLOR).filter(([k])=>k!=='NONE').map(([k,c])=>`<span><span class="sw" style="background:${c}"></span>${k.replace('_',' ')}</span>`).join('');
  return Object.entries(STATE_COLOR).map(([k,c])=>`<span><span class="sw" style="background:${c}"></span>${k.replace(/_/g,' ')}</span>`).join('') + `<span><span class="sw" style="background:var(--danger);border-radius:50%;"></span>Exception</span><span><span class="sw" style="background:var(--ok);border-radius:50%;"></span>Harvest ready</span>`;
}

function mapSVG(){
  const cols=BEDS_PER_ROW, cell=44, gap=6, blockGap=26;
  let x=0,y=0,svg='', blockStart={};
  state.beds.forEach((b,i)=>{
    if(blockStart[b.blockId]===undefined){ blockStart[b.blockId]={row:0}; }
  });
  // layout: iterate blocks in order encountered, grid within block
  const blocks=[...new Set(state.beds.map(b=>b.blockId))];
  let curY=10;
  blocks.forEach(blk=>{
    const beds=state.beds.filter(b=>b.blockId===blk);
    const rows=Math.ceil(beds.length/cols);
    svg += `<text class="blocklabel" x="10" y="${curY-4}">${esc(blk)}</text>`;
    beds.forEach((b,idx)=>{
      const col=idx%cols, row=Math.floor(idx/cols);
      const bx=10+col*(cell+gap), by=curY+row*(cell+gap);
      const exc=bedExceptions(b.id).length, hr=state.harvestReady.some(h=>h.bedId===b.id), sess=bedSessions(b.id).length;
      svg += `<g class="badge">
        <rect class="bed ${ui.selectedBed===b.id?'selected':''}" data-bed="${esc(b.id)}" x="${bx}" y="${by}" width="${cell}" height="${cell}" rx="6" fill="${bedFill(b)}"></rect>
        <text x="${bx+cell/2}" y="${by+cell/2+3}" text-anchor="middle" font-size="8" font-weight="700" fill="#00000088" style="pointer-events:none;">${esc(b.id.split('-')[1]||b.id)}</text>
        ${sess?`<circle cx="${bx+cell-6}" cy="${by+6}" r="4" fill="#1F3A2E"></circle>`:''}
        ${exc?`<circle cx="${bx+6}" cy="${by+6}" r="4" fill="var(--danger)"></circle>`:''}
        ${hr?`<circle cx="${bx+cell/2}" cy="${by+cell-6}" r="4" fill="var(--ok)"></circle>`:''}
      </g>`;
    });
    curY += rows*(cell+gap) + blockGap;
  });
  return `<svg viewBox="0 0 ${10+cols*(cell+gap)} ${curY}" width="${10+cols*(cell+gap)}" height="${curY}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}
function attachMapEvents(){ document.querySelectorAll('[data-bed]').forEach(el=>{ el.addEventListener('click', ()=>selectBed(el.dataset.bed)); }); }

function panelHTML(){
  const b = state.beds.find(x=>x.id===ui.selectedBed); if(!b) return '';
  const sess=bedSessions(b.id), exc=bedExceptions(b.id), hr=state.harvestReady.find(h=>h.bedId===b.id);
  return `<div class="panelhead"><div><h2>${esc(b.id)}</h2><div class="meta">${esc(b.blockId)} · ${esc(b.cropName)} · ${esc(b.cohortId)}</div></div><button onclick="closePanel()">✕</button></div>
  <div class="tabs">
    <button class="${ui.tab==='overview'?'active':''}" onclick="setTab('overview')">Overview</button>
    <button class="${ui.tab==='activity'?'active':''}" onclick="setTab('activity')">Activity</button>
    <button class="${ui.tab==='exceptions'?'active':''}" onclick="setTab('exceptions')">Exceptions${exc.length?` (${exc.length})`:''}</button>
    <button class="${ui.tab==='harvest'?'active':''}" onclick="setTab('harvest')">Harvest</button>
  </div>
  <div class="panelbody">${
    ui.tab==='overview' ? overviewTab(b,sess) :
    ui.tab==='activity' ? activityTab(b) :
    ui.tab==='exceptions' ? exceptionsTab(b,exc) : harvestTab(b,hr)
  }</div>`;
}
function overviewTab(b,sess){
  return `<div class="card">
    <div class="row"><span>Crop</span><span>${esc(b.cropName)}</span></div>
    <div class="row"><span>Cohort</span><span>${esc(b.cohortId)}</span></div>
    <div class="row"><span>State</span><span><span class="chip chip-neutral">${esc((b.state||'').replace(/_/g,' '))}</span></span></div>
    <div class="row"><span>Planted</span><span>${esc(b.plantingDate||'—')}</span></div>
    <div class="row"><span>Harvest window</span><span>${esc(b.harvestWindow||'—')}</span></div>
  </div>
  <h2 style="font-size:13px;">Live sessions</h2>
  ${sess.length? sess.map(s=>`<div class="card"><div class="row"><span>${esc(s.workerName)}</span><span class="chip ${s.status==='ACTIVE'?'chip-ok':'chip-warn'}">${esc(s.status)}</span></div>
    <div class="row"><span>Task</span><span>${esc(s.activity)}</span></div>
    <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'reassign'})">Reassign</button>
    <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'close'})">Close &amp; new</button></div>`).join('')
    : `<div class="empty">No active session.</div><button class="btn btn-primary" onclick="openModal('dispatch',{bedId:'${esc(b.id)}'})">Start session on behalf of worker</button>`}`;
}
function activityTab(b){
  const rows=(b.activityLog||[]);
  return rows.length? `<div class="card">${rows.map(r=>`<div class="row"><span>${esc(r.taskType)} · ${esc(r.workerName||r.workerId)}</span><span>${esc(r.endTime||'')}</span></div>`).join('')}</div>` : `<div class="empty">No completed activity logged for this bed yet.</div>`;
}
function exceptionsTab(b,exc){
  return exc.length? exc.map(x=>`<div class="card">
    <div class="row"><span>${esc(x.type)}</span><span class="chip ${x.severity==='CRITICAL'||x.severity==='HIGH'?'chip-danger':'chip-warn'}">${esc(x.severity)}</span></div>
    <div class="row"><span>Reported</span><span>${esc(x.workerName||x.worker||'')}</span></div>
    ${x.notes?`<div class="row"><span>Notes</span><span>${esc(x.notes)}</span></div>`:''}
    ${x.status==='OPEN'?`<button class="btn btn-primary" onclick="openModal('resolve',{exceptionId:'${esc(x.id)}'})">Mark resolved</button>`:`<span class="chip chip-ok">RESOLVED</span>`}
  </div>`).join('') : `<div class="empty">No exceptions on this bed.</div>`;
}
function harvestTab(b,hr){
  if(!hr) return `<div class="empty">This bed's cohort is not flagged harvest-ready.</div>`;
  return `<div class="card">
    <div class="row"><span>Target qty</span><span>${esc(hr.targetQty||'—')}</span></div>
    <div class="row"><span>Target date</span><span>${esc(hr.targetDate||'—')}</span></div>
    <div class="row"><span>Notes</span><span>${esc(hr.notes||'—')}</span></div></div>
    <button class="btn btn-primary" onclick="verifyHarvestReady('${esc(b.cohortId)}','${esc(b.id)}')">Verify harvest ready</button>
    <button class="btn btn-outline" onclick="verifyHarvestComplete('${esc(b.cohortId)}')">Mark harvest complete</button>`;
}

function modalHTML(){
  if(!ui.modal) return '';
  let inner='';
  if(ui.modal==='dispatch') inner=dispatchModal();
  else if(ui.modal==='reassign') inner=reassignModal();
  else if(ui.modal==='resolve') inner=resolveModal();
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;
}
function dispatchModal(){
  const d=ui.modalDraft;
  return `<h2 style="font-size:15px;">Start session</h2>
  <div class="field"><label>Activity</label><input id="md-act" placeholder="e.g. Weeding" value="${esc(d.activity||'')}"></div>
  <div class="field"><label>Worker</label><select id="md-worker">${state.workers.map(w=>`<option value="${esc(w.workerId)}">${esc(w.name)}</option>`).join('')}</select></div>
  <button class="btn btn-primary" onclick="startSessionFor('${esc(d.bedId)}', document.getElementById('md-act').value, document.getElementById('md-worker').value)">Start</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function reassignModal(){
  const d=ui.modalDraft, isClose=d.mode==='close';
  return `<h2 style="font-size:15px;">${isClose?'Close & start new':'Reassign session'}</h2>
  <div class="field"><label>New worker</label><select id="md-worker">${state.workers.map(w=>`<option value="${esc(w.workerId)}">${esc(w.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Note (optional)</label><textarea id="md-note" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;"></textarea></div>
  <button class="btn ${isClose?'btn-danger':'btn-primary'}" onclick="${isClose?'closeAndNew':'reassignSession'}('${esc(d.sessionId)}', document.getElementById('md-worker').value, document.getElementById('md-note').value)">${isClose?'Close & start new':'Reassign'}</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}
function resolveModal(){
  const d=ui.modalDraft;
  return `<h2 style="font-size:15px;">Resolve exception</h2>
  <div class="field"><label>Resolution notes</label><textarea id="md-rnote" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;"></textarea></div>
  <button class="btn btn-primary" onclick="resolveException('${esc(d.exceptionId)}', document.getElementById('md-rnote').value)">Mark resolved</button>
  <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>`;
}

/* ============================== DEMO BACKEND (only used when WEB_APP_URL is empty) ============================== */
const demoUsers = { 'USR-MANAGER1':{pin:'1234',name:'Maya Ortiz',role:'Manager'}, 'USR-FOUNDER1':{pin:'1234',name:'Sam Reyes',role:'Founder'}, 'USR-WORKER1':{pin:'1234',name:'Jo Lindqvist',role:'Worker'} };
const demoWorkers = [{workerId:'W01',name:'Ana Prieto'},{workerId:'W02',name:'Ben Okafor'},{workerId:'W03',name:'Chloe Weber'},{workerId:'W07',name:'Jo Lindqvist'}];
function seedRand(seed){ return function(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; }
function buildDemoBeds(){
  const rnd=seedRand(42), beds=[]; let n=0;
  for(let blk=1; blk<=N_BLOCKS && n<TOTAL_BEDS; blk++){
    const countThisBlock = Math.min(BEDS_PER_ROW*7, TOTAL_BEDS-n, 40);
    for(let i=1;i<=countThisBlock && n<TOTAL_BEDS;i++,n++){
      const crop=CROPS[Math.floor(rnd()*CROPS.length)], state_=STATES[Math.floor(rnd()*rnd()*STATES.length)];
      beds.push({ id:`B${blk}-${String(i).padStart(2,'0')}`, blockId:'Block '+blk, cropName:crop[0], cohortId:crop[1]+'-C0'+((n%4)+1),
        state:state_, plantingDate:'', harvestWindow:'', activityLog:[] });
    }
  }
  return beds;
}
const demoBeds = buildDemoBeds();
const demoSessions = [
  { id:'S-1041', bedId:demoBeds[3].id, workerId:'W01', workerName:'Ana Prieto', activity:'Weeding', status:'ACTIVE' },
  { id:'S-1042', bedId:demoBeds[10].id, workerId:'W02', workerName:'Ben Okafor', activity:'Transplanting', status:'PAUSED' }
];
const demoExceptions = [
  { id:'EXC-0012', bedId:demoBeds[3].id, type:'PestPressure', severity:'HIGH', worker:'Ana Prieto', workerName:'Ana Prieto', notes:'Aphids on outer leaves', status:'OPEN' },
  { id:'EXC-0013', bedId:demoBeds[10].id, type:'PlantCondition', severity:'CRITICAL', worker:'Ben Okafor', workerName:'Ben Okafor', notes:'Wilting after transplant', status:'OPEN' }
];
const hrBeds = demoBeds.filter(b=>b.state==='HARVEST_READY').slice(0,5);
const demoHarvestReady = hrBeds.map(b=>({ bedId:b.id, cohortId:b.cohortId, targetQty:'25 kg', targetDate:'in 3 days', notes:'' }));
const demoQueue = {}; demoBeds.forEach((b,i)=>{ demoQueue[b.id] = i%11===0?'MUST_DO': i%7===0?'ATTENTION': i%3===0?'ROUTINE':'NONE'; });
const demoSessionsByToken = {};
async function mockBackend(action, p){
  await new Promise(r=>setTimeout(r,150));
  const ok=data=>({ok:true,data}), bad=(error,code)=>({ok:false,error,code});
  if(action==='login'){
    const u=demoUsers[String(p.workerId||'').toUpperCase()];
    if(!u||u.pin!==String(p.pin)) return bad('Worker ID or PIN is not correct.','AUTH_FAILED');
    if(!['Manager','Founder'].includes(u.role)) return bad('This app is for Manager and Founder accounts. Your account is set up as '+u.role+'.','ROLE_NOT_ALLOWED');
    const token='demo-'+Math.random().toString(36).slice(2);
    demoSessionsByToken[token]={ id:String(p.workerId).toUpperCase(), name:u.name, role:u.role };
    return ok({ workerId:String(p.workerId).toUpperCase(), name:u.name, role:u.role, token });
  }
  if(action==='logout'){ delete demoSessionsByToken[p.token]; return ok({loggedOut:true}); }
  const me=demoSessionsByToken[p.token];
  if(!me) return bad('Your session ended. Sign in again.','UNAUTHENTICATED');
  switch(action){
    case 'get-manager-today-view':
      return ok({ beds:demoBeds, sessions:demoSessions, exceptions:demoExceptions, harvestReady:demoHarvestReady, queueByBed:demoQueue, workers:demoWorkers });
    case 'start-session': {
      demoSessions.push({ id:'S-'+Math.floor(Math.random()*9000+1000), bedId:p.bedId, workerId:p.workerId, workerName:(demoWorkers.find(w=>w.workerId===p.workerId)||{}).name||p.workerId, activity:p.activity||'Task', status:'ACTIVE' });
      return ok({done:true});
    }
    case 'reassign-session': case 'close-and-new-session': {
      const s=demoSessions.find(x=>x.id===p.sessionId); if(!s) return bad('Session not found.','NOT_FOUND');
      s.workerId=p.toWorkerId; s.workerName=(demoWorkers.find(w=>w.workerId===p.toWorkerId)||{}).name||p.toWorkerId;
      if(action==='close-and-new-session') s.status='ACTIVE';
      return ok({done:true});
    }
    case 'resolve-exception': {
      const x=demoExceptions.find(e=>e.id===p.exceptionId); if(x) x.status='RESOLVED';
      return ok({done:true});
    }
    case 'verify-harvest-ready': {
      const i=demoHarvestReady.findIndex(h=>h.cohortId===p.cohortId); if(i>=0) demoHarvestReady.splice(i,1);
      return ok({done:true});
    }
    case 'verify-harvest-complete': {
      demoBeds.filter(b=>b.cohortId===p.cohortId).forEach(b=>b.state='HARVEST_COMPLETE');
      return ok({done:true});
    }
    default: return bad('That action is not available.','UNKNOWN_ACTION');
  }
}
