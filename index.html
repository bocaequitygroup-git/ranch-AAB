<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngapori Ranch - SOP-Aligned AAB Dispatch Board</title>
    <style>
        :root {
            --bg-dark: #0f1416;
            --panel-bg: #1a2327;
            --border-color: #2c3b41;
            --text-main: #eceff1;
            --text-muted: #78909c;
            --status-red: #e53935;
            --status-orange: #fb8c00;
            --status-purple: #8e24aa;
            --status-green: #43a047;
            --status-gray: #37474f;
        }

        body { background: var(--bg-dark); color: var(--text-main); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .canvas-container { padding: 20px; display: flex; justify-content: center; overflow-x: auto; }
        
        /* SVG Spatial Styles */
        svg { background: #12181a; border: 1px solid var(--border-color); border-radius: 8px; }
        .block-bg { fill: var(--panel-bg); stroke: var(--border-color); stroke-width: 1; }
        .block-label { fill: var(--text-muted); font-size: 11px; font-weight: bold; font-family: monospace; }
        
        .bed-unit { cursor: pointer; transition: transform 0.1s ease; }
        .bed-unit:hover { transform: scale(1.1); }
        .bed-rect { fill: #0f1416; stroke-width: 2; rx: 3; }
        .bed-text { fill: var(--text-main); font-size: 9px; font-weight: bold; text-anchor: middle; font-family: monospace; }
        
        .status-green { stroke: var(--status-green); }
        .status-red { stroke: var(--status-red); }
        .status-orange { stroke: var(--status-orange); }
        .status-purple { stroke: var(--status-purple); }
        .status-gray { stroke: var(--status-gray); opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="font-size: 16px; margin: 0;">NGAPORI RANCH AAB — MASTER DISPATCH BOARD</h1>
            <span style="font-size: 11px; color: var(--text-muted);">SOP Alignment: 231 Active Field Units (220 Annual Beds + 11 Perennial Rows)</span>
        </div>
        <div style="font-size: 12px; font-weight: bold;">UNASSIGNED TASKS: <span style="color: #ffd54f;">6</span></div>
    </header>

    <div class="canvas-container">
        <!-- Interactive 231 Spatial Canvas -->
        <svg id="aab-canvas" width="1000" height="640" viewBox="0 0 1000 640">
            <!-- Block Headers & Outlines -->
            <g id="blocks-layer">
                <rect x="20" y="40" width="180" height="580" class="block-bg" />
                <text x="30" y="30" class="block-label">BLOCK 1: SOLANACEAE (55)</text>

                <rect x="210" y="40" width="180" height="580" class="block-bg" />
                <text x="220" y="30" class="block-label">BLOCK 2: FAST GREENS (55)</text>

                <rect x="400" y="40" width="180" height="580" class="block-bg" />
                <text x="410" y="30" class="block-label">BLOCK 3: BRASSICAS (55)</text>

                <rect x="590" y="40" width="180" height="580" class="block-bg" />
                <text x="600" y="30" class="block-label">BLOCK 4: ROOTS/STAPLES (55)</text>

                <rect x="780" y="40" width="190" height="280" class="block-bg" />
                <text x="790" y="30" class="block-label">ZONE 5: PERENNIAL (11)</text>
            </g>

            <!-- Dynamic Bed Layer -->
            <g id="beds-layer"></g>
        </svg>
    </div>

    <script>
        const bedsLayer = document.getElementById('beds-layer');

        const blockConfigs = [
            { prefix: 'B1', startX: 30 },
            { prefix: 'B2', startX: 220 },
            { prefix: 'B3', startX: 410 },
            { prefix: 'B4', startX: 600 }
        ];

        // Render Annual Blocks 1-4 (55 beds each = 220 beds)
        blockConfigs.forEach(block => {
            for (let i = 1; i <= 55; i++) {
                const col = (i - 1) % 5;
                const row = Math.floor((i - 1) / 5);
                
                const x = block.startX + (col * 32);
                const y = 50 + (row * 50);
                
                let statusClass = 'status-green';
                if (i % 7 === 0) statusClass = 'status-red';
                else if (i % 3 === 0) statusClass = 'status-orange';
                else if (i % 11 === 0) statusClass = 'status-purple';

                renderBed(x, y, `${block.prefix}-${i.toString().padStart(2, '0')}`, i, statusClass, 30, 44);
            }
        });

        // Render Zone 5 (11 Perennial Rows)
        for (let i = 1; i <= 11; i++) {
            const col = (i - 1) % 2;
            const row = Math.floor((i - 1) / 2);
            
            const x = 790 + (col * 90);
            const y = 50 + (row * 46);
            
            renderBed(x, y, `Z5-${i.toString().padStart(2, '0')}`, `Z5-${i}`, 'status-green', 80, 36);
        }

        function renderBed(x, y, bedId, label, statusClass, width, height) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'bed-unit');
            g.setAttribute('transform', `translate(${x}, ${y})`);
            
            g.innerHTML = `
                <rect class="bed-rect ${statusClass}" width="${width}" height="${height}" x="0" y="0"></rect>
                <text class="bed-text" x="${width / 2}" y="${height / 2 + 3}">${label}</text>
            `;
            
            g.onclick = () => alert(`Selected Unit: ${bedId}`);
            bedsLayer.appendChild(g);
        }
    </script>
</body>
</html>
