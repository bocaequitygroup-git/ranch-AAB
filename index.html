<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngapori Ranch - SOP-Aligned AAB Dispatch Board</title>
    <style>
        :root {
            --bg-dark: #0f1416;
            --panel-bg: #1a2327;
            --border-color: #2c3b41;
            --text-main: #eceff1;
            --text-muted: #78909c;
            --status-red: #e53935;
            --status-orange: #fb8c00;
            --status-purple: #8e24aa;
            --status-green: #43a047;
            --status-gray: #37474f;
        }

        body { background: var(--bg-dark); color: var(--text-main); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: flex; gap: 12px; padding: 16px; overflow-x: auto; }
        .block-column { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; width: 220px; }
        .block-title { font-size: 13px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .bed-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .bed-cell { width: 36px; height: 36px; border-radius: 4px; border: 2px solid var(--status-green); background: #12181a; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; }
        .bed-cell.red { border-color: var(--status-red); }
        .bed-cell.orange { border-color: var(--status-orange); }
        .bed-cell.purple { border-color: var(--status-purple); }
        .bed-cell.gray { border-color: var(--status-gray); opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="font-size: 16px; margin: 0;">NGAPORI RANCH AAB — MASTER DISPATCH BOARD</h1>
            <span style="font-size: 11px; color: var(--text-muted);">SOP Alignment: 231 Active Field Units (220 Annual Beds + 11 Perennial Rows)</span>
        </div>
        <div style="font-size: 12px; font-weight: bold;">UNASSIGNED TASKS: <span style="color: #ffd54f;">6</span></div>
    </header>

    <div class="grid-container">
        <!-- Block 1: 55 Beds -->
        <div class="block-column">
            <div class="block-title">Block 1: Solanaceae (55)</div>
            <div class="bed-grid" id="block-1-grid"></div>
        </div>

        <!-- Block 2: 55 Beds -->
        <div class="block-column">
            <div class="block-title">Block 2: Fast Greens (55)</div>
            <div class="bed-grid" id="block-2-grid"></div>
        </div>

        <!-- Block 3: 55 Beds -->
        <div class="block-column">
            <div class="block-title">Block 3: Heavy Brassicas (55)</div>
            <div class="bed-grid" id="block-3-grid"></div>
        </div>

        <!-- Block 4: 55 Beds -->
        <div class="block-column">
            <div class="block-title">Block 4: Roots & Staples (55)</div>
            <div class="bed-grid" id="block-4-grid"></div>
        </div>

        <!-- Zone 5: 11 Rows -->
        <div class="block-column" style="width: 140px;">
            <div class="block-title">Zone 5: Perennial (11)</div>
            <div class="bed-grid" style="grid-template-columns: repeat(2, 1fr);" id="zone-5-grid"></div>
        </div>
    </div>

    <script>
        // Generate SOP-aligned bed elements dynamically
        function renderBlock(elementId, prefix, count) {
            const container = document.getElementById(elementId);
            for (let i = 1; i <= count; i++) {
                const bed = document.createElement('div');
                const bedId = `${prefix}-${i.toString().padStart(2, '0')}`;
                bed.className = 'bed-cell';
                
                // Sample SOP status allocations
                if (i % 7 === 0) bed.classList.add('red');
                else if (i % 3 === 0) bed.classList.add('orange');
                else if (i % 11 === 0) bed.classList.add('purple');

                bed.innerText = i;
                bed.title = `Bed ${bedId}`;
                container.appendChild(bed);
            }
        }

        renderBlock('block-1-grid', 'B1', 55);
        renderBlock('block-2-grid', 'B2', 55);
        renderBlock('block-3-grid', 'B3', 55);
        renderBlock('block-4-grid', 'B4', 55);
        renderBlock('zone-5-grid', 'Z5', 11);
    </script>
</body>
</html>
