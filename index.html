/* ---- Planting Plan actions ---- */
function confirmLayout(cropId){ const c=cropById(cropId); if(!c) return; c.layoutStatus='Confirmed'; toast(c.cropName+' layout confirmed and locked.'); render(); }
function startModify(cropId){ const c=cropById(cropId); if(!c) return; ui.pModifying=true; ui.pSelBeds=c.bedNums.slice(); render(); }
function toggleModifyBed(n){ if(!ui.pModifying) return; const i=ui.pSelBeds.indexOf(n); if(i>=0) ui.pSelBeds.splice(i,1); else ui.pSelBeds.push(n); render(); }
function cancelModify(){ ui.pModifying=false; render(); }
function saveModifyLayout(cropId){
  const plan=getPlan(ui.pBlock,ui.pYear), c=plan.crops.find(x=>x.id===cropId); if(!c) return;
  const taken=new Set(); plan.crops.forEach(x=>{ if(x.id!==cropId) x.bedNums.forEach(n=>taken.add(n)); });
  const clash=ui.pSelBeds.filter(n=>taken.has(n));
  if(clash.length){ toast('Beds already assigned to another crop: '+clash.join(', ')); return; }
  if(!ui.pSelBeds.length){ toast('Select at least one bed.'); return; }
  c.bedNums=ui.pSelBeds.slice().sort((a,b)=>a-b); c.layoutStatus='Modified'; ui.pModifying=false;
  toast(c.cropName+' layout modified.'); render();
}
function resetPlan(cropId){
  if(!confirm('Reset the planting plan for this crop? This clears its bed assignments.')) return;
  const c=cropById(cropId); if(!c) return;
  c.bedNums=[]; c.layoutStatus='Pending'; c.plantingStatus='Not planted'; c.plantedBeds=[];
  toast(c.cropName+' planting plan reset.'); render();
}
/* ---- Planting Execution actions ---- */
function markCropPlanted(cropId){ const c=cropById(cropId); if(!c) return; c.plantingStatus='Planted'; c.plantedBeds=c.bedNums.slice(); toast('All cohorts for '+c.cropName+' marked PLANTED.'); render(); }
function markBedPlanted(cropId,bedNum){
  const c=cropById(cropId); if(!c) return;
  if(!c.plantedBeds.includes(bedNum)) c.plantedBeds.push(bedNum);
  c.plantingStatus = c.plantedBeds.length>=c.bedNums.length ? 'Planted' : 'In progress';
  render();
}
/* ---- Harvest actions ---- */
function markHarvestComplete(cropId){ const c=cropById(cropId); if(!c) return; c.harvestStatus='Complete'; toast(c.cropName+' cohorts set to HARVEST_COMPLETE.'); render(); }
/* ---- Cover Crop actions ---- */
function applyCoverCrop(block){
  const mix=($('#cc-mix')||{}).value||'Clover';
  state.cover[block]={ status:'Applied', mix };
  toast('Cover crop ('+mix+') applied to '+block+'. Block closed for season.'); render();
}
/* ---- Rotation actions ---- */
function openEditRotation(){ ui.pRotDraft={}; PLAN_BLOCKS.filter(b=>b!=='Z5').forEach(b=>{ ui.pRotDraft[b]=rotationFamily(b,ui.pYear); }); ui.pEditingRotation=true; render(); }
function setRotDraft(block,fam){ ui.pRotDraft[block]=fam; }
function saveRotationDraft(){ rotationOverrides[ui.pYear]=Object.assign({},ui.pRotDraft); rotationStatusByYear[ui.pYear]='Draft'; ui.pEditingRotation=false; toast('Rotation for '+ui.pYear+' saved as draft.'); render(); }
function cancelEditRotation(){ ui.pEditingRotation=false; render(); }
function approveRotation(){
  if(!confirm('Approve the '+ui.pYear+' rotation plan? This locks BLOCK_ROTATION_PLAN and generates BED_PLANTING_PLAN for every block.')) return;
  rotationStatusByYear[ui.pYear]='Approved';
  PLAN_BLOCKS.filter(b=>b!=='Z5').forEach(b=>{ delete planningPlans[planKey(b,ui.pYear)]; getPlan(b,ui.pYear); });
  toast(ui.pYear+' rotation approved. Planting plans generated for all blocks.'); render();
}

/* ============================== REAL Planting Plan mode (BED_PLANTING_PLAN via PlantingPlanAPI.gs) ==============================
 * This replaces the mock buildPlan()/getPlan() data path ONLY for pMode==='plan'. Execution/Harvest/Cover/Rotation
 * modes above are unchanged and still run on client-side mock data — wire those to their own backend actions later.
 * Flow: display -> manager interaction -> send action -> refresh. No recommendation/assignment logic lives here;
 * the backend (approved BLOCK_TEMPLATE / BLOCK_ROTATION_PLAN) is the only source of what should be planted where. */
function ppKey(year,block){ return year+'|'+block; }
function ppCurrent(){ return state.pp[ppKey(ui.pYear,ui.pBlock)]; }
async function loadPlanningContext(force){
  const key=ppKey(ui.pYear,ui.pBlock);
  if(state.pp[key] && !force) return;
  ui.ppBusy=true; render();
  try{
    const data=await apiCall('get-planning-context', { year:ui.pYear, blockId:ui.pBlock });
    state.pp[key]=data;
  }catch(err){
    state.pp[key]={ error:err.message||'Could not load the planning context.' };
  }
  ui.ppBusy=false; render();
}
function ensurePlanLoaded(){ if(!state.pp[ppKey(ui.pYear,ui.pBlock)] && !ui.ppBusy) loadPlanningContext(); }

function selectPPCrop(key){
  // Clicking a crop card in Season Planning opens that crop's Crop Profile (identity record),
  // not the in-plan bed-assignment popup — Season Planning's own "where is this crop planted"
  // view is still reachable by clicking a bed on the map.
  const cropId=(key||'').split('|')[0];
  ui.pMode='cropref';
  ui.crSelectedId=cropId;
  ui.ppSelectedKey=null; ui.ppSelectedBed=null; ui.ppBedModify=false; ui.ppHistoryOpen=false;
  render();
}
function selectPPBed(bedId){ ui.ppSelectedBed=bedId; ui.ppBedModify=false; ui.ppHistoryOpen=false;
  const ctx=ppCurrent(); const bed=ctx&&ctx.plan.beds.find(b=>b.bedId===bedId);
  ui.ppSelectedKey = bed ? bed.cropId+'|'+(bed.wave||'') : null;
  render();
}
function clearPPSelection(){ ui.ppSelectedKey=null; ui.ppSelectedBed=null; ui.ppBedModify=false; ui.ppHistoryOpen=false; render(); }
function togglePPHistory(){ ui.ppHistoryOpen=!ui.ppHistoryOpen; render(); }

async function generatePlanReal(){
  ui.ppBusy=true; render();
  try{
    const res=await apiCall('generate-planting-plan', { year:ui.pYear, blockId:ui.pBlock });
    state.pp[ppKey(ui.pYear,ui.pBlock)]=null; await loadPlanningContext(true);
    toast((res.regeneratedOverConfirmed?'Plan regenerated (previous confirmed layout was reset to Pending). ':'Plan generated. ')+res.written+' bed(s) written.');
  }catch(err){ ui.ppBusy=false; toast(err.message||'Could not generate the plan.'); render(); }
}
async function confirmLayoutReal(){
  if(!confirm('Confirm the planting layout for '+esc(BLOCK_LABELS[ui.pBlock])+' '+ui.pYear+'? This locks BED_PLANTING_PLAN for this block.')) return;
  ui.ppBusy=true; render();
  try{
    await apiCall('confirm-layout', { year:ui.pYear, blockId:ui.pBlock });
    await loadPlanningContext(true);
    toast('Layout confirmed for '+BLOCK_LABELS[ui.pBlock]+'.');
  }catch(err){ ui.ppBusy=false; toast(err.message||'Could not confirm the layout.'); render(); }
}
function startBedModify(){ const ctx=ppCurrent(); const bed=ctx&&ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed); ui.ppBedDraftCrop=bed?bed.cropId:''; ui.ppBedModify=true; render(); }
function cancelBedModify(){ ui.ppBedModify=false; render(); }
async function saveBedModifyReal(){
  const ctx=ppCurrent(); const bed=ctx&&ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed);
  if(!bed) return;
  if(!ui.ppBedDraftCrop){ toast('Choose a crop.'); return; }
  ui.ppBusy=true; render();
  try{
    await apiCall('modify-bed', { planId:bed.planId, changes:{ cropId:ui.ppBedDraftCrop } });
    await loadPlanningContext(true);
    ui.ppBedModify=false;
    toast(bed.bedId+' reassigned. Marked Modified.');
  }catch(err){ ui.ppBusy=false; toast(err.message||'Could not modify that bed.'); render(); }
}

function ppStatusChip(status){ const s=String(status||'').toUpperCase(); return {PENDING:'chip-neutral',CONFIRMED:'chip-ok',MODIFIED:'chip-warn',MIXED:'chip-warn',EMPTY:'chip-neutral'}[s]||'chip-neutral'; }

/* ============================== BED PROFILE ARCHITECTURE ==============================
 * The Bed Profile is a stack of independently-sourced layers, read and rendered in this order:
 *   BED_MASTER (physical bed) -> calculated Availability -> BED_PLANTING_PLAN (planning) ->
 *   BLOCK_ROTATION_PLAN (rotation) -> COHORT_PRODUCTION/FIELD_LIVE_SESSION (current production) -> history.
 * A missing plan row, cohort, session or history record must never blank a layer above it -
 * only BED_MASTER itself (the physical bed) is a hard requirement to render anything at all.
 * See "Bed Profile Architecture Fix" spec, sections 1-13. */

/* Optional BED_MASTER attribute: shown only when the backend actually returned a value for it
 * ("where already defined" - section 2). Never rendered as a placeholder dash. */
function profRow(label,val){ return (val==null||val==='')? '' : `<div class="row"><span>${esc(label)}</span><span>${esc(val)}</span></div>`; }
/* Field that must always show *some* explicit state (never a bare em-dash - section 11). */
function profRowOr(label,val,fallback){ return `<div class="row"><span>${esc(label)}</span><span>${esc((val!=null&&val!=='')?val:fallback)}</span></div>`; }

const LOCATION_TYPE_LABEL = { FIELD:'Field Bed', GREENHOUSE:'Greenhouse Bed', NURSERY:'Nursery Bed', HOOPHOUSE:'Hoophouse Bed' };
const PRODUCTION_TYPE_LABEL = { FIELD:'Field', GREENHOUSE:'Greenhouse', NURSERY:'Nursery', HOOPHOUSE:'Hoophouse' };
function locationTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return LOCATION_TYPE_LABEL[k] || (lt?lt+' Bed':''); }
function productionTypeLabel(lt){ const k=String(lt||'').toUpperCase(); return PRODUCTION_TYPE_LABEL[k] || (lt||''); }

/* Availability is BED_MASTER.Bed_Status (BED_STATUS_RULES), never inferred from planning data. A
 * BED_PLANTING_PLAN row (even CONFIRMED) does not make a bed Reserved: RESERVED requires the manager to
 * confirm a specific cohort-to-bed assignment (R02). Blocked is the only override (non-Active physical
 * status or an open exception). "No cohort" alone falls back to OCCUPIED/AVAILABLE only when Bed_Status
 * is blank. Deliberately does NOT read COHORT_ASSIGNMENT_QUEUE/state.aq here: that queue is loaded for
 * the Daily Board's own year (ui.year), a different selector than the Season Planning year (ui.pYear)
 * this profile is showing - mixing the two produced wrong-season proposals. */
function bedAvailability(pb, cohortId, hasPlan, openExceptions, bedStatus){
  const ps=String(pbBedStatus(pb)||'').toUpperCase();
  if(ps==='BLOCKED') return 'BLOCKED';   /* was: any status other than 'ACTIVE' -> BLOCKED, which mislabelled every POST-HARVEST / AVAILABLE / RESERVED bed */
  if(openExceptions && openExceptions.length) return 'BLOCKED';
  /* BED_MASTER.Bed_Status is the single source of truth (BED_STATUS_RULES). A confirmed plan is NOT a
   * physical state: "Planning never changes physical bed status" (Key Principle 1), so hasPlan is ignored. */
  const bs=String(bedStatus||ps||'').trim().toUpperCase();
  if(bs) return bs;
  return cohortId?'OCCUPIED':'UNVERIFIED';   /* blank Bed_Status = never verified, not available */
}
/* Planning display gate. A confirmed plan row is only STAGED until BOTH gates are passed: (1) the bed is physically released
 * (manager Verify Bed Ready -> AVAILABLE) and (2) the manager approves the cohort-to-bed assignment (-> RESERVED). Display
 * only: it reads the same calculated availability the profile already shows and never writes or infers bed status. */
function planStage(avail, cohortId){
  const a=String(avail||'').toUpperCase();
  if(cohortId || a==='RESERVED' || a==='PLANTED' || a==='GROWING' || a==='HARVEST READY' || a==='HARVESTING' || a==='OCCUPIED') return { staged:false, waiting:'' };
  if(a==='UNVERIFIED') return { staged:true, waiting:'Awaiting bed verification', banner:'This bed has not been verified physically ready. The manager must verify it before this plan can move forward.' };
  if(a==='POST-HARVEST ACTIVITIES') return { staged:true, waiting:'Awaiting post-harvest completion and bed verification', banner:'Post-harvest work must be completed and the bed verified by a manager before this plan can move forward.' };
  if(a==='BLOCKED') return { staged:true, waiting:'Bed is blocked', banner:'This bed is blocked. The block must be cleared and the bed verified before this plan can move forward.' };
  return { staged:true, waiting:'Awaiting manager approval of the cohort assignment', banner:'The bed is available. This plan starts only after the manager approves the cohort assignment (see the assignment queue).' };
}
function availabilityLabel(a){ return a==='UNVERIFIED'?'NOT VERIFIED':a; }
function availabilityChip(a){ return {UNVERIFIED:'chip-warn',AVAILABLE:'chip-ok',RESERVED:'chip-warn','POST-HARVEST ACTIVITIES':'chip-warn',OCCUPIED:'chip-neutral',BLOCKED:'chip-danger'}[a]||'chip-neutral'; }

/* get-planning-context is a backend (Apps Script) response whose exact key casing for BED_MASTER
 * fields isn't visible from this file. Read each attribute defensively across the reasonable variants
 * a server could use, so a key-name mismatch never gets misread as "BED_MASTER has no value" and shown
 * as CONFIGURATION REQUIRED. This does NOT invent a value — if none of the keys are present, the field
 * genuinely wasn't returned. If Physical Status still shows CONFIGURATION REQUIRED after this, the
 * BED_MASTER.Bed_Status cell for that bed is empty at the source and needs to be filled in there. */
function pbField(pb, keys){ for(const k of keys){ if(pb && pb[k]!=null && pb[k]!=='') return pb[k]; } return ''; }
function pbBedStatus(pb){ return pbField(pb, ['bedStatus','Bed_Status','status','physicalStatus']); }
function pbZone(pb){ return pbField(pb, ['zone','Zone','irrigationZone']); }
function pbLocationType(pb){ return pbField(pb, ['locationType','Location_Type']); }
function pbBedLength(pb){ return pbField(pb, ['bedLength','Bed_Length']); }
function pbHealthStatus(pb){ return pbField(pb, ['bedHealthStatus','Bed_Health_Status','healthStatus']); }
function pbIrrigationStatus(pb){ return pbField(pb, ['bedIrrigationStatus','Bed_Irrigation_Status','irrigationStatus']); }

/* MASTER WAVE COLORS (Season Planning). Wave n = the n-th distinct planting date of that crop in the year (derived by
 * the backend, PlantingPlanAPI.gs). OPEN / no plan / no planting date = no fill. Status (Pending / Confirmed / Modified) is
 * shown by opacity, outline and the tile label, never by hue, so a wave keeps one color. */
const WAVE_COLORS={1:'#66BB6A',2:'#FDD835',3:'#64B5F6',4:'#B39DDB',5:'#FFA726',6:'#26C6DA',7:'#EC407A',8:'#A1887F',9:'#5C6BC0',10:'#26A69A'};
const NOT_IN_MASTER_COLOR='#B0BEC5';   /* dated bed whose date matches no PRODUCTION_WAVE_PLAN wave of its crop: flagged, never renumbered */
function waveName(w){ return 'Wave '+w; }
function waveColor(w){ w=Number(w); return w>0 ? (WAVE_COLORS[w]||NOT_IN_MASTER_COLOR) : ''; }
function notInMaster(p){ return !!p && p.waveStatus==='NOT_IN_MASTER'; }
function isOpenPlan(p){ if(!p || !p.cropId || String(p.cropId).toUpperCase()==='OPEN') return true; return !(Number(p.wave)>0) && !notInMaster(p); }
function planFill(p){ return notInMaster(p) ? NOT_IN_MASTER_COLOR : waveColor(p.wave); }
function waveTag(p){ return notInMaster(p) ? 'W?' : 'W'+p.wave; }

function ppLeftHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="empty">Loading…</div>`;
  if(ctx.error) return `<div class="empty">${esc(ctx.error)}</div>`;
  if(!ctx.plan.found) return `<div class="empty">No planting plan yet for ${esc(BLOCK_LABELS[ui.pBlock])} in ${ui.pYear}.</div>`;
  return ctx.plan.crops.map(c=>{ const key=c.cropId+'|'+(c.wave||'');
    const wc=isOpenPlan(c)?'':planFill(c);
    const gap=c.bedCount===0;   /* master wave with no beds in this block yet */
    const edge=wc?`border-left:7px solid ${wc};background:linear-gradient(90deg,${wc}33,transparent 55%),var(--sand);${gap?'border-style:dashed;border-left-style:solid;opacity:.7;':''}`:'background:transparent;border-style:dashed;';
    const tag=notInMaster(c)?'Not in master plan':waveName(c.wave)+(c.masterWaveCount?' of '+c.masterWaveCount:'');
    return `<div class="card" style="${edge}${ui.ppSelectedKey===key?'outline:2px solid var(--forest);':''}" onclick="selectPPCrop('${esc(key)}')">
      <div class="row"><span><b style="color:var(--ink);">${esc(c.cropName)}</b>${wc?` <span class="chip" style="background:${wc};color:#14261D;">${esc(tag)}</span>`:''}</span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      <div class="row"><span>Beds</span><span>${gap?'none planned':c.bedCount}</span></div>
      <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
    </div>`;
  }).join('');
}

function ppLegend(){
  const ctx=ppCurrent(), crops=(ctx&&ctx.plan&&ctx.plan.crops)||[];
  const maxW=Math.max(5,...crops.map(c=>Number(c.wave)||0));
  const anyNim=crops.some(notInMaster);
  return Array.from({length:maxW},(_,i)=>i+1).map(w=>legendItem('background:'+waveColor(w)+';',waveName(w))).join('')+
    (anyNim?legendItem('background:'+NOT_IN_MASTER_COLOR+';border:2px dashed #B3261E;','Not in master plan'):'')+
    legendItem('background:transparent;border:1px solid var(--line);','OPEN / no plan')+
    legendItem('background:#B0BEC5;opacity:.55;','Pending (paler)')+
    legendItem('background:#B0BEC5;border:2px dashed #14261D;','Modified (dashed)');
}

function ppBedGridSVG(){
  const ctx=ppCurrent();
  if(!ctx || ctx.error || !ctx.physicalBeds.length) return `<div class="empty">${ctx&&ctx.error?esc(ctx.error):'No physical beds.'}</div>`;
  const beds=ctx.physicalBeds, byBed={}; ctx.plan.beds.forEach(b=>byBed[b.bedId]=b);
  const cols=Math.min(8,beds.length)||1, cw=70, ch=50, gap=6, rows=Math.ceil(beds.length/cols);
  let svg=`<defs><pattern id="hatchpp" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#EDE7D3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8FC9" stroke-width="3"/></pattern></defs>`;
  beds.forEach((pb,i)=>{
    const col=i%cols, row=Math.floor(i/cols), bx=10+col*(cw+gap), by=10+row*(ch+gap);
    const plan=byBed[pb.bedId];
    let fill='transparent', tc='#1B1B18', label='', fop=1, dash='';
    const open=isOpenPlan(plan);
    if(plan && !open){
      fill=planFill(plan); tc='#14261D';
      const st=String(plan.status||'').toUpperCase();
      label=waveTag(plan)+' · '+(st||'PENDING');
      if(notInMaster(plan)) dash='stroke="#B3261E" stroke-width="2" stroke-dasharray="4 2"';
      if(st==='PENDING') fop=.55;
      if(st==='MODIFIED' && !notInMaster(plan)) dash='stroke="#14261D" stroke-width="2" stroke-dasharray="4 2"';
    } else if(plan){ label='OPEN'; }
    const sel=ui.ppSelectedBed===pb.bedId;
    svg += `<g><rect class="bed" data-ppbed="${esc(pb.bedId)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}" fill-opacity="${fop}" ${sel?'stroke="var(--forest)" stroke-width="3"':dash}></rect>
      <text x="${bx+6}" y="${by+13}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${esc(pb.bedId.split('-')[1]||pb.bedId)}</text>
      ${plan&&!open?`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tc}">${esc((plan.cropName||'').slice(0,10))}</text>`:`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9" fill="${tc}">Empty</text>`}
      ${label?`<text x="${bx+cw/2}" y="${by+42}" text-anchor="middle" font-size="6.5" font-weight="700" fill="${tc}" opacity=".85">${esc(label)}</text>`:''}
    </g>`;
  });
  const W=10+cols*(cw+gap), H=10+rows*(ch+gap);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

function ppRightHTML(){
  const ctx=ppCurrent();
  if(!ctx) return `<div class="panelhead"><h2>Season Planning</h2></div><div class="panelbody"><div class="empty">Loading…</div></div>`;
  if(ctx.error) return `<div class="panelhead"><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2></div><div class="panelbody"><div class="empty">${esc(ctx.error)}</div></div>`;

  // Bed selected + modifying -> assign-crop form
  if(ui.ppSelectedBed && ui.ppBedModify){
    const bed=ctx.plan.beds.find(b=>b.bedId===ui.ppSelectedBed);
    const options=(ctx.template.crops||[]).map(c=>`<option value="${esc(c.cropId)}" ${c.cropId===ui.ppBedDraftCrop?'selected':''}>${esc(c.cropName)} (${esc(c.cropId)})</option>`).join('');
    return `<div class="panelhead"><div><h2>${esc(ui.ppSelectedBed)}</h2><div class="meta">Modify Bed · exception workflow</div></div><button onclick="cancelBedModify()">✕</button></div>
    <div class="panelbody">
      <div class="note">Select an allowed crop for this physical bed. Choices are restricted to crops approved on this block's template (${esc(ctx.template.templateId||'')}) — not the full ranch crop list. To approve a crop the template doesn't include, update BLOCK_TEMPLATE and regenerate the plan instead.</div>
      <div class="field"><label>Crop</label><select onchange="ui.ppBedDraftCrop=this.value;">${options||'<option value="">No template crops available</option>'}</select></div>
      <button class="btn btn-primary" ${ui.ppBusy?'disabled':''} onclick="saveBedModifyReal()">Save</button>
      <button class="btn btn-ghost" onclick="cancelBedModify()">Cancel</button>
      <div class="note">Saving sets this bed's Layout Status to MODIFIED. The original template assignment stays in BLOCK_TEMPLATE, so it's always traceable.</div>
    </div>`;
  }

  // Bed selected, read view -> the layered Bed Profile. BED_MASTER (the physical bed) is read and
  // rendered first and unconditionally; BED_PLANTING_PLAN, rotation, current execution (COHORT_PRODUCTION /
  // FIELD_LIVE_SESSION / FIELD_ACTIVITY_LOG, already pulled into state.board / state.sessions / state.todayById
  // at login) and history are each read and rendered as their own separate layer underneath it. None of them
  // being empty ever blanks the Bed Profile itself - see the Bed Profile Architecture Fix spec.
  if(ui.ppSelectedBed){
    const bedId=ui.ppSelectedBed;
    const pb=(ctx.physicalBeds||[]).find(p=>p.bedId===bedId);          // BED_MASTER — the physical bed
    const bed=ctx.plan.beds.find(b=>b.bedId===bedId);                   // BED_PLANTING_PLAN — may legitimately be absent
    const v=bedViewById(bedId)||{ id:bedId, proposals:[] };             // COHORT_PRODUCTION (cohort board) — may legitimately be empty
    const sess=bedSessions(bedId);                                      // FIELD_LIVE_SESSION
    const hist=(v.activityLog||[]).slice(0,10);                         // historical activity
    const openExc=bedExceptions(bedId).filter(x=>x.status==='OPEN');
    const avail=bedAvailability(pb, v.cohortId, !!bed, openExc, v.bedStatus);
    const stg=planStage(avail, v.cohortId);

    if(!pb){
      // No BED_MASTER record at all for this bed ID. This is a genuine configuration problem, not an
      // empty-but-legitimate state, so it is labelled as one rather than rendered as a blank/em-dash bed.
      return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
      <div class="panelbody">
        <div class="card">
          <div class="row"><span>Bed Profile</span><span class="chip chip-danger">CONFIGURATION REQUIRED</span></div>
          <div class="row"><span>Issue</span><span>No BED_MASTER record found for ${esc(bedId)}.</span></div>
        </div>
      </div>`;
    }

    return `<div class="panelhead"><div><h2>${esc(bedId)}</h2><div class="meta">${esc(BLOCK_LABELS[ui.pBlock])} · BED</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">

      <h2 style="font-size:13px;margin:0 0 6px;">Bed Profile</h2>
      <div class="card">
        ${profRowOr('Physical Status', availabilityLabel(String(pbBedStatus(pb)||v.bedStatus||'').toUpperCase()), 'NOT VERIFIED')}
        ${profRow('Production Type', productionTypeLabel(pbLocationType(pb)))}
        ${profRow('Location Type', locationTypeLabel(pbLocationType(pb)))}
        ${profRow('Irrigation Zone', pbZone(pb))}
        ${profRow('Bed Length', pbBedLength(pb)!==''?(pbBedLength(pb)+' ft'):'')}
        ${profRow('Bed Health Status', pbHealthStatus(pb))}
        ${profRow('Irrigation Status', pbIrrigationStatus(pb))}
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Availability</h2>
      <div class="card">
        <div class="row"><span>Status</span><span><span class="chip ${availabilityChip(avail)}">${availabilityLabel(avail)}</span></span></div>
        ${avail==='UNVERIFIED'?`<div class="note">No one has verified this bed is physically ready (empty, cleared, sanity-checked). It cannot be assigned until you verify it. It becomes Available only after its reset sequence (ACT_037–051) is completed or overridden and you verify it.</div>
        `:''}
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Planning${bed&&stg.staged?' <span title="Locked until the bed is released and the assignment is approved" style="font-weight:400;">🔒</span>':''}</h2>
      <div class="card">${bed ? `
        ${stg.staged?`<div class="note" style="margin:0 0 6px;">${esc(stg.banner)}</div>`:''}
        <div style="${stg.staged?'color:var(--ink-soft);opacity:.7;':''}">
        <div class="row"><span>Crop</span><span>${esc(bed.cropName||v.cropName||'Not set')}</span></div>
        <div class="row"><span>Wave</span><span>${esc(bed.wave!=null&&bed.wave!==''?bed.wave:'Not set')}</span></div>
        <div class="row"><span>Planting Date</span><span>${esc(bed.plantingDate||'Not set')}</span></div>
        </div>
        <div class="row"><span>Plan Status</span><span><span class="chip ${stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?'chip-neutral':ppStatusChip(bed.status)}">${esc(stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?'STAGED':(bed.status||'Not set'))}</span></span></div>
        ${stg.staged&&String(bed.status||'').toUpperCase()==='CONFIRMED'?`<div class="row"><span>Release</span><span>${esc(stg.waiting)}</span></div>`:''}
      ` : `
        <div class="row"><span>Current Plan</span><span>No current plan</span></div>
      `}</div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Rotation</h2>
      <div class="card">
        <div class="row"><span>Current Family</span><span>${esc((bed&&bed.cropFamily)||ctx.rotation.cropFamily||'Not set')}</span></div>
        <div class="row"><span>Previous Year Family</span><span>${esc(ctx.rotation.previousFamily||'Not tracked')}</span></div>
        <div class="row"><span>Rotation Result</span><span>${esc(ctx.rotation.result||'Not calculated')}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">Current Production</h2>
      <div class="card">
        <div class="row"><span>Current Cohort</span><span>${esc(v.cohortId||'None')}</span></div>
        <div class="row"><span>Current Stage</span><span>${v.cohortId?esc((v.currentStage||'—').replace(/_/g,' ')):'Not Started'}</span></div>
        <div class="row"><span>Worker</span><span>${sess.length?esc(sess.map(s=>s.workerName).join(', ')):'None'}</span></div>
      </div>

      <h2 style="font-size:13px;margin:14px 0 6px;">History</h2>
      <div class="qgh" style="cursor:pointer;" onclick="togglePPHistory()"><span>${ui.ppHistoryOpen?'▾':'▸'} ${hist.length?(hist.length+' record'+(hist.length===1?'':'s')):'No history'}</span></div>
      ${ui.ppHistoryOpen?(hist.length?hist.map(r=>`<div class="row"><span>${esc(r.taskType||r.activityName||'')} · ${esc(r.workerName||r.workerId||'')}</span><span>${esc(r.endTime||'')}</span></div>`).join(''):`<div class="empty" style="padding:10px 0;">No history recorded for this bed.</div>`):''}

      <h2 style="font-size:13px;margin:14px 0 6px;">Bed dispatch</h2>
      ${actionsPanel(v,sess)}
      <button class="btn btn-outline" ${(ui.ppBusy||!bed)?'disabled':''} ${bed?'':'title="This bed has no BED_PLANTING_PLAN row yet — generate the plan first."'} onclick="startBedModify()">Modify Bed</button>
      <div class="note">Bed Profile above comes from BED_MASTER and always renders, whether or not this bed currently has a plan, cohort, session or history.</div>
    </div>`;
  }

  // Crop selected, read view -> "where should this crop be planted"
  if(ui.ppSelectedKey){
    const c=ctx.plan.crops.find(x=>(x.cropId+'|'+(x.wave||''))===ui.ppSelectedKey);
    if(c) return `<div class="panelhead"><div><h2>${esc(c.cropName)}</h2><div class="meta">${esc(c.cropFamily||'')} · ${ui.pYear}</div></div><button onclick="clearPPSelection()">✕</button></div>
    <div class="panelbody">
      <div class="card">
        <div class="row"><span>Planting date</span><span>${esc(c.plantingDate||'—')}</span></div>
        <div class="row"><span>Beds required</span><span>${c.bedCount}</span></div>
        <div class="row"><span>Bed range</span><span>${esc(c.bedRange)}</span></div>
        <div class="row"><span>Wave</span><span>${c.wave!=null?c.wave:'—'}</span></div>
        <div class="row"><span>Layout status</span><span class="chip ${ppStatusChip(c.status)}">${esc(c.status)}</span></div>
      </div>
      <div class="note">Click a bed on the map to view or modify it individually.</div>
    </div>`;
  }

  // Nothing selected -> block-level summary + Confirm Layout / Modify Bed as the primary Season Planning actions
  const st=ctx.status;
  const planned = st.pending + st.confirmed + st.modified;
  const allConfirmed = ctx.plan.found && st.physicalBedCount>0 && st.confirmed>=st.physicalBedCount;
  const statusLabel = !ctx.plan.found ? 'Not generated' : allConfirmed ? 'Confirmed' : (st.confirmed>0 ? 'Partially confirmed' : 'Pending Confirmation');
  const statusChip = allConfirmed?'chip-ok':(!ctx.plan.found?'chip-neutral':'chip-warn');
  return `<div class="panelhead"><div><h2>${esc(BLOCK_LABELS[ui.pBlock])}</h2><div class="meta">${ui.pYear} · ${esc(ctx.rotation.cropFamily||'No rotation set')}</div></div></div>
  <div class="panelbody">
    <div class="card">
      <div class="row"><span>Beds</span><span>${st.physicalBedCount}</span></div>
      <div class="row"><span>Planned</span><span>${planned}</span></div>
      <div class="row"><span>Empty</span><span>${st.empty}</span></div>
      <div class="row"><span>Modified</span><span>${st.modified}</span></div>
      <div class="row"><span>Confirmed</span><span>${st.confirmed}</span></div>
      <div class="row"><span>Status</span><span><span class="chip ${statusChip}">${esc(statusLabel)}</span></span></div>
    </div>
    ${!ctx.plan.found ? `
      ${ctx.generationException?`<div class="note" style="color:var(--danger);">${esc(ctx.generationException)}</div>`
        :`<div class="note">No plan generated yet. The approved template (${esc(ctx.template.templateId||'')}) will determine bed-by-bed layout — nothing to choose here.</div>`}
      <button class="btn btn-primary" ${(ui.ppBusy||ctx.generationException)?'disabled':''} onclick="generatePlanReal()">${ui.ppBusy?'Generating…':'Generate Plan'}</button>
    ` : `
      <h2 style="font-size:13px;margin:14px 0 6px;">Actions</h2>
      <button class="btn btn-primary" ${(ui.ppBusy||allConfirmed)?'disabled':''} onclick="confirmLayoutReal()">${allConfirmed?'Confirmed ✓':'Confirm Layout'}</button>
      <div class="note" style="margin-top:0;">Click a bed on the map, or a crop on the left, to open it and use Modify Bed — the exception workflow for when the standard template needs to change for one bed.</div>
      <button class="btn btn-ghost" onclick="ui.pAdvOpen=!ui.pAdvOpen;render();">${ui.pAdvOpen?'▾':'▸'} Advanced</button>
      ${ui.pAdvOpen?`<button class="btn btn-outline" ${ui.ppBusy?'disabled':''} onclick="generatePlanReal()">Regenerate from template</button>`:''}
    `}
  </div>`;
}

  }</div>

}

/* ---- render: center bed map (Plan/Exec/Harvest/Cover share one 55-bed grid) ---- */
function planBedVisual(mode,crop,n){
  if(!crop) return { fill:'#EEE', tc:'#1B1B18', label:'' };
  if(mode==='plan'){
    if(crop.layoutStatus==='Modified') return { fill:'url(#hatch)', tc:'#14261D', label:'MODIFIED' };
    if(crop.layoutStatus==='Confirmed') return { fill:'#2E7D32', tc:'#fff', label:'CONFIRMED' };
    return { fill:'#D8CFAE', tc:'#1B1B18', label:'PENDING' };
  }
  if(mode==='exec'){ const planted=crop.plantedBeds.includes(n); return planted? { fill:'#2E7D32', tc:'#fff', label:'PLANTED' } : { fill:'#D8CFAE', tc:'#1B1B18', label:'ASSIGNED' }; }
  if(mode==='harvest'){
    if(crop.harvestStatus==='Complete') return { fill:'#7C8B98', tc:'#fff', label:'HARVEST COMPLETE' };
    if(crop.plantingStatus!=='Planted') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    return n%3===0? { fill:'#2E7D32', tc:'#fff', label:'HARVEST READY' } : { fill:'#8FBF8A', tc:'#1B1B18', label:'GROWING' };
  }
  if(mode==='cover'){
    if(crop.harvestStatus!=='Complete') return { fill:'#EEE', tc:'#1B1B18', label:'' };
    const applied=state.cover[ui.pBlock]&&state.cover[ui.pBlock].status==='Applied';
    return applied? { fill:'#2E7D32', tc:'#fff', label:'COVER CROP' } : { fill:'#7C8B98', tc:'#fff', label:'HARVEST COMPLETE' };
  }
  return { fill:'#EEE', tc:'#1B1B18', label:'' };
}
function planBedGridSVG(mode){
  const plan=getPlan(ui.pBlock,ui.pYear), cols=8, cw=70, ch=50, gap=6, rows=Math.ceil(BLOCK_BEDS/cols);
  let svg=`<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#EDE7D3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8FC9" stroke-width="3"/></pattern></defs>`;
  for(let n=1;n<=BLOCK_BEDS;n++){
    const crop=plan.crops.find(c=>c.bedNums.includes(n)), col=(n-1)%cols, row=Math.floor((n-1)/cols), bx=10+col*(cw+gap), by=10+row*(ch+gap);
    const info=planBedVisual(mode,crop,n), sel=ui.pModifying&&ui.pSelBeds.includes(n);
    svg += `<g><rect class="bed" data-pbed="${n}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${info.fill}" ${sel?'stroke="var(--forest)" stroke-width="3"':''}></rect>
      <text x="${bx+6}" y="${by+13}" font-size="8" font-weight="700" fill="${info.tc}" opacity=".7">${String(n).padStart(2,'0')}</text>
      ${crop?`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${info.tc}">${esc(crop.cropName.slice(0,10))}</text>`:`<text x="${bx+cw/2}" y="${by+30}" text-anchor="middle" font-size="9" fill="${info.tc}">Empty</text>`}
      ${info.label?`<text x="${bx+cw/2}" y="${by+42}" text-anchor="middle" font-size="6.5" font-weight="700" fill="${info.tc}" opacity=".85">${esc(info.label)}</text>`:''}
    </g>`;
  }
  const W=10+cols*(cw+gap), H=10+rows*(ch+gap);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}
function attachPlanningEvents(){

    <div class="note">Approving locks BLOCK_ROTATION_PLAN for ${ui.pYear} and generates BED_PLANTING_PLAN for every block from the family template.</div>
    <button class="btn btn-outline" ${st==='Approved'?'disabled':''} onclick="openEditRotation()">Edit rotation</button>
    <button class="btn btn-primary" ${st==='Approved'?'disabled':''} onclick="approveRotation()">${st==='Approved'?'Approved ✓':'Approve rotation'}</button>
  </div>`;
}

/* ============================== DEMO BACKEND (only used when WEB_APP_URL is empty) ============================== */
const demoUsers = { 'USR-MANAGER1':{pin:'1234',name:'Maya Ortiz',role:'Manager'}, 'USR-FOUNDER1':{pin:'1234',name:'Sam Reyes',role:'Founder'}, 'USR-WORKER1':{pin:'1234',name:'Jo Lindqvist',role:'Worker'} };
const demoWorkers = [{workerId:'W01',name:'Ana Prieto'},{workerId:'W02',name:'Ben Okafor'},{workerId:'W03',name:'Chloe Weber'},{workerId:'W07',name:'Jo Lindqvist'}];
function seedRand(seed){ return function(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; }
function buildDemoBeds(){
  const rnd=seedRand(42), beds=[]; let n=0;
  for(let blk=1; blk<=N_BLOCKS && n<TOTAL_BEDS; blk++){
    const countThisBlock = Math.min(BEDS_PER_ROW*7, TOTAL_BEDS-n, 40);
    for(let i=1;i<=countThisBlock && n<TOTAL_BEDS;i++,n++){
      const crop=CROPS[Math.floor(rnd()*CROPS.length)];
      // ~6% of beds start vacant (no cohort assigned yet) so the demo has free
      // beds to recommend into; the rest are ACTIVE cohorts
      // mid-cycle at a random Current_Stage.
      const vacant = (n%17===4);
      const stage = vacant? '' : CURRENT_STAGES[Math.floor(rnd()*rnd()*CURRENT_STAGES.length)];
      beds.push({ id:`B${blk}-${String(i).padStart(2,'0')}`, blockId:'Block '+blk, locationType:'FIELD',
        cropName: vacant? '' : crop[0], cohortId: vacant? '' : crop[1]+'-C0'+((n%4)+1),
        currentStage: stage, cohortStatus: vacant? '' : 'ACTIVE',
        plantingDate:'', harvestWindow:'', activityLog:[] });
    }
  }
  return beds;
}
const demoBeds = buildDemoBeds();
const demoSessions = [
  { id:'S-1041', bedId:demoBeds[3].id, workerId:'W01', workerName:'Ana Prieto', activity:'Weeding', status:'ACTIVE', assignedTime:new Date(Date.now()-5400000).toISOString(), startTime:new Date(Date.now()-5000000).toISOString() },
  { id:'S-1042', bedId:demoBeds[10].id, workerId:'W02', workerName:'Ben Okafor', activity:'Transplanting', status:'PAUSED', assignedTime:new Date(Date.now()-9000000).toISOString(), startTime:new Date(Date.now()-8600000).toISOString() }
];
const demoExceptions = [
  { id:'EXC-0012', bedId:demoBeds[3].id, type:'PestPressure', severity:'HIGH', worker:'Ana Prieto', workerName:'Ana Prieto', notes:'Aphids on outer leaves', status:'OPEN' },
  { id:'EXC-0013', bedId:demoBeds[10].id, type:'PlantCondition', severity:'CRITICAL', worker:'Ben Okafor', workerName:'Ben Okafor', notes:'Wilting after transplant', status:'OPEN' }
];
const hrBeds = demoBeds.filter(b=>b.currentStage==='HARVEST_READY').slice(0,5);
const demoHarvestReady = hrBeds.map(b=>({ bedId:b.id, cohortId:b.cohortId, targetQty:'25 kg', targetDate:'in 3 days', notes:'' }));
const demoQueue = {}; demoBeds.forEach((b,i)=>{ demoQueue[b.id] = i%11===0?'MUST_DO': i%7===0?'ATTENTION': i%3===0?'ROUTINE':'NONE'; });
// Cohorts still in PRODUCTION_WAVE_PLAN -> COHORT_PRODUCTION with no bed yet
// (Cohort_Status PLANNED, Location_ID blank) - what assignBed() targets.
const demoAssignableCohorts = [
  { cohortId:'RAD-C03', cropId:'RAD', cropName:'Radish', waveNumber:3, productionPath:'FIELD', plannedDob:'2026-10-02' },
  { cohortId:'SPN-C02', cropId:'SPN', cropName:'Spinach', waveNumber:2, productionPath:'FIELD', plannedDob:'2026-10-05' }
];
const demoVacant = demoBeds.filter(b=>!b.cohortId);
const demoReasons = blk => ['✓ Approved for '+blk, '✓ Planting window OK', '✓ Bed free for these dates - no other cohort planned in this bed', '✓ Rotation OK'];
const demoAssign = {
  proposed: demoAssignableCohorts.map((c,i)=>({ cohortId:c.cohortId, cropId:c.cropId, cropName:c.cropName, waveNumber:c.waveNumber, plannedDob:c.plannedDob, endDate:'2026-12-01',
    recommendedBed:demoVacant[i].id, blockId:demoVacant[i].blockId, status:'PROPOSED', exceptionType:'', reasons:demoReasons(demoVacant[i].blockId) })),
  exceptions: [{ cohortId:'ONI-C01', cropId:'ONI', cropName:'Onions', waveNumber:1, plannedDob:'2026-10-10', endDate:'2027-02-01', recommendedBed:'', blockId:'', status:'EXCEPTION',
    exceptionType:'NO_BLOCK_RULE', reasons:['No approved block for Onions. Add Preferred_Block to this crop on CROP_REFERENCE (e.g. B2).'] }]
};
const demoCatalog = [
  ['Prep',['Tillage','Amending','PreIrrigation','DripInstall']],
  ['Planting',['Planting','DirectSeeding','Transplanting','Replanting','Thinning','Seeding']],
  ['CropCare',['Weeding','Fertilizing','IrrigationCheck','PestControl','DiseaseControl','Pruning','Trellising','Cultivation','Fertilization','Irrigation']],
  ['Harvest',['HarvestPrep','Harvest']],
  ['State',['Scouting','PestScouting','DiseaseScouting','CropInspection','MaturityInspection']]
].flatMap(([domain,names])=>names.map(name=>({ name, domain, description:'', allowedStages:[], requiresApproval:false }))).map((x,i)=>Object.assign(x,{id:'ACT_'+String(i+1).padStart(3,'0')}));  // demo only: same shape getActivityCatalog_() returns
const demoSessionsByToken = {};
let demoRejected = 0;
async function mockBackend(action, p){
  await new Promise(r=>setTimeout(r,150));
  const ok=data=>({ok:true,data}), bad=(error,code)=>({ok:false,error,code});
  if(action==='login'){
    const u=demoUsers[String(p.workerId||'').toUpperCase()];
    if(!u||u.pin!==String(p.pin)) return bad('Worker ID or PIN is not correct.','AUTH_FAILED');
    if(!['Manager','Founder'].includes(u.role)) return bad('This app is for Manager and Founder accounts. Your account is set up as '+u.role+'.','ROLE_NOT_ALLOWED');
    const token='demo-'+Math.random().toString(36).slice(2);
    demoSessionsByToken[token]={ id:String(p.workerId).toUpperCase(), name:u.name, role:u.role };
    return ok({ workerId:String(p.workerId).toUpperCase(), name:u.name, role:u.role, token });
  }
  if(action==='logout'){ delete demoSessionsByToken[p.token]; return ok({loggedOut:true}); }
  const me=demoSessionsByToken[p.token];
  if(!me) return bad('Your session ended. Sign in again.','UNAUTHENTICATED');
  switch(action){
    case 'get-manager-today-view':
      return ok({ activityCatalog:demoCatalog, beds:demoBeds, sessions:demoSessions, exceptions:demoExceptions, harvestReady:demoHarvestReady, queueByBed:demoQueue, workers:demoWorkers });
    case 'start-session': {
      demoSessions.push({ id:'S-'+Math.floor(Math.random()*9000+1000), bedId:p.bedId, workerId:p.workerId, workerName:(demoWorkers.find(w=>w.workerId===p.workerId)||{}).name||p.workerId, activity:p.activity||'Task', status:'ASSIGNED', assignedTime:new Date().toISOString(), startTime:'' });
      return ok({done:true});
    }
    case 'reassign-session': case 'close-and-new-session': {
      const s=demoSessions.find(x=>x.id===p.sessionId); if(!s) return bad('Session not found.','NOT_FOUND');
      s.workerId=p.toWorkerId; s.workerName=(demoWorkers.find(w=>w.workerId===p.toWorkerId)||{}).name||p.toWorkerId;
      if(action==='close-and-new-session') s.status='ACTIVE';
      return ok({done:true});
    }
    case 'resolve-exception': {
      const x=demoExceptions.find(e=>e.id===p.exceptionId); if(x) x.status='RESOLVED';
      return ok({done:true});
    }
    case 'verify-harvest-ready': {
      const i=demoHarvestReady.findIndex(h=>h.cohortId===p.cohortId); if(i>=0) demoHarvestReady.splice(i,1);
      return ok({done:true});
    }
    case 'verify-harvest-complete': {
      demoBeds.filter(b=>b.cohortId===p.cohortId).forEach(b=>b.currentStage='HARVEST_COMPLETE');
      return ok({done:true});
    }
    // ---- AssignmentEngine.gs mirrors: manager write-back actions only ----
    case 'get-cohort-board': {
      const cohorts = demoBeds.filter(b=>b.cohortId).map(b=>({ cohortId:b.cohortId, cropId:b.cohortId.slice(0,3), cropName:b.cropName, locationId:b.id,
        cohortStatus:b.cohortStatus, currentStage:b.currentStage, planningYear:p.year||new Date().getFullYear(), actualDob:b.plantingDate||'', harvestWindowStart:'', harvestWindowEnd:'' }));
      return ok({ year:p.year, beds:demoBeds.map(b=>({ bedId:b.id, blockId:b.blockId, locationType:b.locationType })), cohorts, stats:{ yearRows:cohorts.length+demoAssign.proposed.length+demoAssign.exceptions.length, unassigned:demoAssign.proposed.length+demoAssign.exceptions.length } });
    }
    case 'get-assignment-queue':
      return ok({ year:p.year, generatedDate:'demo', counts:{ rejected:demoRejected, unassigned:demoAssign.proposed.length+demoAssign.exceptions.length, proposed:demoAssign.proposed.length, exceptions:demoAssign.exceptions.length, notYetProposed:0, plantingReady:demoBeds.filter(b=>b.cohortStatus==='PRE_PLANTING').length },
        proposed:demoAssign.proposed, exceptions:demoAssign.exceptions,
        plantingReady:demoBeds.filter(b=>b.cohortStatus==='PRE_PLANTING').map(b=>({ cohortId:b.cohortId, cropName:b.cropName, waveNumber:'', locationId:b.id, plannedDob:'' })) });
    case 'generate-bed-recommendations':
      return ok({ ok:true, year:p.year, proposed:demoAssign.proposed.length, exceptions:demoAssign.exceptions.length, total:demoAssign.proposed.length+demoAssign.exceptions.length });
    case 'get-bed-candidates':
      return ok({ ok:true, cohortId:p.cohortId, recommendedBlocks:['Block 1'], locations:demoBeds.filter(b=>!b.cohortId).map(b=>({ locationId:b.id, blockId:b.blockId, outOfRule:b.blockId!=='Block 1', note:b.blockId!=='Block 1'?'Outside approved block':'Empty in this window' })) });
    case 'approve-assignment': case 'approve-assignments': {
      const ids = action==='approve-assignments' ? p.cohortIds : [p.cohortId]; let approved=0, lastBed='';
      ids.forEach(id=>{
        const list = demoAssign.proposed.some(x=>x.cohortId===id) ? demoAssign.proposed : demoAssign.exceptions, i=list.findIndex(x=>x.cohortId===id); if(i<0) return;
        const q=list[i], bed=demoBeds.find(b=>b.id===q.recommendedBed); if(!bed||bed.cohortId) return; lastBed=bed.id;
        bed.cohortId=q.cohortId; bed.cropName=q.cropName; bed.cohortStatus='PRE_PLANTING'; bed.currentStage=''; list.splice(i,1); approved++;
      });
      if(action==='approve-assignment') return approved ? ok({ cohortId:p.cohortId, locationId:lastBed }) : bad('That bed is no longer free for this cohort\'s dates. Regenerate recommendations or pick another bed.','LOCATION_OCCUPIED');
      return ok({ approved, failed:ids.length-approved, results:[] });
    }
    case 'get-eligible-locations': {
      const vacant = demoBeds.filter(b=>!b.cohortId).map(b=>({ locationId:b.id, blockId:b.blockId, locationType:b.locationType }));
      return ok({ cohortId:p.cohortId, productionPath:'FIELD', locations:vacant });
    }
    case 'change-assignment-bed': {
      const src=demoAssign.proposed.find(x=>x.cohortId===p.cohortId)||demoAssign.exceptions.find(x=>x.cohortId===p.cohortId);
      if(!src) return bad('No open recommendation for that cohort.','QUEUE_ROW_NOT_FOUND');
      const bed=demoBeds.find(b=>b.id===p.newLocationId); if(!bed) return bad('Bed not found.','LOCATION_NOT_FOUND');
      if(bed.cohortId) return bad(bed.id+' is already reserved during this cohort\'s window.','LOCATION_UNAVAILABLE');
      src.recommendedBed=bed.id; src.blockId=bed.blockId; src.status='PROPOSED'; src.exceptionType='';
      src.reasons=['✓ Location changed by manager to '+bed.id].concat(demoReasons(bed.blockId));
      const ei=demoAssign.exceptions.indexOf(src); if(ei>=0){ demoAssign.exceptions.splice(ei,1); demoAssign.proposed.push(src); }
      return ok({ cohortId:p.cohortId, recommendedBed:bed.id, status:'PROPOSED' });
    }
    case 'reject-assignment': {
      if(!String(p.reason||'').trim()) return bad('A reason is required.','REASON_REQUIRED');
      let hit=false; [demoAssign.proposed,demoAssign.exceptions].forEach(l=>{ const i=l.findIndex(x=>x.cohortId===p.cohortId); if(i>=0){ l.splice(i,1); hit=true; } });
      if(!hit) return bad('No open recommendation for that cohort.','QUEUE_ROW_NOT_FOUND');
      demoRejected++; return ok({ cohortId:p.cohortId, status:'REJECTED' });
    }
    case 'verify-planting': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      if(bed.cohortStatus!=='PRE_PLANTING') return bad('This cohort is not awaiting planting verification.','WRONG_STATUS');
      bed.cohortStatus='ACTIVE'; bed.currentStage='PRE_PLANTING'; bed.plantingDate=p.actualDob;
      return ok({done:true});
    }
    case 'move-cohort': {
      const oldBed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!oldBed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      const newBed=demoBeds.find(b=>b.id===p.newLocationId); if(!newBed) return bad('Bed not found.','LOCATION_NOT_FOUND');
      if(newBed.cohortId) return bad('That bed is already occupied.','LOCATION_OCCUPIED');
      newBed.cohortId=oldBed.cohortId; newBed.cropName=oldBed.cropName; newBed.cohortStatus=oldBed.cohortStatus; newBed.currentStage=oldBed.currentStage;
      oldBed.cohortId=''; oldBed.cropName=''; oldBed.cohortStatus=''; oldBed.currentStage='';
      return ok({done:true});
    }
    case 'complete-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='COMPLETE'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    case 'override-post-harvest':
      if(String(p.reason||'').trim().length<5) return bad('An explanation is required.','OVERRIDE_REASON_REQUIRED');
      if(!(p.activities||[]).length) return bad('Select at least one step.','NO_STEPS_SELECTED');
      return ok({ done:true });
    case 'terminate-cohort': {
      const bed=demoBeds.find(b=>b.cohortId===p.cohortId); if(!bed) return bad('Cohort not found.','COHORT_NOT_FOUND');
      bed.cohortStatus='TERMINATED'; bed.cohortId=''; bed.cropName=''; bed.currentStage='';
      return ok({done:true});
    }
    default: return bad('That action is not available.','UNKNOWN_ACTION');
  }
}
