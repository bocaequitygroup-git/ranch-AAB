<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity Assignment Board — Ngapori Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-dark:#14261D; --sand:#F5F1E6; --paper:#FFFFFF; --ink:#1B1B18; --ink-soft:#5B5A52;
  --line:#DCD5C4; --ok:#2E7D32; --warn:#C77700; --danger:#B3261E; --irrigation:#3A78C9; --musthave:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; } }
:root[data-theme="dark"]{ --sand:#15181A; --paper:#1E2320; --ink:#EDEAE0; --ink-soft:#A9A79A; --line:#33372F; }
*{box-sizing:border-box;} html,body{height:100%;}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topbar .brand{font-weight:800;font-size:15px;}
.topbar .sub{font-size:11px;color:#C9D6CD;}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 11px;border-radius:8px;}
.conn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;}
.conn[data-s=online]{background:#E4F1E5;color:var(--ok);} .conn[data-s=demo]{background:#FBEBD6;color:var(--warn);}
.conn[data-s=offline],.conn[data-s=error]{background:#F7DEDB;color:var(--danger);}
.demo-strip{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:5px 16px;text-align:center;}
.wrap{flex:1;display:flex;min-height:0;}
.mapcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.toolbar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--paper);}
.toolbar select,.toolbar input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;background:var(--paper);color:var(--ink);}
.seg{display:flex;gap:4px;background:var(--sand);padding:3px;border-radius:9px;}
.seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-soft);}
.seg button.active{background:var(--forest);color:#fff;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);padding:8px 14px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mapscroll{flex:1;overflow:auto;padding:14px;}
.bed{stroke:var(--line);stroke-width:1;cursor:pointer;}
.bed:hover{stroke:var(--forest);stroke-width:2;}
.bed.selected{stroke:var(--forest);stroke-width:3;}
.bed.proposed{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3;}
.bed.proposed:hover{stroke:var(--forest);stroke-width:2;stroke-dasharray:none;}
.bed.proposed.selected{stroke:var(--forest);stroke-width:3;stroke-dasharray:none;}
.sw.sw-proposed{background:#FBEBD6;border:1.5px dashed var(--warn);width:11px;height:11px;}
.sw.sw-avail{background:#EEE;border:1px solid var(--line);}
.badge text,.badge circle{pointer-events:none;}
.bed{pointer-events:all;}
.notice{background:#FFF3C4;color:#5b4300;font-size:12.5px;padding:7px 14px;border-bottom:1px solid var(--line);}
.seg .n{opacity:.65;font-weight:600;margin-left:3px;}
.blocklabel{font-size:9px;font-weight:800;fill:var(--ink-soft);}
.panel{width:360px;max-width:92vw;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:margin .15s;}
.panel.closed{display:none;}
.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.panelhead h2{margin:0;font-size:16px;}
.panelhead .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.panelhead button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.tabs{display:flex;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:none;padding:10px 4px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--forest);border-color:var(--forest);}
.panelbody{flex:1;overflow-y:auto;padding:14px 16px;}
/* ---- six-tab shell, bed status board, smart allocation ---- */
.ptabs{display:flex;padding:0 10px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;}
.ptabs button{flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;padding:12px 14px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.ptabs button:hover{color:var(--ink);}
.ptabs button.active{color:var(--forest);border-bottom-color:var(--forest);}
.ptabs button:focus-visible,.bb-bed:focus-visible{outline:2px solid var(--forest);outline-offset:-2px;}
.bb-wrap{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:auto;}
.bb-t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;}
.bb-t th{position:sticky;top:0;z-index:1;background:var(--sand);text-align:left;font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;border-bottom:1px solid var(--line);}
.bb-t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
.bb-t tbody tr[onclick]{cursor:pointer;}
.bb-t tr.sel td{background:color-mix(in srgb,var(--forest) 10%,var(--paper));}
.bb-t .id{font-size:11px;color:var(--ink-soft);}
.bb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-bottom:14px;}
.bb-bed{border:1px solid var(--line);border-radius:8px;padding:6px 4px;min-height:48px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.bb-bed span{font-size:9px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* ---- Operation planner ---- */
.op{flex:1;min-width:0;overflow:auto;padding:16px;}
.op-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.op-top h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;}
.op-top .sum{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.op-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.op-ctl input[type=search]{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--paper);color:var(--ink);min-width:200px;}
.op-help{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;max-width:980px;}
.op-wrap{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:auto;max-height:calc(100vh - 290px);min-height:240px;}
.op-t{border-collapse:separate;border-spacing:0;width:100%;min-width:1120px;font-size:12.5px;}
.op-t th{position:sticky;top:0;z-index:2;background:var(--sand);text-align:left;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);padding:9px 7px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.25;}
.op-t td{padding:7px 7px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
.op-t tr.dirty td{background:color-mix(in srgb,var(--warn) 7%,var(--paper));}
.op-t tr.dirty td:first-child{box-shadow:inset 4px 0 0 var(--warn);}
.op-t .nm{font-weight:800;font-size:13px;}
.op-t .id{font-size:11px;color:var(--ink-soft);}
.op-t .mt{font-size:10.5px;color:var(--ink-soft);}
.op-t input{font-family:inherit;font-size:13px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);}
.op-t input[type=date]{width:132px;} .op-t input[type=number]{width:58px;}
.op-t input:disabled{opacity:.5;}
.op-t .calc{font-variant-numeric:tabular-nums;}
.op-t .dim{color:var(--ink-soft);}
.op-chk{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:normal;max-width:280px;line-height:1.3;}
.op-chk.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);}
.op-chk.warn,.op-chk.clear{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);}
.op-chk.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);}
.op-chk.none{color:var(--ink-soft);background:color-mix(in srgb,var(--ink-soft) 10%,transparent);}
.op-det > td{background:var(--sand);padding:10px 14px 14px 24px;white-space:normal;}
.op-det table{border-collapse:collapse;font-size:12px;}
.op-det table th{position:static;background:none;padding:3px 16px 3px 0;border:none;}
.op-det table td{background:none;border:none;padding:3px 16px 3px 0;}
.op-t td.chkc{min-width:150px;}
@media print{.op-ctl,.op-help{display:none !important;} .op-wrap{max-height:none;}}
/* ---- Production calendar ---- */
.cal{flex:1;min-width:0;overflow:auto;padding:16px;max-width:1180px;margin:0 auto;width:100%;}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.cal-top h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;}
.cal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px;}
.cal-card{background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:box-shadow .12s,border-color .12s;}
.cal-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.cal-card.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset;background:color-mix(in srgb,var(--c) 7%,var(--paper));}
.cal-card .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
.cal-card .v{font-size:17px;font-weight:800;margin-top:3px;}
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.cal-bar h3{margin:0;font-size:15px;font-weight:800;}
.cal-bar .grow{flex:1;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);align-items:center;}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
.cal-insight{background:color-mix(in srgb,var(--ok) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px;}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cal-nav .ttl{flex:1;}
.cal-nav .ttl b{font-size:18px;font-weight:800;display:block;}
.cal-nav .ttl span{font-size:12px;color:var(--ink-soft);}
.cal-nav button{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;}
.cal-nav button:hover{border-color:var(--forest);}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal-dow{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:4px 0;}
.cal-cell{min-height:104px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px;font-family:inherit;text-align:left;color:var(--ink);}
.cal-cell:hover{border-color:var(--forest);}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell.has{background:color-mix(in srgb,var(--forest) 4%,var(--paper));}
.cal-cell.today .d{background:var(--forest);color:#fff;}
.cal-cell.sel{border:2px solid var(--forest);background:color-mix(in srgb,var(--forest) 10%,var(--paper));}
.cal-cell .d{font-size:12px;font-weight:800;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cal-chip{font-size:10.5px;font-weight:700;line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-left:3px solid var(--c);}
.cal-more{font-size:10.5px;font-weight:800;color:var(--ink-soft);padding-left:2px;}
.cal-day-h{font-size:15px;font-weight:800;margin:18px 0 8px;}
.cal-item{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.cal-item .kind{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c);}
.cal-item .nm{font-size:14.5px;font-weight:800;margin-top:1px;}
.cal-item .sb{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.cal-item .loc{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-right:6px;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);}
.irr-beds{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;}
.irr-bed{display:flex;align-items:center;gap:6px;font-size:13px;}
.irr-st{font-size:11px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:1px 7px;border-radius:999px;}
.irr-w{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.irr-chip{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);}
.cal-agenda-d{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);}
.cal-note{font-size:11.5px;color:var(--ink-soft);margin-top:22px;line-height:1.5;}
.cal-align{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.45;}
.cal-align.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--paper));}
.cal-align.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 7%,var(--paper));}
.cal-align.warn{color:var(--ink-soft);}
.cal-align .h{font-weight:700;margin-bottom:3px;} .cal-align .r{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-soft);} .cal-align em{color:var(--danger);font-style:normal;font-weight:700;}
.cal-align details{margin-top:6px;} .cal-align summary{cursor:pointer;font-weight:600;} .cal-align .i{margin-top:4px;font-size:12px;color:var(--ink-soft);}
.cal-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:6px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);}
@media (max-width:640px){ .cal{padding:10px;} .cal-cell{min-height:64px;padding:3px;} .cal-chip{font-size:9px;padding:1px 3px;} .cal-top h2{font-size:17px;} }
@media print{ .topbar,.toolbar,.cal-noprint,.toast{display:none !important;} .cal{overflow:visible;padding:0;max-width:none;} .cal-cell{min-height:80px;break-inside:avoid;} body{background:#fff;} }
.card{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.row span:first-child{color:var(--ink-soft);} .row span:last-child{font-weight:700;text-align:right;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;}
.chip-ok{background:#E4F1E5;color:var(--ok);} .chip-warn{background:#FBEBD6;color:var(--warn);} .chip-danger{background:#F7DEDB;color:var(--danger);} .chip-neutral{background:var(--line);color:var(--ink-soft);}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
.sheet .btn:disabled{opacity:.38;cursor:not-allowed;background:transparent;border-style:dashed;} .sheet .btn-primary:disabled{background:var(--forest);border-style:solid;}
.btn-primary{background:var(--forest);color:#fff;} .btn-outline{background:transparent;color:var(--forest);border:1.5px solid var(--forest);}
.btn-danger{background:var(--danger);color:#fff;} .btn-cta{padding:10px 20px;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.15);}
.proposal{border-left:4px solid var(--warn);} .proposal .plabel{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
.proposal .pname{font-size:15px;font-weight:800;} .proposal .pcode{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.qfocus{outline:3px solid var(--forest);outline-offset:2px;}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 10px;line-height:1.45;}
.btn-reject{background:transparent;color:var(--danger);border:1.5px solid var(--danger);} .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:600;}
.empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 10px;}
.field{margin-bottom:12px;} .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.loginwrap{max-width:380px;margin:60px auto;padding:0 16px;}
.error{background:#F7DEDB;color:var(--danger);padding:10px 13px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:420px;border-radius:14px;padding:18px;max-height:86vh;overflow-y:auto;margin:16px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;}
.sheet.wide{max-width:720px;}
.astrip{gap:6px;padding-top:6px;padding-bottom:6px;} .alabel{font-size:11px;font-weight:800;color:var(--ink-soft);margin-right:4px;text-transform:uppercase;letter-spacing:.03em;}
.astat{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
.astat b{font-size:15px;} .astat span{color:var(--ink-soft);font-weight:600;} .astat.warn{border-color:var(--warn);}
.pill{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:#fff;color:var(--forest);font-size:11px;font-weight:800;margin-left:4px;}
.qgh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin:14px 0 6px;position:sticky;top:-18px;background:var(--paper);padding:6px 0;z-index:1;}
.qtop{display:flex;justify-content:space-between;gap:10px;} .qsub{font-size:12px;color:var(--ink-soft);} .qdates{font-size:11.5px;color:var(--ink-soft);text-align:right;}
.qrec{margin:10px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;} .qrec>span:first-child{color:var(--ink-soft);font-size:11.5px;} .qrec b{font-size:19px;color:var(--forest);}

/* ============================== DATA LOAD ============================== */
/* Fetch get-manager-today-view and apply it. Used by loadToday and refreshLive so both log the same timings.
 * The server adds d.timings (ms per stage, see buildTodayView_ in Code_main.gs); compare with the round trip here:
 * server total << round trip means the time is spent outside buildTodayView_ (Apps Script start-up, auth, network). */
async function fetchTodayView(){
  const t0=Date.now();
  const d=await apiCall('get-manager-today-view', {}, 60000);
  if(d && d.timings) console.log('[today-view] round trip '+(Date.now()-t0)+' ms; server stages (ms):', d.timings);
  return d||{};
}
function applyTodayView(d){
  state.beds = d.beds||[]; state.sessions=d.sessions||[]; state.exceptions=d.exceptions||[];
  state.harvestReady=d.harvestReady||[]; state.queueByBed=d.queueByBed||{}; state.workers=d.workers||[];
  state.activityCatalog=d.activityCatalog||[];
  state.todayById={}; state.beds.forEach(b=>{ state.todayById[b.id]=b; });
  state.todayError=''; state.lastSync=new Date();
}
/* Overlapping loads are coalesced: while one is running, any further loadToday() call (a Refresh tap, or a write action
 * that wants fresh data afterwards) queues exactly ONE follow-up run and awaits it, so callers still get data read after
 * their change, but the server never has several of these heavy requests running at once. */
let _loadRun=null, _loadAgain=false;
function loadToday(){
  if(_loadRun){ _loadAgain=true; return _loadRun; }
  _loadRun=(async()=>{ do{ _loadAgain=false; await loadTodayOnce(); } while(_loadAgain); })().finally(()=>{ _loadRun=null; });
  return _loadRun;
}
async function loadTodayOnce(){
  ui.loading=true; state.todayPending=true; render();
  // The bed data is applied the moment it arrives. It no longer waits for the cohort board and assignment queue,
  // which load in parallel and are not needed to open a bed.
  const todayP = fetchTodayView().then(
    d=>{ applyTodayView(d); return d; },
    e=>{ state.todayError=(e&&e.message)||'request failed'; throw e; }
  ).finally(()=>{ state.todayPending=false; render(); });
  const [today, board, aq] = await Promise.allSettled([ todayP, loadCohortBoard(), loadAssignmentQueue() ]);
  ui.loading=false;
  setConn(IS_DEMO?'demo':'online'); render();
  if(today.status==='rejected') toast(today.reason.message);
  else if(board.status==='rejected') toast('Cohort board: '+board.reason.message);
  else if(aq.status==='rejected') toast('Assignment queue: '+aq.reason.message);
}

/* ============================== COHORT BOARD: COHORT_PRODUCTION -> BEDS ==============================
 * get-cohort-board (AssignmentEngine.gs getCohortBoard) returns COHORT_PRODUCTION rows where
 * Location_ID is not blank, Cohort_Status is not CANCELLED and Planning_Year = ui.year, plus the
 * BED_MASTER grid. Location_ID is parsed here and the cohort tile is placed on the matching bed.
 * Accepted forms: B1-04 / BLK1-04 / BLOCK1-04 -> Block 1, Bed 04;  Z5-03 / ZONE5-03 -> Zone 5, Bed 03.
 * No stage math here: Current_Stage and Cohort_Status are displayed exactly as the backend sends them. */
/* Bed-map filters count BEDS (physical locations). Crop-lifecycle counts belong on the production dashboard. */
const FILTERS = [['ALL','All'],['OCCUPIED','Occupied'],['PROPOSED','Proposed'],['AVAILABLE','Available'],['UNVERIFIED','Not verified'],['POST_HARVEST','Post-harvest'],['EXCEPTION','Exceptions']];
/* A bed is in exactly one of three states: OCCUPIED (a cohort has this Location_ID in COHORT_PRODUCTION),
 * PROPOSED (no cohort placed, but the assignment engine has reserved it as a recommendation in
 * COHORT_ASSIGNMENT_QUEUE, awaiting manager approval), or AVAILABLE (neither). PROPOSED is display only:
 * nothing is written to COHORT_PRODUCTION until the manager approves. */
const PROPOSED_FILL = '#FBEBD6';
const UNVERIFIED_FILL = '#E4E0EE';   /* BED_MASTER.Bed_Status never initialised - physical readiness not yet verified by a manager */
const POST_HARVEST_FILL = '#F1DFA8';   /* cohort-less bed in bed-level post-harvest turnover (BED_STATUS_RULES R14) */
const DARK_FILLS = ['#2E7D32','#7C8B98','#B3261E','#C77700','#5B8FC9'];
function parseLocationId(id){
  const t=String(id==null?'':id).trim().toUpperCase().replace(/\s+/g,'');
  let m=t.match(/^(?:BLK|BLOCK|B)(\d+)-(\d+)$/);
  if(m) return { kind:'BLOCK', group:+m[1], bed:+m[2], label:'Block '+(+m[1]) };
  m=t.match(/^(?:ZONE|Z)(\d+)-(\d+)$/);
  if(m) return { kind:'ZONE', group:+m[1], bed:+m[2], label:'Zone '+(+m[1]) };
  return null;
}
const locKey = p => p.kind+p.group+'-'+p.bed;
function cohortStage(c){
  const cs=String(c.cohortStatus||'').toUpperCase(), st=String(c.currentStage||'').toUpperCase();
  if(cs==='TERMINATED') return 'TERMINATED';
  if(cs==='COMPLETE') return 'HARVEST_COMPLETE';
  return st || (cs==='PRE_PLANTING' ? 'PRE_PLANTING' : '');
}
const isLive = c => !['TERMINATED','COMPLETE','CANCELLED'].includes(String(c.cohortStatus||'').toUpperCase());
const cohortStart = c => c.actualDob||c.plannedDob||'9999';
// A bed is a timeline: show the earliest LIVE cohort (the one in the bed now), else the latest finished one.
function pickCohort(list){ if(!list||!list.length) return null; const live=list.filter(isLive); return live.length ? live.slice().sort((a,b)=>cohortStart(a).localeCompare(cohortStart(b)))[0] : list[list.length-1]; }
async function loadCohortBoard(){
  let d;
  try{ d = await apiCall('get-cohort-board', { year: ui.year }); }
  catch(e){ state.board.error = (e.code?('['+e.code+'] '):'')+e.message; throw e; }
  state.board.error = '';
  const cohorts=(d&&d.cohorts)||[], byKey={}, unplaced=[];
  cohorts.forEach(c=>{ const p=parseLocationId(c.locationId); if(!p){ unplaced.push(c); return; } (byKey[locKey(p)]=byKey[locKey(p)]||[]).push(c); });
  state.board = { error:'', loaded:true, year:ui.year, beds:(d&&d.beds)||[], cohorts, byKey, unplaced, stats:(d&&d.stats)||{} };
}
function gridBeds(){
  return state.board.beds.length ? state.board.beds.map(x=>({ id:x.bedId, blockId:x.blockId, locationType:x.locationType })) : state.beds;
}
/* Proposals keyed by normalised bed id (same parser as the grid, so 'B1-10' / 'BLK1-10' / 'B1-010' all agree).
 * Source: get-assignment-queue -> proposed[] (Status PROPOSED, cohort still unassigned). Exceptions carry no bed. */
function bedKey(id){ const p=parseLocationId(id); return p ? locKey(p) : String(id==null?'':id).trim().toUpperCase(); }
function proposalIndex(){
  const src=state.aq.proposed||[];
  if(proposalIndex._src===src && proposalIndex._map) return proposalIndex._map;
  const m={};
  src.forEach(p=>{ if(!String(p.recommendedBed||'').trim()) return; (m[bedKey(p.recommendedBed)]=m[bedKey(p.recommendedBed)]||[]).push(p); });
  Object.keys(m).forEach(k=>m[k].sort((a,b)=>String(a.plannedDob).localeCompare(String(b.plannedDob))||String(a.cohortId).localeCompare(String(b.cohortId))));
  proposalIndex._src=src; proposalIndex._map=m; return m;
}
/* UNVERIFIED = BED_MASTER.Bed_Status never initialised. It says nothing about the bed's history; it means no manager has attested the bed is physically ready. */
function bedState(v){ return v.cohortId ? 'OCCUPIED' : (v.postHarvest&&v.postHarvest.bedLevel ? 'POST_HARVEST' : (String(v.bedStatus||'').toUpperCase()==='UNVERIFIED' ? 'UNVERIFIED' : (v.proposals&&v.proposals.length ? 'PROPOSED' : 'AVAILABLE'))); }
function bedView(b){
  const v = Object.assign({}, state.todayById[b.id]||{}, { id:b.id, blockId:b.blockId, locationType:b.locationType||(state.todayById[b.id]||{}).locationType||'' });
  v.proposals = proposalIndex()[bedKey(b.id)] || [];
  if(!state.board.loaded) return v;
  const p=parseLocationId(b.id), c = p ? pickCohort(state.board.byKey[locKey(p)]) : null;
  if(c){
    Object.assign(v, { cohortId:c.cohortId, cropId:c.cropId, cropName:c.cropName, shortfall:!!c.shortfall, cohortStatus:c.cohortStatus, currentStage:cohortStage(c),
      plannedDob:c.plannedDob||'', plantingDate:c.actualDob||'', harvestWindow:(c.harvestWindowStart||c.harvestWindowEnd)?((c.harvestWindowStart||'?')+' → '+(c.harvestWindowEnd||'?')):'' });
  }else{
    Object.assign(v, { cohortId:'', cropId:'', cropName:'', cohortStatus:'', currentStage:'', plannedDob:'', plantingDate:'', harvestWindow:'' });
  }
  return v;
}
function bedViewById(id){ const b=gridBeds().find(x=>x.id===id); return b?bedView(b):null; }
function bedSearchHit(v){
  const q=(ui.bedSearch||'').trim().toLowerCase(); if(!q) return true;
  return q.split(/\s+/).every(t=>[v.id,v.blockId,v.cropName,v.cropId,v.cohortId,v.bedStatus,v.locationType,v.currentStage,v.cohortStatus].join(' ').toLowerCase().includes(t));
}
function bedMatches(v){
  if(!bedSearchHit(v)) return false;
  if(ui.filter==='ALL') return true;
  if(ui.filter==='EXCEPTION') return bedExceptions(v.id).some(x=>x.status!=='RESOLVED');
  if(ui.filter==='OCCUPIED') return bedState(v)==='OCCUPIED';
  if(ui.filter==='PROPOSED') return bedState(v)==='PROPOSED';
  if(ui.filter==='AVAILABLE') return bedState(v)==='AVAILABLE';
  if(ui.filter==='UNVERIFIED') return bedState(v)==='UNVERIFIED';
  if(ui.filter==='POST_HARVEST') return bedState(v)==='POST_HARVEST';
  return true;
}
function filterCounts(views){
  const n={ ALL:views.length, OCCUPIED:0, PROPOSED:0, AVAILABLE:0, UNVERIFIED:0, POST_HARVEST:0, EXCEPTION:0 };
  views.forEach(v=>{
    n[bedState(v)]++;
    if(bedExceptions(v.id).some(x=>x.status!=='RESOLVED')) n.EXCEPTION++;
  });
  return n;
}
function setFilter(k){ ui.filter=k; render(); }
function setYear(y){ ui.year=+y; loadToday(); }
function boardNotice(views){
  const b=state.board; if(!b.loaded) return '';
  const gridKeys=new Set(gridBeds().map(x=>{ const p=parseLocationId(x.id); return p?locKey(p):x.id; }));
  const orphans=b.cohorts.filter(c=>{ const p=parseLocationId(c.locationId); return !p || !gridKeys.has(locKey(p)); });
  const placed=views.filter(v=>v.cohortId).length;
  if(orphans.length) return `${orphans.length} cohort(s) have a Location_ID that matches no bed: ${orphans.slice(0,6).map(c=>esc(c.cohortId+' → '+c.locationId)).join(', ')}${orphans.length>6?'…':''}`;
  if(!b.cohorts.length){
    const un=b.stats&&b.stats.unassigned, tot=b.stats&&b.stats.yearRows;
    const np=views.filter(v=>bedState(v)==='PROPOSED').length;
    return `No cohorts in ${ui.year} have a Location_ID yet${tot!=null?` (${tot} cohort rows in COHORT_PRODUCTION, ${un!=null?un:tot} unassigned)`:''}. ${np?`${np} bed${np===1?' is':'s are'} reserved as proposals awaiting approval - `:''}Open “Assignments” to review the recommended beds.`;
  }
  return '';
}

/* ==================== ASSIGNMENT ENGINE WRITE-BACK ACTIONS ====================

/* Bed assignment is a proposal/approval workflow: BedAssignmentEngine.gs recommends a bed for every

async function doApproveBatch(ids){
  if(!ids||!ids.length) return;
  if(!confirm('Approve '+ids.length+' recommended assignments?')) return;
  let ok=0, failed=0;
  for(let i=0;i<ids.length;i+=APPROVE_CHUNK){
    toast('Approving '+Math.min(i+APPROVE_CHUNK,ids.length)+' of '+ids.length+'…');

    catch(e){ failed+=ids.length-i; break; }

function mapSVG(){
  const cols=BEDS_PER_ROW, cw=84, ch=58, gap=6, blockGap=26;
  const grid=gridBeds();
  const blocks=[...new Set(grid.map(b=>b.blockId))];
  let svg='', curY=16;
  blocks.forEach(blk=>{
    const beds=grid.filter(b=>b.blockId===blk), rows=Math.ceil(beds.length/cols);
    svg += `<text class="blocklabel" x="10" y="${curY-5}">${esc(blk)}</text>`;
    beds.forEach((b,idx)=>{
      const v=bedView(b), match=bedMatches(v), st=bedState(v), has=st==='OCCUPIED', prop=st==='PROPOSED', ph=st==='POST_HARVEST', pr=prop?v.proposals[0]:null;
      const col=idx%cols, row=Math.floor(idx/cols), bx=10+col*(cw+gap), by=curY+row*(ch+gap);
      const exc=bedExceptions(v.id).some(x=>x.status!=='RESOLVED'), hr=state.harvestReady.some(h=>h.bedId===v.id), sess=bedSessions(v.id).length;
      const qf=bedFill(v), fill=has?qf:(ph?POST_HARVEST_FILL:st==='UNVERIFIED'?UNVERIFIED_FILL:ui.overlay==='queue'?(qf!=='transparent'?qf:(prop?PROPOSED_FILL:qf)):(prop?PROPOSED_FILL:'#EEE')), tc=DARK_FILLS.includes(fill)?'#fff':'#1B1B18';
      const bedNo=esc(String(v.id).split('-')[1]||v.id);
      svg += `<g class="badge" opacity="${match?1:0.28}">
        <rect class="bed ${prop?'proposed':''} ${ui.selectedBed===v.id?'selected':''}" data-bed="${esc(v.id)}" x="${bx}" y="${by}" width="${cw}" height="${ch}" rx="6" fill="${fill}"></rect>
        <text x="${bx+6}" y="${by+11}" font-size="8" font-weight="700" fill="${tc}" opacity=".7">${bedNo}</text>
        ${has&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(v.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(v.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">${esc((v.currentStage||v.cohortStatus||'').replace(/_/g,' '))}</text>`:''}
        ${prop&&match?`<text x="${bx+cw/2}" y="${by+29}" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${esc(pr.cohortId)}</text>
        <text x="${bx+cw/2}" y="${by+41}" text-anchor="middle" font-size="9" font-weight="600" fill="${tc}">${esc(String(pr.cropName||'').slice(0,13))}</text>
        <text x="${bx+cw/2}" y="${by+52}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">PROPOSED${v.proposals.length>1?' +'+(v.proposals.length-1):''}</text>`:''}
        ${!has&&!prop&&match?`<text x="${bx+cw/2}" y="${by+(ph&&(v.postHarvest.openSteps||[]).length?30:36)}" text-anchor="middle" font-size="8" font-weight="700" fill="${tc}">No crop assigned</text>
        ${ph&&(v.postHarvest.openSteps||[]).length?`<text x="${bx+cw/2}" y="${by+44}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${tc}" opacity=".85">${(v.postHarvest.openSteps||[]).length} open</text>`:''}`:''}
        ${sess?`<circle cx="${bx+cw-7}" cy="${by+7}" r="4" fill="#1F3A2E"></circle>`:''}
        ${exc?`<circle cx="${bx+cw-19}" cy="${by+7}" r="4" fill="var(--danger)"></circle>`:''}
        ${hr?`<circle cx="${bx+cw-7}" cy="${by+ch-7}" r="4" fill="var(--ok)"></circle>`:''}
      </g>`;
    });
    curY += rows*(ch+gap) + blockGap;
  });
  const W=10+cols*(cw+gap);
  return `<svg viewBox="0 0 ${W} ${curY}" width="${W}" height="${curY}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;">${svg}</svg>`;
}

/**
 * Manager write-back actions, gated on Cohort_Status - these call
 * AssignmentEngine.gs only (assignBed / verifyPlanting / moveCohort /
 * completeCohort / terminateCohort). No crop-day or stage math happens here;
 * this board only ever displays what the backend already computed.

function confidenceOf(p){ return (p.reasons||[]).some(r=>String(r).startsWith('⚠')) ? ['Review needed','chip-warn'] : ['Match','chip-ok']; }
/* An unoccupied bed is either PROPOSED (the engine reserved it in COHORT_ASSIGNMENT_QUEUE, awaiting approval) or
 * AVAILABLE. A proposal is labelled as pending and never presented as something this bed has: the bed is not
 * occupied and nothing is written to COHORT_PRODUCTION until a manager approves it in Assignments. */
function proposalCards(b){
  return b.proposals.map(p=>{ const cf=confidenceOf(p); return `<div class="card proposal"><div class="plabel">Pending assignment</div>
      <div class="row"><span>Pending</span><span>${esc(p.cropName)} ${esc(p.cohortId)}</span></div>
      <div class="row"><span>Planting</span><span>${esc(p.plannedDob||'—')}</span></div>
      <div class="row"><span>Confidence</span><span><span class="chip ${cf[1]}">${cf[0]}</span></span></div>
      <div class="qsub" style="margin-top:4px;">Approval required</div>
      <button class="btn btn-primary" style="margin:8px 0 0;" onclick="openQueue('proposed','${esc(p.cohortId)}')">Review Assignment</button></div>`; }).join('');
}
function pendingBlock(b, occupied){

  return `<h2 style="font-size:13px;margin:14px 0 6px;">${occupied?'Next in this bed (proposed)':'Pending assignment'}</h2>
    <div class="note" style="margin-top:0;">Proposals only. Nothing is assigned to ${esc(b.id)} until a manager approves it in Assignments.</div>${proposalCards(b)}`;

/* ============================== ACTIONS & LIVE TASKS (Bed Profile command center) ==============================
 * Every activity a manager can dispatch is reachable from one panel, grouped into four working categories.
 * The category is only a filter over the live ACTIVITY_REFERENCE catalog (Activity_Domain / Post_Harvest_Sequence);
 * what a bed may actually start is still decided by startableActivities() here and validateActivity_ on the server. */
const ACTION_CATS=[['ALL','All'],['PREP','Soil & Bed Prep'],['CARE','Crop Maintenance'],['HARVEST','Harvest Operations'],['POST','Post-Harvest & Sanitation']];
function actCatOf(a){
  if(Number(a.postHarvestSequence)>0) return 'POST';
  const d=String(a.domain||'').trim().toLowerCase();
  if(d==='prep'||d==='planting') return 'PREP';
  if(d==='cropcare'||d==='state') return 'CARE';
  if(d==='harvest') return 'HARVEST';
  if(['field cleanup & prep','cover cropping','next-season prep','post-harvest'].indexOf(d)!==-1) return 'POST';
  return 'OTHER';   /* shown under All only */
}
function actState(){ if(!ui.act) ui.act={cat:'ALL',activity:'',workerId:''}; return ui.act; }
function setActCat(k){ const a=actState(); a.cat=k; a.activity=''; render(); }
function setActActivity(n){ actState().activity=n; render(); }
function setActWorker(id){ actState().workerId=id; render(); }
async function assignTask(bedId){
  const a=actState(), w=a.workerId;
  if(!a.activity){ toast('Choose an activity first.'); return; }
  if(!w){ toast(state.workers.length?'Choose a worker first.':'No workers are available to assign.'); return; }
  const act=a.activity; a.activity='';
  await startSessionFor(bedId, act, w);
}
/* "ACT_018: Harvest" when the backend sends the Activity_ID (catalog id / session activityId), else just the name. */
function actLabel(name,s){
  const c=(state.activityCatalog||[]).find(x=>x.name===name);
  const id=(s&&s.activityId)||(c&&(c.id||c.activityId))||'';
  return id ? id+': '+name : name;
}
/* Pending = manager dispatched, worker has not started. In progress = worker's clock is running (or paused / has an exception). */
function taskStatus(s){
  const k=String(s.status||'').toUpperCase();
  if(k==='ASSIGNED') return ['Pending','chip-warn'];
  if(k==='ACTIVE') return ['In progress','chip-ok'];
  if(k==='PAUSED') return ['In progress · paused','chip-warn'];
  if(k==='EXCEPTION') return ['In progress · exception','chip-danger'];
  if(k==='COMPLETED') return ['Complete','chip-neutral'];
  return [k||'Unknown','chip-neutral'];
}
function fmtTs(v){ if(!v) return ''; const d=new Date(v); return isNaN(d.getTime()) ? String(v) : d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function taskTimes(s){
  return { dispatched: s.assignedTime||s.assignedAt||s.dispatchedAt||s.createdAt||'', started: s.startTime||s.startedAt||s.start||'' };
}
function liveTaskBlock(b,sess){
  const recent=((b&&b.activityLog)||[]).slice(0,2);
  const cards=sess.map(s=>{
    const st=taskStatus(s), t=taskTimes(s), pending=String(s.status||'').toUpperCase()==='ASSIGNED';
    const who=(s.workerName||s.workerId||'Unassigned')+((s.workerName&&s.workerId)?' ('+s.workerId+')':'');
    return `<div class="card"><div class="task-title">${esc(actLabel(s.activity,s))}</div>
      <div class="row"><span>Status</span><span><span class="chip ${st[1]}">${esc(st[0])}</span></span></div>
      <div class="row"><span>Assigned to</span><span>${esc(who)}</span></div>
      ${t.dispatched?`<div class="row"><span>Dispatched</span><span>${esc(fmtTs(t.dispatched))}</span></div>`:''}
      <div class="row"><span>Started</span><span>${pending?'Waiting for worker to start':esc(fmtTs(t.started)||'—')}</span></div>
      <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'reassign'})">Reassign</button>
      <button class="btn btn-outline" onclick="openModal('reassign',{sessionId:'${esc(s.id)}',mode:'close'})">Close &amp; new</button></div>`;
  }).join('');
  const done=recent.map(r=>`<div class="row"><span>${esc(actLabel(r.taskType||r.activityName||''))} · ${esc(r.workerName||r.workerId||'')}</span><span><span class="chip chip-neutral">Complete</span> ${esc(fmtTs(r.endTime))}</span></div>`).join('');
  return `<h2 style="font-size:13px;margin:14px 0 6px;">Live tasks</h2>
    ${cards||`<div class="empty" style="padding:10px 0;">No task is assigned or running on this bed.</div>`}
    ${done?`<div class="qsub" style="margin:8px 0 2px;font-weight:700;">Recently completed</div>${done}`:''}`;
}
/* Verify & close: only the verifications this bed is actually waiting on. Each calls the existing manager action. */
function verifyCloseBlock(b){
  const cs=String(b.cohortStatus||'').toUpperCase(), btns=[], notes=[];
  const hr=(state.harvestReady||[]).find(h=>h.bedId===b.id);
  if(cs==='PRE_PLANTING') btns.push(`<button class="btn btn-primary" onclick="openModal('verify-planting',{cohortId:'${esc(b.cohortId)}',bedId:'${esc(b.id)}'})">Verify planting</button>`);
  if(b.cohortId && hr) btns.push(`<button class="btn btn-primary" onclick="verifyHarvestReady('${esc(b.cohortId)}','${esc(b.id)}')">Verify harvest ready</button>`);
  if(b.postHarvest && b.postHarvest.readyToVerify){
    const scope=b.postHarvest.bedLevel?'BED:'+b.id:b.cohortId;
    btns.push(`<button class="btn btn-primary" onclick="doVerifyTurnover('${esc(scope)}','${esc(b.id)}')">Verify bed ready</button>`);
  }
  if(String(b.bedStatus||'').toUpperCase()==='BLOCKED') btns.push(`<button class="btn btn-primary" onclick="doVerifyBedReady('${esc(b.id)}')">Clear block &amp; verify bed ready</button>`);
  if(b.cohortId && (hr || cs==='WAITING_NEXT_PICK')) notes.push('Harvest is completed by terminating the cohort (ACT_053 TerminateCohort), which opens post-harvest turnover for this bed.');
  return `<div class="qsub" style="font-weight:700;margin:12px 0 6px;">Verify &amp; close</div>
    ${btns.join('')||'<div class="note" style="margin-top:0;">Nothing is waiting for your verification on this bed.</div>'}
    ${notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}`;
}
/* ============ BED PROFILE = MINI DISPATCH CENTER ============
 * 1 Required workflow  - what must happen before the bed can be AVAILABLE (lifecycle; read-only status, no assign buttons)
 * 2 Assign work        - the manager's dispatch tool: pick activities, pick workers per activity, pick a date
 * 3 Active work        - reality: who is doing what, and its status
 * Model: BED x ACTIVITY x WORKER is many-to-many. One FIELD_LIVE_SESSION row = one (bed, activity, worker) assignment. */
function sessStatusChip(s){ const t=taskStatus(s); return `<span class="chip ${t[1]}">${esc(t[0])}</span>`; }
function schedLabel(s){ const d=s.scheduledDate; if(!d) return ''; return d===todayISO()?'Today':d; }
/* ---------- inline dispatch sidebar state (per bed) ---------- */
function dpS(b){ if(!ui.dp||ui.dp.bedId!==b.id) ui.dp={bedId:b.id,acts:[],workers:[],custom:{},date:todayISO(),q:'',result:null,busy:false}; return ui.dp; }
function dpBed(){ return (state.beds||[]).find(x=>x.id===(ui.dp||{}).bedId)||{}; }
function dpCrew(a){ const d=ui.dp; return d.custom[a]||d.workers; }
function dpRows(b){   /* every row the manager can see for this bed, grouped by Activity_Domain */
  const cat=state.activityCatalog||[], sess=bedSessions(b.id), p=b.postHarvest, rows=[], seen={};
  const meta=n=>cat.find(c=>c.name===n)||{};
  const live=n=>{ const l=sess.filter(q=>q.activity===n); return l.some(q=>['ACTIVE','PAUSED','EXCEPTION'].includes(String(q.status||'').toUpperCase()))?'IN PROGRESS':l.length?'ASSIGNED':''; };

async function submitMultiAssign(){

    if(d.result.created.length) toast(d.result.created.length+' task'+(d.result.created.length===1?'':'s')+' assigned.');

/* Approval dashboard: turns the queue row's Reason lines into the four validation checks the manager needs to see. */
const VCHECKS=[['Approved block',/approved for|crop_block_map|block rule/i],['Planting window',/window/i],['Bed availability',/bed free|occupied|overlap|conflict|not free/i],['Rotation',/rotation/i]];
function validationChecks(p){
  let lines=p.reasons||[]; if(typeof lines==='string') lines=lines.split('\n');
  lines=lines.map(x=>String(x).trim()).filter(Boolean);
  const used=new Set();
  const cells=VCHECKS.map(([label,re])=>{
    const i=lines.findIndex((l,idx)=>!used.has(idx)&&re.test(l));
    if(i<0) return {label,state:'none',detail:'Not checked'};
    used.add(i); const l=lines[i];
    return {label,state:/^(⚠|✗|✖|!)/.test(l)?'w':'ok',detail:l.replace(/^[✓✔⚠✗✖!]\s*/,'')};
  });
  const extra=lines.filter((l,idx)=>!used.has(idx));
  return {cells,extra};
}
function checkGrid(p){
  const v=validationChecks(p);
  return `<div class="vgrid">${v.cells.map(c=>`<div class="vcell ${c.state==='none'?'':c.state}"><div class="vh"><span>${esc(c.label)}</span><span class="chip ${c.state==='ok'?'chip-ok':c.state==='w'?'chip-warn':'chip-neutral'}">${c.state==='ok'?'✓ Pass':c.state==='w'?'⚠ Review':'—'}</span></div><div class="vd">${esc(c.detail)}</div></div>`).join('')}</div>`
    + (v.extra.length?`<ul class="checks">${v.extra.map(r=>`<li class="${/^(⚠|✗)/.test(r)?'w':'ok'}">${esc(r)}</li>`).join('')}</ul>`:'');
}
function reasonList(p){ return `<ul class="checks">${(p.reasons||[]).map(r=>`<li class="${String(r).startsWith('⚠')?'w':'ok'}">${esc(r)}</li>`).join('')}</ul>`; }
function cohortHead(p){ return `<div class="qtop"><div><b>${esc(p.cropName)}</b><div class="qsub">Wave ${esc(p.waveNumber)} · ${esc(p.cohortId)}</div></div><div class="qdates">DOB ${esc(p.plannedDob)}<br>ends ${esc(p.endDate||'—')}</div></div>`; }
/* Physical-bed gate on a recommendation (BED_STATUS_RULES R15 / Key Principle 4). The server's "Bed availability" check only looks
 * for other cohorts on the calendar; it says nothing about whether the bed is physically usable. So the card checks Bed_Status:
 *   AVAILABLE              -> approvable
 *   POST-HARVEST ACTIVITIES-> approvable (will be Available once steps are done and the manager verifies; planting waits for that)
 *   UNVERIFIED / BLOCKED / occupied -> NOT approvable until the manager verifies the bed / clears the block. */
function recBedGate(p){
  const b=(state.beds||[]).find(x=>x.id===p.recommendedBed); if(!b) return {ok:true,st:'',msg:''};
  const st=String(b.bedStatus||'').toUpperCase()||'UNVERIFIED';
  if(st==='AVAILABLE') return {ok:true,st,msg:'Bed is verified Available.'};
  if(st==='POST-HARVEST ACTIVITIES') return {ok:true,st,msg:'Bed is in post-harvest. It must be verified Available before planting.'};
  if(st==='UNVERIFIED') return {ok:false,st,msg:'Bed has not been verified physically ready. Verify it (or change the bed) before approving.'};
  if(st==='BLOCKED') return {ok:false,st,msg:'Bed is blocked. Clear the block and verify it first.'};
  return {ok:false,st,msg:'Bed is '+st.toLowerCase()+' and not free for a new cohort.'};
}
function proposedList(){

  const groups={}; list.forEach(p=>{ const g=p.blockId||'Unplaced'; (groups[g]=groups[g]||[]).push(p); });
  return Object.keys(groups).sort().map(g=>{ const items=groups[g];
    return `<div class="qgh"><span><b>${esc(g)}</b> · ${items.length}</span><button class="btn btn-outline" style="width:auto;margin:0;padding:5px 10px;font-size:12px;" ${(()=>{const okIds=items.filter(p=>recBedGate(p).ok).map(p=>p.cohortId); return okIds.length?`onclick="doApproveBatch(${esc(JSON.stringify(okIds))})">Approve ${okIds.length===items.length?'all ':'verified '}${okIds.length}`:`disabled title="No bed in this block is verified yet.">Approve 0 (beds not verified)`;})()}</button></div>`
      + items.map(p=>`<div id="qc-${esc(p.cohortId)}" class="card ${(p.reasons||[]).some(r=>String(r).startsWith('⚠'))?'qwarn':''} ${ui.focusCohort===p.cohortId?'qfocus':''}">${cohortHead(p)}

/* ---- Total labor hours ---- */
function lbYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lbRange(days){ const to=new Date(), from=new Date(); from.setDate(from.getDate()-(days-1)); return { from:lbYmd(from), to:lbYmd(to) }; }
const lbHM=m=>{ const t=Math.round(m); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const lbDec=m=>(Math.round(m/60*100)/100).toFixed(2);
function openLabor(){ const r=lbRange(7); openModal('labor',{ from:r.from, to:r.to, preset:'7', view:'worker', loading:true, error:'', sessions:null, missing:0 }); lbLoad(); }
async function lbLoad(){
  const d=ui.modalDraft, n=++lbLoad._n; if(d.view==='budget'){ lbBudgetLoad(); return; } d.loading=true; d.error=''; render();
  try{
    const r=await apiCall('get-labor-hours',{ from:d.from||'', to:d.to||'' }, 60000);
    if(ui.modalDraft!==d||n!==lbLoad._n) return;
    d.sessions=r.sessions||[]; d.missing=r.missingElapsed||0; d.sKey=d.from+'|'+d.to;
  }catch(e){ if(ui.modalDraft!==d||n!==lbLoad._n) return; d.error=e.message; d.sessions=null; }
  d.loading=false; if(ui.modal==='labor'&&ui.modalDraft===d) render();
}
lbLoad._n=0;
function lbPreset(p){
  const d=ui.modalDraft; d.preset=p;
  if(p==='all'){ d.from=''; d.to=''; } else if(p==='7'||p==='30'){ const r=lbRange(Number(p)); d.from=r.from; d.to=r.to; }
  lbLoad();
}
function lbDate(which,v){ const d=ui.modalDraft; d[which]=v; d.preset='custom'; lbLoad(); }
function lbView(v){ const d=ui.modalDraft; d.view=v; if(v==='budget') lbBudgetLoad(); else if(d.sKey!==d.from+'|'+d.to) lbLoad(); render(); }
/* Vs budget: labor hours ALLOWED by the labor matrix (LaborBudget.gs) against the human hours actually recorded, same date range. Advisory only. */
async function lbBudgetLoad(){
  const d=ui.modalDraft, n=++lbBudgetLoad._n; d.bLoading=true; d.bError=''; render();
  try{
    const p={from:d.from||'',to:d.to||''}; if(!d.from&&!d.to) p.all=true;
    const r=IS_DEMO?{rows:[],over:0,within:0,blocksMissingAcres:[]}:await apiCall('get-labor-budget',p,60000);
    if(ui.modalDraft!==d||n!==lbBudgetLoad._n) return;
    d.budget=r;
  }catch(e){ if(ui.modalDraft!==d||n!==lbBudgetLoad._n) return; d.bError=e.message; d.budget=null; }
  d.bLoading=false; if(ui.modal==='labor'&&ui.modalDraft===d) render();
}
lbBudgetLoad._n=0;
function lbBudgetBody(d){
  if(d.bError) return `<div class="error">${esc(d.bError)}</div>`;
  if(d.bLoading&&!d.budget) return `<div class="note" style="margin-top:0;">Loading budgets\u2026</div>`;
  const b=d.budget||{rows:[]}, rows=(b.rows||[]).slice(), miss=b.blocksMissingAcres||[];
  const rank={OVER:0,WITHIN:1,UNAVAILABLE:2};
  rows.sort((x,y)=>rank[x.status]-rank[y.status]||(y.overMinutes-x.overMinutes)||String(x.activity).localeCompare(String(y.activity))||String(x.block).localeCompare(String(y.block)));
  if(!rows.length) return `<div class="note" style="margin-top:0;">No completed work with a labor budget in this period.</div>`;
  const hm=h=>h==null?'':lbHM(h*60), sg=h=>(h>0?'+':h<0?'-':'')+lbHM(Math.abs(h)*60);
  const tr=rows.map(r=>{ const has=r.status==='OVER'||r.status==='WITHIN', over=r.status==='OVER';
    const badge=over?`<span class="chip" style="background:var(--danger);color:#fff;">${esc(r.label)}</span>`:(has?`<span class="chip chip-ok">${esc(r.label)}</span>`:'');
    return `<tr><td>${esc(r.activity)}</td><td>${esc(r.block)}</td><td class="num">${has?hm(r.budgetHours):''}</td><td class="num">${hm(r.actualHours)}</td><td class="num" ${over?'style="color:var(--danger);font-weight:700;"':''}>${has?sg(r.varianceHours)+' ('+(r.variancePct>0?'+':'')+r.variancePct+'%)':''}</td><td>${badge}</td></tr>`; }).join('');
  const note=`<p class="lb-note">Budget is the labor time allowed for the work (per acre, per run, or per 100 lb harvested). Actual is the recorded human time from completed sessions, all workers added together. A minus variance means the work took less time than budgeted. Advisory only: budgets never limit or change field work. Rows with no budget (no acreage, weight or run data) show actual time only.${miss.length?` No acreage on file for ${miss.map(esc).join(', ')}: add it to the LABOR_BUDGET_ACREAGE sheet.`:''}</p>`;
  return `<div class="note" style="margin-top:0;"><b>${b.over||0}</b> over budget \u00b7 <b>${b.within||0}</b> within</div><div class="tm-wrap"><table class="tm-t"><thead><tr><th>Activity</th><th>Block</th><th class="num">Budget (h:mm)</th><th class="num">Actual (h:mm)</th><th class="num">Variance</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>${note}`;
}

/* Group sessions by two levels; every level carries sessions + minutes. */
function lbGroup(sessions, aKey, aLabel, bKey, bLabel){
  const g={};
  sessions.forEach(s=>{
    const ak=String(aKey(s)), bk=String(bKey(s));
    const a=g[ak]||(g[ak]={label:aLabel(s),n:0,min:0,kids:{}}); a.n++; a.min+=s.minutes;
    const b=a.kids[bk]||(a.kids[bk]={label:bLabel(s),n:0,min:0}); b.n++; b.min+=s.minutes;
  });
  const by=(x,y)=>y.min-x.min||String(x.label).localeCompare(String(y.label));
  return Object.values(g).sort(by).map(a=>Object.assign(a,{kidList:Object.values(a.kids).sort(by)}));
}
function lbGroups(d){
  const S=d.sessions||[];
  return d.view==='activity'
    ? lbGroup(S, s=>s.activity||'(no activity)', s=>s.activity||'(no activity)', s=>s.workerId||'(no worker)', s=>s.worker||s.workerId||'(no worker)')
    : lbGroup(S, s=>s.workerId||'(no worker)', s=>s.worker||s.workerId||'(no worker)', s=>s.activity||'(no activity)', s=>s.activity||'(no activity)');
}
function laborModal(){

    <div class="seg">${[['worker','By worker'],['activity','By activity'],['sessions','All sessions'],['budget','Vs budget']].map(([k,l])=>`<button class="${d.view===k?'active':''}" onclick="lbView('${k}')">${l}</button>`).join('')}</div>

const lbCsvCell=v=>{ let s=String(v==null?'':v); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
function lbCsv(){
  const d=ui.modalDraft, S=d.sessions||[]; if(!S.length) return;
  const total=S.reduce((a,s)=>a+s.minutes,0); let rows;
  if(d.view==='sessions'){

      .concat(S.map(s=>[s.workerId,s.worker,s.activity,s.bedId,s.start,s.end,lbHM(s.minutes),lbDec(s.minutes)]))
      .concat([['Total','','','','','',lbHM(total),lbDec(total)]]);
  } else {

    rows=[[act?'Activity':'Worker', act?'Worker':'Activity','Sessions','Hours (h:mm)','Hours (decimal)']];

}

const PLAN_BLOCKS=['B1','B2','B3','B4','Z5']; // canonical short Block_ID, matches BLOCK_ROTATION_PLAN / BED_PLANTING_PLAN / BED_MASTER Bed_ID prefix
const BLOCK_LABELS={B1:'Block 1',B2:'Block 2',B3:'Block 3',B4:'Block 4',Z5:'Zone 5'};
const PLAN_YEARS=[2027,2028,2029,2030];
const BLOCK_BEDS=55;
const ROTATION_FAMILIES=['Solanaceae','Fast Greens','Brassicas','Roots'];
const FAMILY_TEMPLATES={
  'Roots':[['Carrots',8,'March 1'],['Beets',7,'March 1'],['Turnips',6,'April 1']],
  'Solanaceae':[['Tomatoes',10,'May 1'],['Peppers',8,'May 15']],
  'Fast Greens':[['Lettuce',9,'Feb 15'],['Arugula',6,'Feb 15'],['Spinach',6,'March 1']],
  'Brassicas':[['Broccoli',9,'April 1'],['Kale',7,'April 1'],['Cabbage',6,'April 15']],
  'Perennial':[['Herbs',10,'—']]
};
const rotationOverrides={}, rotationStatusByYear={}, planningPlans={};
function familyForBlockYear(block,year){
  if(block==='Z5') return 'Perennial';
  const n=+block.slice(-1), off=((year-2026)%4+4)%4;
  const rotated= off? ROTATION_FAMILIES.slice(4-off).concat(ROTATION_FAMILIES.slice(0,4-off)) : ROTATION_FAMILIES.slice();
  return rotated[n-1];
}
function rotationFamily(block,year){ return (rotationOverrides[year]&&rotationOverrides[year][block]) || familyForBlockYear(block,year); }
function getRotationStatus(year){ return rotationStatusByYear[year] || (year<=2026?'Approved':'Draft'); }
function prevBlockFor(block,year){
  if(block==='Z5') return 'Z5';
  const fam=rotationFamily(block,year);
  for(const b of PLAN_BLOCKS){ if(b!=='Z5' && familyForBlockYear(b,year-1)===fam) return b; }
  return block;
}
function blockRangeLabel(block,beds){
  if(!beds.length) return '—';
  const n=block==='Z5'?5:+block.slice(-1);
  return 'B'+n+' '+String(beds[0]).padStart(2,'0')+' → B'+n+' '+String(beds[beds.length-1]).padStart(2,'0');
}
function planKey(b,y){ return b+'|'+y; }
function buildPlan(block,year){
  const fam=rotationFamily(block,year), tmpl=FAMILY_TEMPLATES[fam]||FAMILY_TEMPLATES['Roots'];
  let cursor=1; const crops=[];
  tmpl.forEach(([name,count,date])=>{
    const beds=[]; for(let i=0;i<count && cursor<=BLOCK_BEDS;i++,cursor++) beds.push(cursor);
    crops.push({ id:(block+'-'+year+'-'+name).replace(/\s+/g,'').toUpperCase(), cropName:name, family:fam, plantingDate:date,
      bedNums:beds, layoutStatus:'Pending', plantingStatus:'Not planted', harvestStatus:'Not started', plantedBeds:[],
      lastYearBedRange: year>=PLAN_YEARS[0]?blockRangeLabel(prevBlockFor(block,year),beds):'—',
      rotationNote: prevBlockFor(block,year)+' → '+block, harvestWindow: date+' + 45 days' });
  });
  return { crops };
}
function getPlan(block,year){ const k=planKey(block,year); if(!planningPlans[k]) planningPlans[k]=buildPlan(block,year); return planningPlans[k]; }
function cropById(id){ return getPlan(ui.pBlock,ui.pYear).crops.find(x=>x.id===id); }
function cropBedRangeLabel(block,crop){ return blockRangeLabel(block,crop.bedNums); }
function harvestStatusOf(c){ return c.harvestStatus==='Complete'?'Complete':(c.plantingStatus==='Planted'?'In progress':'Not started'); }
function chipClassFor(s){ return {Confirmed:'chip-ok',Planted:'chip-ok',Complete:'chip-ok',Modified:'chip-warn','In progress':'chip-warn',Pending:'chip-neutral','Not planted':'chip-neutral','Not started':'chip-neutral'}[s]||'chip-neutral'; }

function saveModifyLayout(cropId){
  const plan=getPlan(ui.pBlock,ui.pYear), c=plan.crops.find(x=>x.id===cropId); if(!c) return;
  const taken=new Set(); plan.crops.forEach(x=>{ if(x.id!==cropId) x.bedNums.forEach(n=>taken.add(n)); });
  const clash=ui.pSelBeds.filter(n=>taken.has(n));
  if(clash.length){ toast('Beds already assigned to another crop: '+clash.join(', ')); return; }
  if(!ui.pSelBeds.length){ toast('Select at least one bed.'); return; }
  c.bedNums=ui.pSelBeds.slice().sort((a,b)=>a-b); c.layoutStatus='Modified'; ui.pModifying=false;

/* Loaded from BLOCK_ROTATION_PLAN by get-rotation-plan (RotationAPI.gs). Falls back to the built-in default pattern for any year
 * that has no saved rows. rotationOverrides[year][block] holds the editor's short family name ('Solanaceae', 'Roots', ...). */
const rotLoad={done:false,busy:false,tried:false,saving:false,err:'',families:[]};
async function loadRotationPlan(){
  if(rotLoad.busy) return; rotLoad.busy=true; rotLoad.tried=true; rotLoad.err='';
  try{
    const d=await apiCall('get-rotation-plan',{});
    rotLoad.families=d.families||[];
    Object.keys(rotationOverrides).forEach(k=>delete rotationOverrides[k]);
    Object.keys(rotationStatusByYear).forEach(k=>delete rotationStatusByYear[k]);
    (d.rows||[]).forEach(r=>{ if(r.blockId==='Z5'||!r.familyKey) return; (rotationOverrides[r.year]=rotationOverrides[r.year]||{})[r.blockId]=r.familyKey; });
    Object.keys(d.statusByYear||{}).forEach(y=>{ rotationStatusByYear[y]=d.statusByYear[y]; });
    rotLoad.done=true;
  }catch(e){ rotLoad.err=e.message||'Could not load the rotation plan.'; }
  finally{ rotLoad.busy=false; render(); }
}
function ensureRotationLoaded(){ if(!rotLoad.tried && !rotLoad.busy) loadRotationPlan(); }

async function saveRotationDraft(){
  if(rotLoad.saving) return;

  finally{ rotLoad.saving=false; render(); }
}
function cancelEditRotation(){ ui.pEditingRotation=false; render(); }
async function approveRotation(){
  if(rotLoad.saving) return;
  if(!confirm('Approve the '+ui.pYear+' rotation plan? This locks BLOCK_ROTATION_PLAN for '+ui.pYear+'. Planting plans are then generated per block from the Bed layout view.')) return;

/* ============================== BED PLAN SHEET (quick deploy of one bed layout to any block) ==============================
 * Bed numbers are identical in every block (B1-01 … B4-55), and crop rotation only changes WHICH block a layout goes to.
 * So this screen keeps ONE editable layout keyed by bed position (1…55) and lets the manager choose the target block:
 *   1. copy a layout from any existing year/block (or start blank), 2. pick the target block + year (bed IDs relabel,
 *   crops and dates stay), 3. tweak any row, 4. Deploy.
 * Deploy only writes beds that differ from what the target block already has, using the existing save-plan-beds action
 * (one call per distinct crop+date), then optionally confirm-plan-rows. No new backend actions are needed. */
const SHEET_BLOCKS=['B1','B2','B3','B4'];
const sh={ init:false, srcYear:2027, srcBlock:'B1', tgtYear:2027, tgtBlock:'B1', rows:[], N:BLOCK_BEDS, names:{}, tgtNow:{}, tgtBeds:null,
  loadingSrc:false, loadingTgt:false, busy:false, progress:'', err:'', msg:null, dirty:false, clearBlank:false, confirmAfter:true,
  range:{from:1,to:10,cropId:'',date:''}, srcNote:'' };
const shIso=v=>{ const s=String(v||''); return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):''; };
const shLeap=y=>y%4===0&&(y%100!==0||y%400===0);
function shToYear(d,y){ if(!d) return ''; let s=y+d.slice(4); if(s.slice(5)==='02-29'&&!shLeap(+y)) s=y+'-02-28'; return s; }
const shPad=n=>String(n).padStart(2,'0');
const shBedId=pos=>sh.tgtBlock+'-'+shPad(pos);
const shPos=bedId=>parseInt(String(bedId).split('-').pop(),10);
function shEnsureRows(n){ for(let i=sh.rows.length;i<n;i++) sh.rows.push({pos:i+1,cropId:'',date:''}); sh.N=Math.max(sh.N,n); }
function shBlankRows(){ sh.rows=[]; shEnsureRows(sh.N); }
function shCropName(id){ const c=((po[sh.tgtYear]||{}).crops||[]).find(x=>x.cropId===id); return (c&&c.cropName)||sh.names[id]||id||''; }
function shCropObj(id){ return ((po[sh.tgtYear]||{}).crops||[]).find(x=>x.cropId===id); }
const shNowCrop=p=>p&&p.cropId&&String(p.cropId).toUpperCase()!=='OPEN'?p.cropId:'';
function shOutside(r){
  const c=shCropObj(r.cropId); if(!c||!(c.windows||[]).length||!r.date) return false;
  const md=r.date.slice(5);
  return !c.windows.some(w=>w.start<=w.end ? (md>=w.start&&md<=w.end) : (md>=w.start||md<=w.end));
}
async function shFetchCtx(y,b,force){
  const k=ppKey(y,b); if(!force&&state.pp[k]&&!state.pp[k].error) return state.pp[k];
  const d=await apiCall('get-planning-context',{year:y,blockId:b}); state.pp[k]=d; return d;
}
async function shLoadCrops(){
  if(po[sh.tgtYear]) return;
  try{ po[sh.tgtYear]=await apiCall('get-planner-options',{year:sh.tgtYear}); }catch(e){ sh.err='Could not load the crop list: '+errMsg(e); }
}
function shInit(){
  sh.srcYear=sh.tgtYear=ui.pYear; sh.srcBlock=sh.tgtBlock=SHEET_BLOCKS.includes(ui.pBlock)?ui.pBlock:'B1';
  shBlankRows(); sh.loadingSrc=sh.loadingTgt=true;
  Promise.all([shLoadCrops(),shLoadTarget(true,true)]).then(()=>shLoadSource(true));
}
async function shLoadTarget(force,noRender){
  const y=sh.tgtYear,b=sh.tgtBlock; sh.loadingTgt=true; if(!noRender) render();
  try{
    const ctx=await shFetchCtx(y,b,force);
    if(y!==sh.tgtYear||b!==sh.tgtBlock) return;          /* user moved on while this was loading */
    sh.tgtNow={}; ((ctx.plan&&ctx.plan.found&&ctx.plan.beds)||[]).forEach(p=>{ sh.tgtNow[p.bedId]=p; if(p.cropId) sh.names[p.cropId]=p.cropName||sh.names[p.cropId]; });
    const pbs=ctx.physicalBeds||[]; sh.tgtBeds=pbs.length?new Set(pbs.map(x=>x.bedId)):null;
    if(pbs.length) shEnsureRows(Math.max(...pbs.map(x=>shPos(x.bedId)).filter(n=>n>0)));
  }catch(e){ if(y===sh.tgtYear&&b===sh.tgtBlock){ sh.tgtNow={}; sh.tgtBeds=null; sh.err='Could not read '+BLOCK_LABELS[b]+' '+y+': '+errMsg(e); } }
  if(y===sh.tgtYear&&b===sh.tgtBlock){ sh.loadingTgt=false; render(); }
}
async function shLoadSource(initial){
  if(!initial&&sh.dirty&&!confirm('Replace the layout you are editing with the one from '+BLOCK_LABELS[sh.srcBlock]+' '+sh.srcYear+'?')) return;
  sh.loadingSrc=true; sh.err=''; sh.msg=null; render();
  try{
    const ctx=await shFetchCtx(sh.srcYear,sh.srcBlock,!initial);
    shBlankRows(); let n=0;
    const beds=(ctx.plan&&ctx.plan.found&&ctx.plan.beds)||[];
    beds.forEach(p=>{ const pos=shPos(p.bedId), id=shNowCrop(p); if(!id||!(pos>0)) return;
      shEnsureRows(pos); sh.rows[pos-1]={pos,cropId:id,date:shToYear(shIso(p.plantingDate),sh.tgtYear)}; sh.names[id]=p.cropName||sh.names[id]; n++; });
    sh.srcNote=n?('Layout copied from '+BLOCK_LABELS[sh.srcBlock]+' '+sh.srcYear+' ('+n+' beds'+(sh.srcYear!==sh.tgtYear?', dates moved to '+sh.tgtYear:'')+').')
                 :('There is no plan yet for '+BLOCK_LABELS[sh.srcBlock]+' '+sh.srcYear+' — starting with an empty sheet.');
    sh.dirty=false;
  }catch(e){ sh.err='Could not load that layout: '+errMsg(e); }
  sh.loadingSrc=false; render();
}
function shStartBlank(){ if(sh.dirty&&!confirm('Clear the layout you are editing?')) return; shBlankRows(); sh.dirty=false; sh.srcNote='Empty sheet.'; sh.msg=null; render(); }
function shSetSrc(k,v){ sh[k]=k==='srcYear'?+v:v; }
function shSetTgtBlock(b){ if(sh.busy||b===sh.tgtBlock) return; sh.tgtBlock=b; sh.msg=null; sh.err=''; sh.tgtNow={}; shLoadTarget(false); }
function shSetTgtYear(y){ if(sh.busy) return; sh.tgtYear=+y; sh.rows.forEach(r=>{ r.date=shToYear(r.date,sh.tgtYear); }); sh.msg=null; sh.err=''; sh.tgtNow={}; sh.loadingTgt=true; render(); shLoadCrops().then(()=>shLoadTarget(false)); }
function shDefaultDate(cropId){ const c=shCropObj(cropId); return c&&(c.windows||[]).length?sh.tgtYear+'-'+c.windows[0].start:''; }
function shSetCrop(i,v){
  const r=sh.rows[i]; r.cropId=v; if(v&&!r.date) r.date=shDefaultDate(v); if(!v) r.date='';
  sh.dirty=true; sh.msg=null; const d=document.getElementById('shd-'+i); if(d) d.value=r.date; shRefreshRow(i);
}
function shSetDate(i,v){ sh.rows[i].date=v; sh.dirty=true; sh.msg=null; shRefreshRow(i); }
function shRange(k,v){ sh.range[k]=(k==='from'||k==='to')?(+v||1):v; if(k==='cropId'&&v&&!sh.range.date){ sh.range.date=shDefaultDate(v); const d=document.getElementById('sh-rdate'); if(d) d.value=sh.range.date; } }
function shApplyRange(clear){
  const a=Math.min(sh.range.from,sh.range.to), b=Math.max(sh.range.from,sh.range.to);
  if(!clear&&(!sh.range.cropId||!sh.range.date)){ sh.msg={lines:[{t:'Choose a crop and a planting date for the range first.',bad:true}]}; render(); return; }
  shEnsureRows(b);
  for(let p=a;p<=b;p++){ const r=sh.rows[p-1]; r.cropId=clear?'':sh.range.cropId; r.date=clear?'':sh.range.date; }
  sh.dirty=true; sh.msg=null; render();
}
/* what each row would do on the target block */
function shRowState(r){
  const id=shBedId(r.pos), now=sh.tgtNow[id], nowCrop=shNowCrop(now), nowDate=shIso(now&&now.plantingDate);
  if(sh.tgtBeds&&!sh.tgtBeds.has(id)) return {k:'nobed',id,now,nowCrop};
  if(r.cropId&&!r.date) return {k:'needdate',id,now,nowCrop};
  if(!r.cropId&&r.date) return {k:'needcrop',id,now,nowCrop};
  if(r.cropId){
    if(nowCrop===r.cropId&&nowDate===r.date) return {k:'same',id,now,nowCrop};
    return {k:nowCrop?'change':'new',id,now,nowCrop};
  }
  return {k:(nowCrop&&sh.clearBlank)?'clear':'blank',id,now,nowCrop};
}
function shPlan(){
  const p={groups:{},clears:[],counts:{same:0,change:0,new:0,clear:0,blank:0,nobed:0},problems:[],confirmedHit:0,total:0};
  sh.rows.forEach(r=>{ const s=shRowState(r); p.counts[s.k]!==undefined&&p.counts[s.k]++;
    if(r.cropId) p.total++;
    if(s.k==='needdate'||s.k==='needcrop') p.problems.push(s.id+(s.k==='needdate'?' needs a planting date':' has a date but no crop'));
    if(s.k==='new'||s.k==='change'){ const key=r.cropId+'|'+r.date; (p.groups[key]=p.groups[key]||{cropId:r.cropId,date:r.date,bedIds:[]}).bedIds.push(s.id);
      if(s.now&&String(s.now.status||'').toUpperCase()==='CONFIRMED') p.confirmedHit++; }
    if(s.k==='clear') p.clears.push(s.id);
  });
  p.groupList=Object.values(p.groups); p.writes=p.counts.new+p.counts.change+p.counts.clear;
  return p;
}
function shChip(s,r){

    needdate:['chip-danger','Needs date'],needcrop:['chip-danger','Needs crop'],nobed:['chip-danger','No such bed']}[s.k];
  return `<span class="chip ${m[0]}">${m[1]}</span>${r.cropId&&shOutside(r)?` <span class="chip chip-warn" title="${esc((shCropObj(r.cropId)||{}).windowText||'')}">Outside window</span>`:''}`;

const SHEET_DEPLOY_TIMEOUT_MS=240000;   /* one request writes the whole block; allow Apps Script time to finish */
/* result lines for the one-request path (deploy-bed-layout, BedLayoutDeploy.gs) */
function shBatchLines(r,label){
  const lines=[{t:(r.saved||0)+' bed(s) saved to '+label+(r.failed?', '+r.failed+' refused:':'.'),bad:!!r.failed&&!r.saved}];
  (r.errors||[]).forEach(e=>lines.push({t:e.bedId+' — '+e.message,bad:true}));
  if(r.confirm) lines.splice(1,0,{t:r.confirm.confirmed+' confirmed · '+r.confirm.alreadyConfirmed+' already confirmed.'});
  (r.confirm&&r.confirm.skipped||[]).forEach(x=>lines.push({t:x.planId+' skipped — '+x.reason,bad:true}));
  if(r.confirmNote) lines.push({t:r.confirmNote});
  (r.warnings||[]).forEach(w=>lines.push({t:w.bedId+': '+w.message}));
  return lines;
}
/* fallback when the server has not been updated with deploy-bed-layout: one save-plan-beds call per distinct crop + date */
async function shDeployGrouped(p,y,b,label){
  const lines=[]; let saved=0, failed=0, done=0;
  const jobs=p.groupList.map(g=>({payload:{year:y,bedIds:g.bedIds,cropId:g.cropId,plantingDate:g.date},what:shCropName(g.cropId)+' '+g.date}));
  if(p.clears.length) jobs.push({payload:{year:y,bedIds:p.clears,clear:true},what:'clear'});
  for(const j of jobs){
    sh.progress=done+'/'+jobs.length; shRefreshSummary();
    try{
      const r=await apiCall('save-plan-beds',j.payload);
      saved+=r.saved||0; failed+=r.failed||0;
      (r.errors||[]).forEach(e=>lines.push({t:e.bedId+' — '+e.message,bad:true}));
      [].concat(...(r.results||[]).map(x=>(x.warnings||[]).map(w=>({t:x.bedId+': '+w})))).forEach(w=>lines.push(w));
    }catch(e){ failed+=j.payload.bedIds.length; lines.push({t:j.what+' ('+j.payload.bedIds.length+' beds) — '+errMsg(e),bad:true}); }
    done++;
  }
  lines.unshift({t:saved+' bed(s) saved to '+label+(failed?', '+failed+' refused:':'.'),bad:!!failed&&!saved});
  if(sh.confirmAfter&&!failed){
    try{ const c=await apiCall('confirm-plan-rows',{year:y,blockId:b});
      lines.splice(1,0,{t:c.confirmed+' confirmed · '+c.alreadyConfirmed+' already confirmed.'});
      (c.skipped||[]).forEach(s=>lines.push({t:s.planId+' skipped — '+s.reason,bad:true}));
    }catch(e){ lines.push({t:'Saved, but could not confirm: '+errMsg(e),bad:true}); }
  } else if(sh.confirmAfter&&failed) lines.push({t:'Not confirmed because some beds were refused. Fix them and deploy again — beds already saved will show "No change".'});
  lines.push({t:'Note: the server update (deploy-bed-layout) is not installed, so this used one slower save per crop and date.'});
  return lines;
}
async function shDeploy(){
  const p=shPlan(), y=sh.tgtYear, b=sh.tgtBlock, label=BLOCK_LABELS[b]+' '+y;
  if(p.problems.length){ sh.msg={lines:p.problems.map(t=>({t,bad:true}))}; render(); return; }
  if(!p.writes && !(sh.confirmAfter&&(p.counts.same||0)>0)){ sh.msg={lines:[{t:'Nothing to deploy — '+label+' already matches this layout.'}]}; render(); return; }
  const warn=(p.confirmedHit?'\n\n'+p.confirmedHit+' bed(s) are already CONFIRMED in '+label+'; changing them marks those rows MODIFIED'+(sh.confirmAfter?' and they will be re-confirmed.':'.'):'');
  if(!confirm('Deploy this layout to '+label+'?\n\n• '+p.counts.new+' new, '+p.counts.change+' changed'+(p.clears.length?', '+p.clears.length+' cleared':'')+', '+p.counts.same+' unchanged'
    +'\n• '+(sh.confirmAfter?'Rows will then be CONFIRMED (ready for Cohort Production).':'Rows will be saved as MODIFIED; confirm them afterwards.')+warn)) return;
  sh.busy=true; sh.err=''; sh.msg=null; sh.progress=''; render();
  const beds=[]; p.groupList.forEach(g=>g.bedIds.forEach(id=>beds.push({bedId:id,cropId:g.cropId,plantingDate:g.date}))); p.clears.forEach(id=>beds.push({bedId:id,clear:true}));
  let lines;
  try{
    const r=await apiCall('deploy-bed-layout',{year:y,blockId:b,beds,confirm:sh.confirmAfter},SHEET_DEPLOY_TIMEOUT_MS);
    lines=shBatchLines(r,label);
  }catch(e){
    if(String(e.code)==='UNKNOWN_ACTION') lines=await shDeployGrouped(p,y,b,label);
    else lines=[{t:errMsg(e),bad:true},{t:'If this was a timeout or a dropped connection, the server may still have finished. The table below reloads from the server, so check it before deploying again.'}];
  }
  delete state.pp[ppKey(y,b)]; sh.busy=false; sh.msg={lines};
  if(y===sh.tgtYear&&b===sh.tgtBlock) await shLoadTarget(true); else render();
}
